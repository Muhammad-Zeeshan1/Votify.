<style>
*,*::before,*::after{border-radius:0!important}

.font-display{font-family:'Sora',sans-serif}
.glass{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}

@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

.a-tab:hover{color:#fff}.a-tab.active{color:#fff;background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@keyframes lbGlow{0%,100%{box-shadow:0 0 10px -2px rgba(129,140,248,.5),inset 0 0 6px rgba(129,140,248,.2)}50%{box-shadow:0 0 26px -2px rgba(129,140,248,.95),inset 0 0 12px rgba(167,139,250,.45)}}
.lb-btn{padding:11px 20px;font-weight:800;font-size:13.5px;cursor:pointer;color:#C7C9DE;border:1px solid rgba(129,140,248,.6);background:linear-gradient(110deg,rgba(99,102,241,.1) 30%,rgba(167,139,250,.4) 48%,rgba(244,114,182,.25) 52%,rgba(99,102,241,.1) 70%);background-size:220% 100%;animation:lbShine 2.4s linear infinite,lbGlow 2.4s ease-in-out infinite;transition:.25s}

.lb-btn.active{color:#fff;border-color:#A5B4FC}

.w-title{font-family:'Sora';font-weight:800;font-size:46px;animation:wUp .7s .35s ease both}

.field-wrap{position:relative}

.vs-wrap{position:relative}.vs-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;background:linear-gradient(135deg,#6366F1,#A855F7);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:13px;color:#fff;box-shadow:0 8px 24px -6px rgba(99,102,241,.7);border:3px solid #0A0B16;z-index:5}

function hashPin(p){let h=0;const s=String(p);for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return 'pin'+(h>>>0).toString(36);}
function encPass(p){try{return btoa(unescape(encodeURIComponent(p)));}catch(e){return'';}}

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function mixHex(a,b){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex((A.r+B.r)/2,(A.g+B.g)/2,(A.b+B.b)/2);}

function dailyCardHTML(){const def=dailyDef(),today=localKey(new Date());const d=(MY.daily&&MY.daily.date===today)?MY.daily:{progress:0,done:false};const pct=Math.min(100,Math.round((d.progress||0)/def.target*100));return `<div class="glass-strong p-4 mb-5 flex items-center gap-3 flex-wrap" style="border-color:rgba(251,191,36,.35)"><div class="text-3xl">🎯</div><div class="flex-1 min-w-[200px]"><div class="flex justify-between text-[12.5px] font-bold"><span>Daily Challenge: ${def.n}</span><span style="color:${d.done?'#10B981':'#FCD34D'}">${d.done?'✅ Done':'+'+def.xp+' XP'}</span></div><div class="h-2.5 bg-white/10 mt-2 overflow-hidden border border-white/10"><div class="h-full hue-anim" style="width:${pct}%;background:linear-gradient(90deg,#FBBF24,#F97316)"></div></div><div class="text-[10.5px] text-white/40 mt-1">${Math.min(d.progress||0,def.target)}/${def.target}${d.done?' — completed! 🎉':' — keep going!'}</div></div></div>`;}
function mostVotedHTML(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));if(!live.length)return'';live.sort((a,b)=>votesOf(b[1])-votesOf(a[1]));const[id,b]=live[0],total=votesOf(b);if(!total)return'';const opts=b.options||[];const lead=opts.length?opts.reduce((m,o,i,arr)=>Object.keys(o.votes||{}).length>Object.keys(arr[m].votes||{}).length?i:m,0):0;return `<div class="glass-strong p-4 mb-5 card-hover cursor-pointer" style="border-color:rgba(251,191,36,.55);background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(255,255,255,.02))" onclick="openBattle('${id}')"><div class="flex items-center gap-3 flex-wrap"><div class="text-3xl">👑</div><div class="flex-1 min-w-[180px]"><div class="text-[10px] uppercase tracking-widest font-bold" style="color:#FCD34D">Most Voted Battle</div><div class="font-display font-extrabold text-[15.5px] leading-snug clamp2 mt-0.5">${esc(b.title)}</div><div class="text-[11px] text-white/45 mt-1">🏆 Leading: <b style="color:#FCD34D">${esc(opts[lead]?opts[lead].label:'Tie')}</b> · <span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span></div></div><div class="text-center"><div class="font-display font-extrabold text-2xl" style="color:#FCD34D">${fmt(total)}</div><div class="text-[9px] text-white/40 font-bold uppercase tracking-wider">total votes</div></div></div></div>`;}
function battleOfDayHTML(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));if(live.length<3)return'';live.sort((a,b)=>votesOf(b[1])-votesOf(a[1]));const d=new Date(),seed=+(String(d.getFullYear())+String(d.getMonth()+1)+String(d.getDate()));const pick=live[seed%Math.min(5,live.length)];if(!pick)return'';const[id,b]=pick;const opts=b.options||[];const counts=opts.map(o=>Object.keys(o.votes||{}).length);const mx=Math.max(...counts,0);const wi=counts.indexOf(mx);return `<div class="botd p-4 mb-5 cursor-pointer card-hover" onclick="openBattle('${id}')"><div class="flex items-center gap-2 mb-2 flex-wrap"><span class="badge" style="color:#FCD34D;border-color:rgba(251,191,36,.5)"><span class="live-dot"></span>⭐ BATTLE OF THE DAY</span><span class="badge">${new Date().toLocaleDateString('en-US',{weekday:'long'})}</span></div><div class="font-display font-extrabold text-[17px] leading-snug clamp2 mb-2">${esc(b.title)}</div><div class="flex items-center justify-between text-[11.5px] text-white/50 font-semibold flex-wrap gap-2"><span>🗳 ${fmt(votesOf(b))} votes · 🏆 ${esc(opts[wi]?opts[wi].label:'Tie')}</span><span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span></div></div>`;}
function trendingHTML(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));live.sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));const top=live.slice(0,10);if(!top.length)return'';return `<div class="mb-6"><div class="flex items-center gap-2 mb-3 flex-wrap"><i data-lucide="flame" class="w-5 h-5 text-orange-400"></i><b class="font-display text-lg">Trending</b><span class="badge" style="color:#F97316">🔥 TOP</span><span class="text-[10.5px] text-white/35 font-semibold" style="margin-left:auto">latest battles first · swipe →</span></div><div class="flex gap-3 overflow-x-auto pb-2">${top.map(([id,b],i)=>`<div class="glass card-hover trend-box cursor-pointer" style="border-color:${i===0?'rgba(249,115,22,.5)':'rgba(255,255,255,.09)'}" onclick="openBattle('${id}')"><div class="flex items-center gap-1.5 mb-1.5 flex-wrap">${i===0?'<span class="badge" style="color:#FCD34D;border-color:rgba(251,191,36,.5)">👑 TOP</span>':`<span class="font-display font-extrabold text-[11px]" style="color:#F97316">🔥 #${i+1}</span>`}${b.tournament?'<span class="badge" style="color:#FCD34D">🥇</span>':''}${b.anon?'<span class="badge" style="color:#8A8DA3">🙈</span>':''}</div><div class="font-display font-bold text-[12.5px] leading-snug clamp2 mb-2" style="min-height:33px">${esc(b.title)}</div><div class="flex justify-between text-[10.5px] text-white/40 font-semibold"><span>🗳 ${fmt(votesOf(b))}</span><span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span></div></div>`).join('')}</div></div>`;}
function statusRingsHTML(){const ups=statusUploaders();if(!ups.length&&!statusesOf(MY.uid).length)return'';let html=`<div class="mb-5"><div class="flex items-center gap-2 mb-2.5"><i data-lucide="circle-dot" class="w-4 h-4 text-pink-400"></i><b class="font-display text-[15px]">Status</b><span class="badge" style="color:#EC4899">Shorts</span></div><div class="flex gap-3 overflow-x-auto pb-2">`;html+=`<div style="text-align:center;cursor:pointer" onclick="openStatusScreen()"><div class="st-ring ${hasUnseenStatus(MY.uid)?'':'seen'}" style="background:linear-gradient(135deg,#6366F1,#A855F7)">${statusesOf(MY.uid).length?`<img src="${MY.avatar||AVATAR_PRESETS[0]}">`:`<div>＋</div>`}</div><div class="text-[9.5px] font-bold text-white/50 mt-1">My status</div></div>`;ups.slice(0,20).forEach(uid=>{const u=allUsers[uid]||{};const un=hasUnseenStatus(uid);html+=`<div style="text-align:center;cursor:pointer" onclick="openStatusScreen('${uid}')"><div class="st-ring ${un?'':'seen'}"><img src="${u.avatar||AVATAR_PRESETS[0]}"></div><div class="text-[9.5px] font-bold text-white/50 mt-1 truncate" style="max-width:64px">${esc(u.name||'User')}</div></div>`;});return html+'</div></div>';}
async function toggleFollow(uid){if(!uid||uid===MY.uid)return;const f=myFollowing.has(uid),u=allUsers[uid];if(f){myFollowing.delete(uid);await db.ref('follows/'+MY.uid+'/following/'+uid).remove();await db.ref('follows/'+uid+'/followers/'+MY.uid).remove();await db.ref('users/'+uid+'/followersCount').set(Math.max(0,(u&&u.followersCount)||1)-1);await db.ref('users/'+MY.uid+'/followingCount').set(Math.max(0,myFollowing.size));toast('Unfollowed','info');}else{myFollowing.add(uid);await db.ref('follows/'+MY.uid+'/following/'+uid).set(true);await db.ref('follows/'+uid+'/followers/'+MY.uid).set(true);await db.ref('users/'+uid+'/followersCount').set(((u&&u.followersCount)||0)+1);await db.ref('users/'+MY.uid+'/followingCount').set(myFollowing.size);pushNotif(uid,'follow',MY.name+' started following you 🎉',{});toast('Following ✅','success');beep();}if(statusOpen)styRerender();else render();}
function openGiftXP(uid){const u=allUsers[uid];if(!u)return toast('User not found','error');$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2.5"><div class="w-9 h-9 flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F97316)"><i data-lucide="gift" class="w-4 h-4 text-white"></i></div><b class="font-display text-[16px]">🎁 Gift XP</b></div><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="flex items-center gap-3 mb-3"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover"><div><b class="text-[14px]">${esc(u.name)}</b><div class="text-[10.5px] text-cyan-300 font-bold">${userCode(uid)}</div></div></div><div class="glass p-2.5 mb-3 text-[12.5px]">Your balance: <b class="text-yellow-300">${fmt(MY.xp||0)} XP</b></div><input id="gift-amt" type="number" min="1" class="input-field" placeholder="Custom amount (e.g. 50)" onkeydown="if(event.key==='Enter')sendGiftXP('${uid}')"><div class="flex gap-2 mt-2 flex-wrap">${[10,50,100,250,500].map(v=>`<button class="a-btn" onclick="document.getElementById('gift-amt').value=${v}">+${v}</button>`).join('')}</div><button class="btn-primary w-full py-3 font-bold mt-4" onclick="sendGiftXP('${uid}')" style="background:linear-gradient(135deg,#FBBF24,#F97316)">🎁 Send Gift</button></div></div>`;lucide.createIcons();}
async function sendGiftXP(uid){const u=allUsers[uid];if(!u)return toast('User not found','error');const amt=parseInt($('#gift-amt').value,10);if(isNaN(amt)||amt<=0)return toast('Enter a valid amount','warning');if(amt>(MY.xp||0))return toast('Not enough XP!','warning');const myNew=(MY.xp||0)-amt,theirNew=(u.xp||0)+amt;await db.ref('users/'+MY.uid+'/xp').set(myNew);await db.ref('users/'+uid+'/xp').set(theirNew);MY.xp=myNew;pushNotif(uid,'gift',MY.name+' gifted you '+amt+' XP! 🎁',{});closeModal();flyXP('🎁 '+amt+' XP → '+u.name);fireConfetti();beep();}
function pageGift(){window._sgQ=window._sgQ||'';return `<div class="max-w-3xl mx-auto fade-up"><button class="btn-ghost px-4 py-2 text-sm font-bold mb-5" onclick="navBack()">← Back</button><div class="flex items-center gap-3 mb-1"><div class="w-11 h-11 flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F97316)"><i data-lucide="gift" class="w-5 h-5 text-white"></i></div><div><h2 class="font-display font-extrabold text-2xl">🎁 Send Gift</h2><div class="text-[11px] text-white/40 font-bold uppercase tracking-wider">Gift your XP to any user</div></div></div><div class="glass p-3 flex items-center gap-2 mt-4 mb-3"><i data-lucide="search" class="w-4 h-4 text-white/30"></i><input class="bg-transparent border-none flex-1 text-white text-sm" placeholder="Search users by name..." value="${esc(window._sgQ)}" oninput="window._sgQ=this.value;renderGiftList()"></div><div class="glass p-2.5 mb-4 text-[12.5px]">Your balance: <b class="text-yellow-300">${fmt(MY.xp||0)} XP</b></div><div id="sg-list">${giftListHTML()}</div></div>`;}
function giftListHTML(){const q=(window._sgQ||'').toLowerCase();return Object.entries(allUsers).filter(([uid,u])=>uid!==MY.uid&&uid!=='system'&&!bannedUsers.has(uid)&&(!q||(u.name||'').toLowerCase().includes(q))).map(([uid,u])=>`<div class="a-row"><div style="position:relative"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover">${isOnline(uid)?'<span class="live-dot" style="position:absolute;bottom:-2px;right:-2px;border:2px solid #0A0B14"></span>':''}</div><div class="flex-1 min-w-[110px] cursor-pointer" onclick="openUser('${uid}')"><b class="text-[13px]">${esc(u.name)}</b> <span class="text-[9px] text-cyan-300 font-bold">${userCode(uid)}</span><div class="text-[10px] text-white/40">⚡ Level ${levelOf(u.xp||0)} · ${fmt(u.xp||0)} XP</div></div><button class="a-btn gift" onclick="openGiftXP('${uid}')">🎁 Gift</button></div>`).join('')||emptyState('gift','No users found');}
function renderGiftList(){const el=$('#sg-list');if(el){el.innerHTML=giftListHTML();lucide.createIcons();}}
function pageSuggest(){return `<div class="max-w-3xl mx-auto fade-up"><button class="btn-ghost px-4 py-2 text-sm font-bold mb-5" onclick="navBack()">← Back</button><div class="flex items-center gap-3 mb-1"><div class="w-11 h-11 flex items-center justify-center" style="background:linear-gradient(135deg,#8B5CF6,#06B6D4)"><i data-lucide="lightbulb" class="w-5 h-5 text-white"></i></div><div><h2 class="font-display font-extrabold text-2xl">💡 Suggest an Idea</h2><div class="text-[11px] text-white/40 font-bold uppercase tracking-wider">Tell the admin what to add!</div></div></div><div class="glass-strong p-5 mt-4"><textarea id="sug-text" class="input-field" rows="4" maxlength="300" placeholder="e.g. Please add a quiz feature..."></textarea><button class="btn-primary w-full py-3 font-bold text-[13.5px] mt-3" onclick="sendSuggestionPage()" style="background:linear-gradient(135deg,#8B5CF6,#06B6D4)">📨 Send Suggestion</button></div><h3 class="font-display font-bold text-lg mt-7 mb-3">My Suggestions</h3><div id="my-sug-list">${mySuggestionsHTML()}</div></div>`;}
function mySuggestionsHTML(){return allSuggestions.filter(s=>s.uid===MY.uid).map(s=>`<div class="glass p-3.5 mb-2.5"><div class="text-[13px] text-white/85 whitespace-pre-wrap">💡 ${esc(s.text)}</div><div class="text-[10.5px] text-white/35 mt-1.5">${fmtDate(s.ts)} · ${fmtClock(s.ts)} · ${fmtTime(s.ts)}</div></div>`).join('')||emptyState('lightbulb','No suggestions yet');}
async function sendSuggestionPage(){const t=$('#sug-text').value.trim();if(t.length<5)return toast('Suggestion too short','warning');await db.ref('suggestions').push({uid:MY.uid,name:MY.name,avatar:MY.avatar,text:t,ts:Date.now()});$('#sug-text').value='';toast('💡 Suggestion sent to admin!','success');beep();const el=$('#my-sug-list');if(el){el.innerHTML=mySuggestionsHTML();lucide.createIcons();}}
function pageSuggestions(){return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">📨 Suggestions</h2><p class="text-white/45 text-sm mb-5">${allSuggestions.length} user suggestions</p>${allSuggestions.map(s=>{const u=allUsers[s.uid];return `<div class="glass card-hover p-4 mb-3" style="border-color:rgba(167,139,250,.3)"><div class="flex items-center gap-2.5 flex-wrap mb-2"><img src="${(s.avatar||(u||{}).avatar)||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover cursor-pointer" onclick="openUser('${s.uid}')"><div class="flex-1 min-w-[130px]"><b class="text-[13.5px]">${esc(s.name)}</b> <span class="text-[9px] text-cyan-300 font-bold">${userCode(s.uid)}</span><div class="text-[10.5px] text-white/40">${fmtDate(s.ts)} · ${fmtTime(s.ts)}</div></div><button class="a-btn" onclick="startDM('${s.uid}')">💬 Message</button><button class="a-btn danger" onclick="delSuggestion('${s.id}')">🗑 Delete</button></div><div class="text-[13.5px] text-white/85 whitespace-pre-wrap">💡 ${esc(s.text)}</div></div>`;}).join('')||emptyState('lightbulb','No suggestions yet')}</div>`;}
async function delSuggestion(id){if(!confirm('Delete this suggestion?'))return;await db.ref('suggestions/'+id).remove();toast('Suggestion deleted','info');}
function openPostModal(){window._postImg=null;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[17px]">➕ Create Post</b><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><label class="lbl">Text</label><textarea id="pt-text" class="input-field" rows="3" placeholder="Share your thoughts..."></textarea><label class="lbl">Image (optional)</label><label class="btn-ghost px-4 py-2.5 text-[13px] font-bold cursor-pointer inline-flex items-center gap-2">📷 Add Image<input type="file" accept="image/*" hidden onchange="pickPostImg(this)"></label><div id="pt-img-prev" class="mt-2"></div><label class="lbl">Poll (optional)</label><input id="pt-q" class="input-field" style="margin-bottom:6px" placeholder="Poll question"><div class="grid grid-cols-2 gap-2">${[0,1,2,3].map(i=>`<input id="pt-o${i}" class="input-field" maxlength="30" placeholder="Option ${i+1}${i>1?' (optional)':''}">`).join('')}</div><button class="btn-primary w-full py-3 font-bold mt-4" onclick="createPost()">🚀 Post</button></div></div>`;lucide.createIcons();}
async function pickPostImg(inp){const f=inp.files[0];if(!f)return;if(f.size>8*1048576)return toast('Image too big (max 8MB)','warning');try{const d=await compressImage(f,700,.65);window._postImg=d;$('#pt-img-prev').innerHTML=`<div class="glass p-2 flex items-center gap-2"><img src="${d}" class="w-14 h-14 object-cover"><span class="text-[12px] text-white/60 flex-1">Image ready</span><button class="a-btn danger" onclick="window._postImg=null;document.getElementById('pt-img-prev').innerHTML=''">Remove</button></div>`;}catch(e){toast('Could not load image','error');}}
async function createPost(){const text=$('#pt-text').value.trim(),img=window._postImg,q=$('#pt-q').value.trim();const opts=[0,1,2,3].map(i=>($('#pt-o'+i).value||'').trim()).filter(Boolean);if(!text&&!img&&!q)return toast('Write something or add image/poll','warning');if(q&&opts.length<2)return toast('Poll needs at least 2 options','warning');const p={uid:MY.uid,name:MY.name,avatar:MY.avatar,ts:Date.now(),likes:{}};if(text)p.text=text;if(img)p.img=img;if(q&&opts.length>=2)p.poll={q,opts:opts.map(l=>({label:l,votes:{}}))};await db.ref('posts').push(p);await db.ref('users/'+MY.uid).update({postsCount:(MY.postsCount||0)+1});incDaily('post');window._postImg=null;closeModal();toast('Post created! 🚀','success');}
async function delPost(id){if(!confirm('Delete this post?'))return;const p=allPosts.find(x=>x.id===id);await db.ref('posts/'+id).remove();if(p&&p.uid===MY.uid)await db.ref('users/'+MY.uid).update({postsCount:Math.max(0,(MY.postsCount||1)-1)});toast('Post deleted','info');}
async function reactPost(id,emo){const p=allPosts.find(x=>x.id===id);if(!p)return;const mine=(p.likes||{})[MY.uid];const ref=db.ref('posts/'+id+'/likes/'+MY.uid);if(mine===emo)await ref.remove();else{await ref.set(emo);if(!mine&&p.uid!==MY.uid)pushNotif(p.uid,'react',MY.name+' reacted '+emo+' to your post',{});incDaily('react');}}
async function votePostPoll(id,oi){const p=allPosts.find(x=>x.id===id);if(!p||!p.poll)return;const prev=p.poll.opts.findIndex(o=>(o.votes||{})[MY.uid]);if(prev===oi)return toast('You already voted this option','warning');const u={};if(prev>=0)u['posts/'+id+'/poll/opts/'+prev+'/votes/'+MY.uid]=null;u['posts/'+id+'/poll/opts/'+oi+'/votes/'+MY.uid]=Date.now();await db.ref().update(u);if(prev<0){incDaily('vote');beep();toast('Poll vote cast! ✅','success');}}
function postCard(p){const mine=p.uid===MY.uid,likes=p.likes||{},counts={};Object.values(likes).forEach(e=>counts[e]=(counts[e]||0)+1);const myLike=likes[MY.uid];let pollHTML='';if(p.poll){const opts=p.poll.opts||[],tot=opts.reduce((a,o)=>a+Object.keys(o.votes||{}).length,0),my=opts.findIndex(o=>(o.votes||{})[MY.uid]);pollHTML=`<div class="glass p-3 mt-3"><div class="font-bold text-[14px] mb-2">📊 ${esc(p.poll.q)}</div>${opts.map((o,i)=>{const c=Object.keys(o.votes||{}).length,pct=tot?Math.round(c/tot*100):0;return `<div class="relative mb-1.5 cursor-pointer" style="border:1px solid ${my===i?'rgba(99,102,241,.6)':'rgba(255,255,255,.12)'};padding:8px 10px;overflow:hidden" onclick="votePostPoll('${p.id}',${i})"><div class="absolute inset-y-0 left-0 gradient-brand opacity-25" style="width:${pct}%"></div><div class="relative flex justify-between text-[13px] font-semibold"><span>${esc(o.label)}${my===i?' ✓':''}</span><span>${pct}%</span></div></div>`;}).join('')}<div class="text-[10.5px] text-white/35 mt-1">🗳 ${tot} votes</div></div>`;}return `<div class="glass p-4 mb-3 fade-up"><div class="flex items-center gap-2.5 flex-wrap"><img src="${p.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover cursor-pointer" onclick="openUserModal('${p.uid}')"><div class="min-w-0 flex-1 cursor-pointer" onclick="openUserModal('${p.uid}')"><b class="text-[13.5px]" style="color:${colorFor(p.uid)}">${esc(p.name)}</b> <span class="text-[9px] text-cyan-300 font-bold">${userCode(p.uid)}</span><div class="text-[10.5px] text-white/35">${fmtTime(p.ts)}</div></div>${!mine?`<button class="a-btn ${myFollowing.has(p.uid)?'':'gift'}" style="padding:4px 10px;font-size:11px" onclick="toggleFollow('${p.uid}')">${myFollowing.has(p.uid)?'✓ Following':'➕ Follow'}</button>`:''}${mine?`<button class="a-btn danger" style="padding:4px 10px;font-size:11px" onclick="delPost('${p.id}')">🗑</button>`:''}</div>${p.text?`<div class="text-[14px] text-white/85 whitespace-pre-wrap mt-2.5">${esc(p.text)}</div>`:''}${p.img?`<img src="${p.img}" class="w-full mt-2.5 cursor-pointer" style="max-height:320px;object-fit:cover" onclick="viewImg(this.src)">`:''}${pollHTML}<div class="flex items-center gap-1.5 mt-3 flex-wrap">${REACTIONS.map(e=>`<button class="a-btn" style="${myLike===e?'background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.6)':''}" onclick="reactPost('${p.id}','${e}')">${e}${counts[e]?' '+counts[e]:''}</button>`).join('')}<span class="text-[10.5px] text-white/30" style="margin-left:auto">${fmtTime(p.ts)}</span></div></div>`;}

async function toggleBookmark(id){if(myBookmarks.has(id)){await db.ref('users/'+MY.uid+'/bookmarks/'+id).remove();toast('Removed from saved','info');}else{await db.ref('users/'+MY.uid+'/bookmarks/'+id).set(true);toast('Saved 🔖','success');}}

function genSuggestions(topic){const t=(topic||'').toLowerCase().trim();for(const[kw,a,b,cat]of RIVALS){if(t.includes(kw))return[{title:`${a} vs ${b} — Which one wins?`,cat,opts:[a,b],tags:[kw]},{title:`Team ${a} or Team ${b}?`,cat,opts:[a,b],tags:[kw,'teams']},{title:`${a} vs ${b} — The Ultimate Showdown`,cat,opts:[a,b],tags:[kw,'ultimate']}];}if(/ vs /.test(t)){const p=t.split(/\s+vs\s+/i);if(p.length>=2&&p[0].trim()&&p[1].trim()){const a=p[0].trim(),b=p[1].trim();return[{title:`${a} vs ${b} — Which one wins?`,cat:'memes',opts:[a,b],tags:['debate']},{title:`Team ${a} or Team ${b}?`,cat:'memes',opts:[a,b],tags:['teams']},{title:`${a} vs ${b} — Final Verdict`,cat:'memes',opts:[a,b],tags:['verdict']}];}}const top=topic||'Everything';return[{title:`Best ${top} — You Decide!`,cat:'memes',opts:[`${top} Lovers 💯`,`${top} Haters 😤`],tags:['fun']},{title:`Is ${top} overrated?`,cat:'memes',opts:['Yes, totally 🙄','No, great! 🔥'],tags:['overrated']},{title:`Rate ${top}: Hot or Not?`,cat:'memes',opts:['🔥 Hot','❄ Not'],tags:['rate']}];}
function openSuggest(){$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2.5"><div class="w-9 h-9 flex items-center justify-center" style="background:linear-gradient(135deg,#06B6D4,#8B5CF6)"><i data-lucide="sparkles" class="w-4 h-4 text-white"></i></div><b class="font-display text-[16px]">✨ AI Battle Suggestions</b></div><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><p class="text-[12px] text-white/45 mb-3">Type a topic — AI will suggest titles, options and category!</p><div class="flex gap-2 mb-4"><input id="sg-topic" class="input-field flex-1" placeholder="Enter topic..." onkeydown="if(event.key==='Enter')sgGenerate()"><button class="btn-primary px-4 font-bold text-sm" onclick="sgGenerate()">✨</button></div><div id="sg-results"></div></div></div>`;lucide.createIcons();setTimeout(()=>$('#sg-topic')?.focus(),100);}
function sgGenerate(){const topic=$('#sg-topic').value.trim();$('#sg-results').innerHTML=genSuggestions(topic).map((s,i)=>`<div class="glass p-3 mb-2.5"><div class="font-display font-bold text-[13.5px] mb-1">${esc(s.title)}</div><div class="text-[12px] text-white/60 mb-1">${esc(s.opts[0])} ⚔ ${esc(s.opts[1])}</div><div class="flex items-center gap-2 flex-wrap"><span class="badge" style="color:${catOf(s.cat).color}">${catOf(s.cat).name}</span>${s.tags.map(t=>`<span class="badge">#${esc(t)}</span>`).join('')}<button class="a-btn" style="margin-left:auto" onclick="applySuggestion(${i})">✅ Use</button></div></div>`).join('');}

function battleReactionsHTML(b){const counts={};Object.values(b.rx||{}).forEach(e=>counts[e]=(counts[e]||0)+1);const mine=(b.rx||{})[MY.uid];return `<div class="glass p-4 mt-4 flex items-center gap-2 flex-wrap"><span class="text-[11px] font-bold uppercase tracking-wider text-white/40">React:</span>${REACTIONS.map(e=>`<button class="a-btn" style="${mine===e?'background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.6)':''}" onclick="reactBattle('${viewParam}','${e}')">${e}${counts[e]?' '+counts[e]:''}</button>`).join('')}</div>`;}
function battleStatsHTML(b){const opts=b.options||[],times=[];opts.forEach(o=>Object.values(o.votes||{}).forEach(ts=>{if(ts)times.push(ts);}));if(!times.length)return'';const start=b.createdAt||Math.min(...times),end=Math.max(b.endsAt||Date.now(),Math.max(...times)),span=Math.max(end-start,1),N=12,buckets=new Array(N).fill(0);times.forEach(ts=>{let i=Math.floor((ts-start)/span*N);if(i<0)i=0;if(i>=N)i=N-1;buckets[i]++;});const mx=Math.max(...buckets,1),voters=times.length,part=Math.round(voters/Math.max(1,Object.keys(allUsers).length)*100),avgH=span/36e5,vph=avgH>0?(voters/avgH).toFixed(1):voters;let vh='';if(!b.anon){vh=opts.flatMap(o=>Object.entries(o.votes||{}).map(([uid,ts])=>({uid,ts}))).sort((a,b)=>b.ts-a.ts).slice(0,5).map(v=>{const u=allUsers[v.uid];return u?`<img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-6 h-6 object-cover cursor-pointer" title="${esc(u.name)}" onclick="openUser('${v.uid}')">`:'';}).join('');}return `<div class="glass p-5 mt-4"><div class="flex items-center gap-2 mb-4"><i data-lucide="activity" class="w-5 h-5 text-emerald-400"></i><b class="font-display">📊 Battle Statistics</b></div><div class="flex items-end gap-1.5 mb-4" style="height:64px">${buckets.map(c=>`<div class="flex-1 gradient-brand" style="height:${Math.max(6,c/mx*100)}%;opacity:${.35+.65*(c/mx)}" title="${c}"></div>`).join('')}</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="stat-tile"><b class="text-emerald-400" data-count="${voters}">0</b><span>Total voters</span></div><div class="stat-tile"><b class="text-cyan-300">${part}%</b><span>Participation</span></div><div class="stat-tile"><b class="text-indigo-300">${vph}</b><span>Votes / hour</span></div><div class="stat-tile"><b class="text-yellow-300" data-count="${mx}">0</b><span>Peak</span></div></div>${vh?`<div class="flex items-center gap-2 mt-3"><span class="text-[11px] text-white/40 font-bold">Recent voters:</span><div class="flex gap-1.5">${vh}</div></div>`:''}</div>`;}
async function reactComment(cid,emo){const cur=battleComments.find(c=>c.id===cid);if(!cur)return;const mine=(cur.rx||{})[MY.uid];const ref=db.ref('comments/'+battleListenId+'/'+cid+'/rx/'+MY.uid);if(mine===emo)await ref.remove();else{await ref.set(emo);if(cur.uid!==MY.uid)pushNotif(cur.uid,'react',MY.name+' reacted '+emo+' to your comment',{bid:battleListenId});}}
function viewPublicVotes(id){const b=allBattles[id];if(!b)return;const html=(b.options||[]).map(o=>{const vs=Object.entries(o.votes||{}).map(([uid,ts])=>{const u=allUsers[uid];return `<div class="a-row" style="cursor:pointer" onclick="closeModal();openUser('${uid}')"><img src="${(u||{}).avatar||AVATAR_PRESETS[0]}" class="w-7 h-7 object-cover"><b class="text-[12px]">${esc(u?u.name:'Unknown user')}</b>${uidChip(uid)}<span class="text-[10px] text-white/35" style="margin-left:auto">${fmtTime(ts)}</span></div>`;}).join('');return `<div class="mb-4"><div class="flex items-center gap-2 mb-1.5"><b class="font-display text-[13.5px]">${esc(o.label)}</b><span class="badge">${Object.keys(o.votes||{}).length} votes</span></div>${vs||'<div class="text-white/30 text-[11.5px] mb-2">No votes yet</div>'}</div>`;}).join('');$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[15px]">👁 Who Voted Whom</b><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="text-[12px] text-white/50 mb-3">${esc(b.title)}</div>${html}</div></div>`;lucide.createIcons();}

function tSetSize(n){tSize=n;while(tOpts.length<n)tOpts.push('');tOpts=tOpts.slice(0,n);renderTModal();}
function renderTModal(){$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2.5"><div class="w-9 h-9 flex items-center justify-center" style="background:linear-gradient(135deg,#FCD34D,#F97316)"><i data-lucide="medal" class="w-4 h-4 text-white"></i></div><b class="font-display text-[16px]">🥇 Create Tournament</b></div><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><p class="text-[12px] text-white/45 mb-3">Knockout battles — winners advance automatically!</p><label class="lbl">Tournament Name</label><input id="tm-name" class="input-field" maxlength="40" placeholder="e.g. Best Movie Character Cup"><label class="lbl">Category</label><select id="tm-cat" class="input-field">${CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><label class="lbl">Players</label><div class="flex gap-2 mb-3"><button class="a-tab ${tSize===4?'active':''}" onclick="tSetSize(4)">4 Players</button><button class="a-tab ${tSize===8?'active':''}" onclick="tSetSize(8)">8 Players</button></div><label class="lbl">Options</label>${tOpts.map((v,i)=>`<input class="input-field" style="margin-bottom:6px" maxlength="30" placeholder="Player ${i+1}" value="${esc(v)}" oninput="tOpts[${i}]=this.value">`).join('')}<button class="btn-primary w-full py-3 font-bold mt-3" onclick="createTournament()">🚀 Start</button></div></div>`;lucide.createIcons();}
async function createTournament(){const name=$('#tm-name').value.trim(),cat=$('#tm-cat').value,opts=tOpts.map(o=>o.trim()).filter(Boolean);if(name.length<3)return toast('Name too short','warning');if(opts.length!==tSize)return toast('All '+tSize+' options required','warning');if(new Set(opts).size!==opts.length)return toast('Options must be unique','warning');const tref=await db.ref('tournaments').push({name,size:tSize,category:cat,options:opts,creator:MY.uid,creatorName:MY.name,createdAt:Date.now(),round:1,status:'active',winner:'',matches:{}});const nids={};for(let i=0;i<opts.length;i+=2){const bref=await db.ref('battles').push({title:`${name} — R1: ${opts[i]} vs ${opts[i+1]}`,category:cat,creator:MY.uid,creatorName:MY.name,createdAt:Date.now(),endsAt:Date.now()+864e5,tournament:tref.key,round:1,match:i/2,options:[{label:opts[i],img:'',votes:{}},{label:opts[i+1],img:'',votes:{}}]});nids[i/2]=bref.key;}await db.ref('tournaments/'+tref.key+'/matches/1').set(nids);await db.ref('users/'+MY.uid+'/achievements/tournament1').set(Date.now());closeModal();toast('Tournament started! 🥇','success');fireConfetti();navTo('tournaments');}
async function checkTournaments(){if(!MY)return;for(const[id,t]of Object.entries(allTournaments)){if(!t||t.status!=='active')continue;const ms=t.matches&&t.matches[t.round];if(!ms)continue;const ids=Object.values(ms);if(ids.length<2)continue;const battles=ids.map(b=>allBattles[b]);if(battles.some(b=>!b)||battles.some(b=>Date.now()<=(b.endsAt||0)))continue;const winners=battles.map(b=>{const o=b.options||[],c=o.map(x=>Object.keys(x.votes||{}).length),tot=c.reduce((a,x)=>a+x,0);if(!tot)return null;const mx=Math.max(...c);return c.filter(x=>x===mx).length===1?o[c.indexOf(mx)].label:null;});if(winners.some(w=>!w)){for(let i=0;i<battles.length;i++)if(!winners[i])await db.ref('battles/'+ids[i]+'/endsAt').set(Date.now()+216e5);continue;}if(winners.length===1){await db.ref('tournaments/'+id).update({status:'finished',winner:winners[0]});if(t.creator&&t.creator!==MY.uid)pushNotif(t.creator,'tournament','🏆 Your tournament "'+t.name+'" finished! Winner: '+winners[0],{});continue;}const no=winners.map(w=>({label:w})),nids={};for(let i=0;i<no.length;i+=2){const bref=await db.ref('battles').push({title:t.name+' — R'+(t.round+1)+': '+no[i].label+' vs '+no[i+1].label,category:t.category,creator:t.creator,creatorName:t.creatorName,createdAt:Date.now(),endsAt:Date.now()+864e5,tournament:id,round:t.round+1,match:i/2,options:[{label:no[i].label,img:'',votes:{}},{label:no[i+1].label,img:'',votes:{}}]});nids[i/2]=bref.key;}await db.ref('tournaments/'+id+'/matches/'+(t.round+1)).set(nids);await db.ref('tournaments/'+id+'/round').set(t.round+1);toast('🥇 Tournament "'+t.name+'" — Round '+(t.round+1)+' started!','success');}}
function tournamentCard(id,t){const totalR=Math.round(Math.log2(t.size||4));let cols='';for(let r=1;r<=totalR;r++){const ms=(t.matches||{})[r]||{};cols+=`<div style="min-width:200px;flex:1"><div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-1.5">${r===totalR?'🏆 Final':'Round '+r}</div>${Object.values(ms).map(bid=>{const b=allBattles[bid];if(!b)return'';const ended=Date.now()>(b.endsAt||0);let wl='';if(ended){const c=(b.options||[]).map(o=>Object.keys(o.votes||{}).length),mx=Math.max(...c);if(c.filter(x=>x===mx).length===1)wl=b.options[c.indexOf(mx)].label;}return `<div class="glass p-2.5 mb-1.5 cursor-pointer flex items-center gap-2" onclick="openBattle('${bid}')"><i data-lucide="swords" class="w-3.5 h-3.5 text-white/30"></i><span class="text-[11.5px] flex-1 truncate">${esc((b.options||[]).map(o=>o.label).join(' vs '))}</span>${wl?`<span class="badge" style="color:#FCD34D">🏆 ${esc(wl)}</span>`:`<span class="badge tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span>`}</div>`;}).join('')||'<div class="text-[11px] text-white/25 px-1 py-2">Coming soon…</div>'}</div>`;}return `<div class="glass-strong p-4 mb-4"><div class="flex items-center gap-2 flex-wrap mb-3"><i data-lucide="medal" class="w-5 h-5" style="color:#FCD34D"></i><b class="font-display text-[16px] flex-1 min-w-[150px]">${esc(t.name)}</b><span class="badge" style="color:${catOf(t.category).color}">${catOf(t.category).name}</span><span class="badge">${t.size} players</span>${t.status==='finished'?'<span class="badge" style="color:#10B981">✅ Finished</span>':`<span class="badge" style="color:#F97316">Round ${t.round} live</span>`}</div>${t.status==='finished'?`<div class="glass p-3 text-center mb-3" style="border-color:rgba(251,191,36,.4)"><div class="text-[10px] uppercase tracking-widest text-white/40 font-bold mb-0.5">🏆 Winner</div><div class="font-display font-extrabold text-xl golden-quote">${esc(t.winner)}</div></div>`:''}<div class="flex gap-3 overflow-x-auto">${cols}</div><div class="text-[10.5px] text-white/30 mt-2">by ${esc(t.creatorName||'')} · ${fmtDate(t.createdAt)}</div></div>`;}
function pageTournaments(){const ts=Object.entries(allTournaments).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));return `<div class="max-w-4xl mx-auto fade-up"><div class="flex items-center justify-between flex-wrap gap-3 mb-5"><div><h2 class="font-display font-extrabold text-2xl mb-1">🥇 Tournaments</h2><p class="text-white/45 text-sm">Knockout battles</p></div><button class="btn-primary px-5 py-3 font-bold text-sm" onclick="openTournamentModal()">➕ Create</button></div>${ts.map(([id,t])=>tournamentCard(id,t)).join('')||emptyState('medal','No tournaments yet')}</div>`;}

function analyzeImage(src){return new Promise(res=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{if(!img.width||!img.height)return res({ok:false});const S=56,sc=Math.min(1,S/Math.max(img.width,img.height)),w=Math.max(2,Math.round(img.width*sc)),h=Math.max(2,Math.round(img.height*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);const d=ctx.getImageData(0,0,w,h).data;let lum=0,sat=0,n=w*h;const lums=new Array(n);for(let i=0;i<n;i++){const j=i*4,r=d[j],g=d[j+1],b2=d[j+2],l=.299*r+.587*g+.114*b2;lums[i]=l;lum+=l;const mx=Math.max(r,g,b2),mn=Math.min(r,g,b2);sat+=mx===0?0:(mx-mn)/mx;}lum/=n;sat/=n;let vr=0;for(let i=0;i<n;i++)vr+=(lums[i]-lum)*(lums[i]-lum);const std=Math.sqrt(vr/n);let edges=0;for(let y=1;y<h;y++)for(let x=1;x<w;x++){const i2=(y*w+x)*4,lc=.299*d[i2-4]+.587*d[i2-3]+.114*d[i2-2],lb=.299*d[i2-w*4]+.587*d[i2-w*4+1]+.114*d[i2-w*4+2];if(Math.abs(lc-lb)>18)edges++;}res({ok:true,brightness:lum/255,saturation:sat,contrast:std/128,detail:Math.min(1,edges/Math.max(1,(w-1)*(h-1))*3)});}catch(e){res({ok:false});}};img.onerror=()=>res({ok:false});img.src=src;});}
async function computerCalc(bid){const b=allBattles[bid];if(!b)return;const opts=b.options||[];if(!opts.length)return toast('No options','warning');$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-card scale-in text-center"><div class="text-5xl mb-3">🤖</div><b class="font-display text-lg">Computer Calculator</b><div class="text-white/45 text-sm mt-2">Analyzing…</div></div></div>`;const an=[];for(const o of opts)an.push(await analyzeImage(o.img||''));const scores=opts.map((o,i)=>{const a=an[i];if(a&&a.ok)return{label:o.label,real:true,b:Math.round(a.brightness*100),s:Math.round(a.saturation*100),c:Math.round(Math.min(100,a.contrast*100)),d:Math.round(a.detail*100),score:Math.round(Math.min(100,Math.max(6,a.brightness*30+a.saturation*25+a.contrast*25+a.detail*25+6)))};let h=0;const t=String(o.label||('Option '+(i+1)));for(let j=0;j<t.length;j++)h=(h*33+t.charCodeAt(j))>>>0;return{label:o.label,real:false,b:35+(h%55),s:30+(h%60),c:35+(h%50),d:30+(h%55),score:30+(h%55)};});const total=scores.reduce((x,s)=>x+s.score,0)||1;let pcts=scores.map(s=>Math.round(s.score/total*100));const diff=100-pcts.reduce((a,b)=>a+b,0);if(pcts.length&&diff)pcts[pcts.length-1]+=diff;const wi=pcts.indexOf(Math.max(...pcts)),close=pcts.length>1&&(Math.max(...pcts)-Math.min(...pcts))<=5;const bar=(l,v)=>`<div class="flex items-center gap-2 mb-1"><span class="text-[10.5px] text-white/45" style="width:74px">${l}</span><div class="flex-1 h-2 bg-white/10 overflow-hidden"><div class="h-full" style="width:${Math.min(100,v)}%;background:linear-gradient(90deg,#06B6D4,#3B82F6)"></div></div><span class="text-[10.5px] text-white/55" style="width:32px;text-align:right">${v}</span></div>`;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2.5"><div class="w-9 h-9 flex items-center justify-center" style="background:linear-gradient(135deg,#06B6D4,#3B82F6)"><i data-lucide="bot" class="w-4 h-4 text-white"></i></div><b class="font-display text-[16px]">Computer Calculator</b></div><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="text-[12.5px] text-white/50 mb-4">${esc(b.title)}</div>${opts.map((o,i)=>`<div class="glass p-3 mb-3"><div class="flex items-center gap-2 mb-2">${o.img?`<img src="${o.img}" class="w-10 h-10 object-contain" style="background:#0A0B16">`:''}<b class="text-[14px] flex-1 truncate">${esc(o.label)}</b><span class="badge" style="color:#67E8F9">${pcts[i]}%</span></div>${bar('☀ Bright',scores[i].b)}${bar('🎨 Color',scores[i].s)}${bar('◐ Contrast',scores[i].c)}${bar('🔍 Detail',scores[i].d)}</div>`).join('')}<div class="glass-strong p-4 text-center" style="border-color:rgba(6,182,212,.4)"><div class="text-[10px] uppercase tracking-widest text-white/40 font-bold mb-1">🤖 Prediction</div><div class="font-display font-extrabold text-xl" style="color:#67E8F9">${esc(close?'Too close: '+opts[wi].label:opts[wi].label)}</div><div class="text-[11.5px] text-white/50 mt-1">${close?'Nearly equal!':'Confidence: '+Math.max(...pcts)+'%'}</div></div></div></div>`;lucide.createIcons();}

async function adminFinishNow(id){if(!isAdmin)return toast('Admins only','error');if(_finishLock.has(id))return toast('Already being finished…','warning');const b=allBattles[id];if(!b)return;if(archivedResults[id])return toast('Already finished!','warning');if(Date.now()>(b.endsAt||0))return toast('Battle already ended','warning');if(!confirm('Finish this battle NOW?'))return;_finishLock.add(id);const counts=(b.options||[]).map(o=>Object.keys(o.votes||{}).length),total=counts.reduce((a,c)=>a+c,0);let w='Tie';if(total>0){const mx=Math.max(...counts);if(counts.filter(c=>c===mx).length===1)w=b.options[counts.indexOf(mx)].label;}try{await db.ref('results/'+id).set({title:b.title,category:b.category,winner:w,total,endedAt:Date.now(),creator:b.creator||'',creatorName:b.creatorName||'',endedEarly:true});await db.ref('battles/'+id).remove();await db.ref('comments/'+id).remove();}catch(e){_finishLock.delete(id);showFirebaseError(e);return;}archivedResults[id]={title:b.title,category:b.category,winner:w,total,endedAt:Date.now(),endedEarly:true};toast('⚡ Battle finished early!','success');lbView='results';navTo('leaderboard');}

async function toggleVoiceRec(){if(voiceRecording){stopVoiceRec();return;}if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Voice recording not supported','error');try{voiceStream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];voiceDiscard=false;mediaRecorder=new MediaRecorder(voiceStream);mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)voiceChunks.push(e.data);};mediaRecorder.onstop=finishVoice;mediaRecorder.start();voiceRecording=true;voiceSecs=0;voiceTimer=setInterval(()=>{voiceSecs++;const el=document.getElementById('voice-rec-ui');if(el)el.textContent='🔴 '+fmtDur(voiceSecs)+' — tap ⏹ Send';if(voiceSecs>=60)stopVoiceRec();},1000);renderVoiceUI();}catch(e){toast('Mic permission denied','error');}}

dge" style="color:${isOnline(u.uid)?'#10B981':'#8A8DA3'}">${isOnline(u.uid)?'🟢 Online':(u.lastLogin?'Last: '+fmtTime(u.lastLogin):'Never')}</span><span class="badge" style="color:#FBBF24">⏱ ${fmtDur(u.timeSpent)}</span></div>`).join('')||emptyState('log-in','No users')}</div>`;}
function pageStudio(){const grad=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`,mixed=mixHex(stC1,stC2);return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">🎨 Theme Studio</h2><p class="text-white/45 text-sm mb-2">Global — applies to ALL users instantly</p><div class="glass p-3 mb-5 text-[12px] flex items-center gap-2" style="border-color:rgba(236,72,153,.35)"><i data-lucide="globe" class="w-4 h-4 text-pink-400"></i> Jo background yahan lagao ge wo har user ko dikhega</div><div class="glass-strong p-5 mb-5"><div class="st-preview mb-3" id="stprev" style="background:${grad}"></div><div class="grid grid-cols-2 gap-3 mb-3"><div><label class="lbl">Color 1</label><input type="color" id="stc1" class="st-color-in" value="${stC1}" oninput="stUpd()"></div><div><label class="lbl">Color 2</label><input type="color" id="stc2" class="st-color-in" value="${stC2}" oninput="stUpd()"></div></div><label class="lbl">Angle: <span id="stangval">${stAngle}°</span></label><input type="range" min="0" max="360" id="stang" class="st-range mb-4" value="${stAngle}" oninput="stUpd()"><div class="flex gap-2 flex-wrap mb-4"><button class="btn-primary px-4 py-2.5 font-bold text-[13px] flex-1 min-w-[140px]" onclick="stApply()">✅ Apply Globally</button><button class="btn-ghost px-4 py-2.5 font-bold text-[13px]" onclick="stMixNow()">🎨 Mix</button><button class="btn-ghost px-4 py-2.5 font-bold text-[13px]" onclick="stRandom()">🎲 Random</button></div><div class="flex items-center gap-3 flex-wrap"><span class="text-[11px] text-white/40 font-bold">Mix:</span><div class="st-mixbox" style="background:${mixed}"></div><code class="text-[10.5px] text-white/50">${mixed}</code><button class="a-btn" style="margin-left:auto" onclick="stUseMix()">Use as Color 2</button></div></div><div class="glass-strong p-5"><label class="lbl">Quick Palette</label><div class="flex gap-2 flex-wrap mb-4">${STUDIO_PALETTE.map(c=>`<div class="solid-sw" style="background:${c}" onclick="stPick('${c}')"></div>`).join('')}</div><label class="lbl">Solid Backgrounds — one click global</label><div class="grid grid-cols-4 md:grid-cols-8 gap-2">${STUDIO_SOLIDS.map(c=>`<div class="solid-sw" style="background:${c}" onclick="stApplySolid('${c}')"></div>`).join('')}</div></div></div>`;}
function stUpd(){stC1=$('#stc1').value;stC2=$('#stc2').value;stAngle=+$('#stang').value;if($('#stprev'))$('#stprev').style.background=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`;if($('#stangval'))$('#stangval').textContent=stAngle+'°';}
function stPick(c){stC1=c;$('#stc1').value=c;stUpd();toast('Color 1 = '+c,'info');}
function stMixNow(){stC2=mixHex(stC1,stC2);$('#stc2').value=stC2;stUpd();toast('Mixed → '+stC2,'success');}
function stUseMix(){stC2=mixHex(stC1,stC2);$('#stc2').value=stC2;stUpd();toast('Mix as Color 2','success');}
function stRandom(){stC1=randColor();stC2=randColor();stAngle=Math.floor(Math.random()*360);$('#stc1').value=stC1;$('#stc2').value=stC2;$('#stang').value=stAngle;stUpd();toast('🎲 Random','info');}
async function stApply(){const css=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`;await db.ref('meta/settings').update({theme:-1,customBg:css});SETTINGS.customBg=css;SETTINGS.theme=-1;applySettings(SETTINGS);toast('🌍 Applied to ALL users!','success');render();}
async function stApplySolid(c){await db.ref('meta/settings').update({theme:-1,customBg:c});SETTINGS.customBg=c;SETTINGS.theme=-1;applySettings(SETTINGS);toast('🌍 Applied to ALL users!','success');render();}
function pageAdminUsers(){const users=Object.entries(allUsers).filter(([uid])=>uid!=='system');return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">👤 Users</h2><p class="text-white/45 text-sm mb-3">${users.length} users · ${bannedUsers.size} banned</p><div class="glass p-3 mb-5 text-[12px] text-white/55 flex items-center gap-2" style="border-color:rgba(168,85,247,.35)"><i data-lucide="venetian-mask" class="w-4 h-4 text-fuchsia-400"></i> 🎭 <b>Impersonate:</b> tap user 5x fast (3 sec)</div>${users.map(([uid,u])=>`<div class="a-row"><div class="flex items-center gap-2.5 flex-1 min-w-[140px] cursor-pointer" onclick="adminTapUser('${uid}')"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover"><div><b class="text-[13.5px]">${esc(u.name)}</b> ${uidChip(uid)}<div class="text-[10.5px] text-white/40">L${levelOf(u.xp)} · ${fmt(u.xp||0)} XP · ⏱ ${fmtDur(u.timeSpent)}</div></div></div><span class="badge" style="color:${isOnline(uid)?'#10B981':'#8A8DA3'}">${isOnline(uid)?'online':'offline'}</span>${u.verified?`<button class="a-btn" onclick="adminVerify('${uid}')">✅ Unverify</button>`:`<button class="a-btn" style="color:#38BDF8;border-color:rgba(56,189,248,.4)" onclick="adminVerify('${uid}')">Verify</button>`}${bannedUsers.has(uid)?`<button class="a-btn" onclick="adminUnban('${uid}')">Unban</button>`:`<button class="a-btn danger" onclick="adminBan('${uid}')">Ban</button>`}<button class="a-btn gift" onclick="adminGift('${uid}')">Gift XP</button></div>`).join('')||emptyState('users','No users')}</div>`;}
function pageAdminBattles(){const bl=Object.entries(allBattles);return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚔ Battles</h2><p class="text-white/45 text-sm mb-6">${bl.length} active</p>${bl.map(([id,b])=>`<div class="a-row"><span class="badge" style="color:${catOf(b.category).color}">${catOf(b.category).name}</span><div class="flex-1 min-w-[150px]"><b class="text-[13px]">${esc(b.title)}</b><div class="text-[10.5px] text-white/40">${fmt(votesOf(b))} votes · by ${esc(b.creatorName||'?')}</div></div><button class="a-btn" onclick="openBattle('${id}')">View</button>${Date.now()<=(b.endsAt||0)?`<button class="a-btn" style="color:#FCD34D;border-color:rgba(245,158,11,.45)" onclick="adminFinishNow('${id}')">⚡ Finish</button>`:''}<button class="a-btn danger" onclick="adminDelBattle('${id}')">Delete</button></div>`).join('')||emptyState('swords','No battles')}</div>`;}
function adminViewVotes(id){const b=allBattles[id];if(!b)return;const html=(b.options||[]).map(o=>{const vs=Object.entries(o.votes||{}).map(([uid,ts])=>{const u=allUsers[uid];return `<div class="a-row"><img src="${(u||{}).avatar||AVATAR_PRESETS[0]}" class="w-7 h-7 object-cover"><b class="text-[12px]">${esc(u?u.name:'Unknown')}</b>${uidChip(uid)}<span class="text-[10px] text-white/35" style="margin-left:auto">${fmtTime(ts)}</span></div>`;}).join('');return `<div class="mb-4"><div class="font-display font-bold text-[13.5px] mb-1.5">${esc(o.label)} — ${Object.keys(o.votes||{}).length}</div>${vs||'<div class="text-white/30 text-[11.5px] mb-2">No votes</div>'}</div>`;}).join('');$('#admin-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)document.getElementById('admin-root').innerHTML=''"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[15px]">🗳 Votes</b><button class="icobtn" style="width:34px;height:34px" onclick="document.getElementById('admin-root').innerHTML=''"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="text-[12px] text-white/50 mb-3">${esc(b.title)}</div>${html}</div></div>`;lucide.createIcons();}
function pageAdminPrivacy(){const accs=Object.values(adminAccounts||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">🔒 Privacy & Accounts</h2><div class="glass p-3 mb-4 text-[12px] text-white/55">Total accounts: ${accs.length}</div>${accs.map(a=>`<div class="a-row"><img src="${(allUsers[a.uid]||{}).avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover"><div class="flex-1 min-w-[220px]"><div class="text-[14px] font-bold">👤 ${esc(a.name)} <span class="text-[10px] text-cyan-300 font-bold">${userCode(a.uid)}</span></div><div class="text-[12px] text-white/60">📧 ${esc(a.email)}</div><div class="text-[12px] font-bold" style="color:#FCD34D">🔑 ${esc(decPass(a.pw))}</div></div><button class="a-btn danger" onclick="adminDeleteAcc('${a.uid}','${emailKey(a.email)}')">Delete</button></div>`).join('')||emptyState('lock','No accounts')}</div>`;}
function pageAdminSettings(){return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚙ Global Settings</h2><p class="text-white/45 text-sm mb-2">SAB users ke liye turant apply</p><div class="glass-strong p-6"><label class="lbl">Website Name (all users)</label><div class="flex gap-2 mb-3"><input id="ad-name" class="input-field" maxlength="20" value="${esc(SETTINGS.name)}"><button class="a-btn" onclick="adminSaveName()">Save</button></div><label class="lbl">Chatter App Name (all users)</label><div class="flex gap-2 mb-3"><input id="ad-cname" class="input-field" maxlength="20" value="${esc(SETTINGS.chatName)}"><button class="a-btn" onclick="adminSaveChatName()">Save</button></div><button class="btn-primary w-full py-3 font-bold mb-5" onclick="navAdmin('studio')" style="background:linear-gradient(135deg,#EC4899,#8B5CF6)">🎨 Theme Studio (Global)</button><label class="lbl">🖼 Chat Wallpaper for ALL users (${CHAT_WALLS.length} wallpapers)</label><div class="flex gap-2 flex-wrap mb-2">${CHAT_WALLS.map((w,i)=>`<div class="solid-sw ${(SETTINGS.chatWall===i)?'sel':''}" style="background:${w.bg||'rgba(255,255,255,.05)'};width:38px;height:38px" title="${w.n}" onclick="adminSetWall(${i})"></div>`).join('')}</div><div class="glass p-2.5 mb-5 text-[11px] text-white/45">Note: agar user ne khud wallpaper select kiya hai to uski choice chalegi, warna admin wali sab par lagegi.</div><label class="lbl">Global Themes (${THEMES.length})</label><div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-5" style="max-height:300px;overflow-y:auto">${THEMES.map((t,i)=>`<div class="theme-sw ${SETTINGS.theme===i?'sel':''}" style="background:${t.bg||'radial-gradient(circle at 30% 30%,#312e81,#06070D)'}" onclick="adminSetTheme(${i})"><span>${t.n}</span></div>`).join('')}</div><label class="lbl">Toggles</label><div class="a-row"><span class="flex-1 text-[13px]">👁 Public "Who Voted"</span><button class="a-btn" onclick="adminToggle('publicVoters')">${SETTINGS.publicVoters?'ON ✅':'OFF'}</button></div><div class="a-row"><span class="flex-1 text-[13px]">Clear ALL chats</span><button class="a-btn danger" onclick="clearChatNow()">Clear</button></div></div></div>`;}
async function adminSetWall(i){await db.ref('meta/settings/chatWall').set(i);SETTINGS.chatWall=i;applyChatTheme();toast('🌍 Wallpaper applied to ALL!','success');render();}
async function adminBan(uid){await db.ref('meta/banned/'+uid).set(true);toast('Banned','success');}
async function adminUnban(uid){await db.ref('meta/banned/'+uid).remove();toast('Unbanned','info');}
async function adminVerify(uid){const u=allUsers[uid];if(!u)return;await db.ref('users/'+uid+'/verified').set(!u.verified);toast(u.verified?'Unverified':'Verified ✅','success');}
async function adminGift(uid){const amt=parseInt(prompt('XP amount to gift:'),10);if(isNaN(amt)||!amt)return toast('Invalid','warning');const u=allUsers[uid];if(!u)return;await db.ref('users/'+uid).update({xp:(u.xp||0)+amt});toast(amt+' XP gifted!','success');}
async function adminDeleteAcc(uid,key){if(!confirm('PERMANENTLY DELETE this account?'))return;await db.ref('accounts/'+key).remove();await db.ref('users/'+uid).remove();await db.ref('presence/'+uid).remove();await db.ref('dms/'+uid).remove();await db.ref('notifs/'+uid).remove();adminAccounts=Object.fromEntries(Object.entries(adminAccounts).filter(([k])=>k!==key));render();toast('Account deleted','error');}
async function adminDelBattle(id){if(!confirm('Delete this battle?'))return;await db.ref('battles/'+id).remove();await db.ref('comments/'+id).remove();toast('Deleted','info');}
async function adminSaveName(){const n=$('#ad-name').value.trim();if(!n)return;await db.ref('meta/settings/name').set(n);SETTINGS.name=n;toast('Updated for ALL 🌍','success');render();}
async function adminSaveChatName(){const n=$('#ad-cname').value.trim();if(!n)return;await db.ref('meta/settings/chatName').set(n);SETTINGS.chatName=n;toast('Updated for ALL 🌍','success');render();}
async function adminSetTheme(i){await db.ref('meta/settings').update({theme:i,customBg:null});SETTINGS.theme=i;SETTINGS.customBg='';applySettings(SETTINGS);toast('🌍 Theme applied to ALL!','success');render();}
async function adminToggle(k){const v=!SETTINGS[k];await db.ref('meta/settings/'+k).set(v);SETTINGS[k]=v;toast(k+' → '+(v?'ON':'OFF'),'info');render();}
/* ===== 📖 DIARY ===== */
function diaryPinHash(){return window._diaryPin||'';}
function pageDiary(){if(diaryPinHash()&&!diaryUnlocked)return `<div class="max-w-sm mx-auto fade-up pt-10 text-center"><div class="glass-strong p-6"><div class="text-4xl mb-2">🔒</div><h2 class="font-display font-extrabold text-xl mb-1">Diary Locked</h2><input id="di-pin" type="password" class="input-field text-center text-xl" style="letter-spacing:.5em" maxlength="6" inputmode="numeric" onkeydown="if(event.key==='Enter')diUnlock()"><button class="btn-primary w-full py-3 font-bold mt-3" onclick="diUnlock()">🔓 Unlock</button></div></div>`;const tabs=[['entries','📖 Entries'],['todos','✅ To-Do'],['schedule','📅 Schedule'],['alarms','⏰ Alarms'],['events','🎉 Events']];let body=diaryTab==='entries'?diEntriesHTML():diaryTab==='todos'?diTodosHTML():diaryTab==='schedule'?diScheduleHTML():diaryTab==='alarms'?diAlarmsHTML():diEventsHTML();return `<div class="max-w-3xl mx-auto fade-up"><h2 class="font-display font-extrabold text-2xl mb-1">📖 My Diary</h2><p class="text-white/45 text-sm mb-4">Your private space</p><div class="flex gap-2 flex-wrap mb-4">${tabs.map(([k,l])=>`<button class="a-btn" style="${diaryTab===k?'background:linear-gradient(135deg,#6366F1,#8B5CF6);border-color:#6366F1;color:#fff':''}" onclick="diaryTab='${k}';render()">${l}</button>`).join('')}${diaryPinHash()?'<button class="a-btn" onclick="diLock()">🔒 Lock</button>':''}<button class="a-btn" onclick="openDiPin()">🔑 ${diaryPinHash()?'Change PIN':'Set PIN'}</button></div>${body}</div>`;}
function diUnlock(){if(hashPin($('#di-pin').value)===diaryPinHash()){diaryUnlocked=true;render();toast('Unlocked 🔓','success');}else{toast('Wrong PIN','error');const p=$('#di-pin');if(p){p.classList.remove('wobble-anim');void p.offsetWidth;p.classList.add('wobble-anim');}}}
function diLock(){diaryUnlocked=false;render();toast('Locked 🔒','info');}
function openDiPin(){$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><b class="font-display text-[16px] block mb-2">🔑 Diary PIN</b><input id="di-npin" type="password" class="input-field text-center text-xl" style="letter-spacing:.4em" maxlength="6" inputmode="numeric"><button class="btn-primary w-full py-3 font-bold mt-3" onclick="saveDiPin()">💾 Save</button></div></div>`;setTimeout(()=>$('#di-npin')?.focus(),100);}
async function saveDiPin(){const v=$('#di-npin').value;if(!/^\d{4,6}$/.test(v))return toast('PIN 4-6 digits','warning');await db.ref('diary/'+MY.uid+'/settings/pin').set(hashPin(v));window._diaryPin=hashPin(v);diaryUnlocked=true;closeModal();toast('PIN saved 🔑','success');render();}
function diEntriesHTML(){return `<div class="flex gap-2 flex-wrap mb-3"><button class="a-btn" onclick="openDiEntry()">➕ New Entry</button><button class="a-btn" onclick="diaryCalOpen=!diaryCalOpen;render()">📅 Calendar</button><button class="a-btn" onclick="diaryFavOnly=!diaryFavOnly;render()">${diaryFavOnly?'⭐ Favorites':'⭐ All'}</button></div><div class="flex gap-2 flex-wrap mb-3"><input class="input-field flex-1 min-w-[150px]" placeholder="Search..." value="${esc(diaryQ)}" oninput="diaryQ=this.value;renderDiList()">${DIARY_MOODS.map(m=>`<button class="a-btn" style="${diaryMoodFilter===m?'background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.6)':''}" onclick="diaryMoodFilter=diaryMoodFilter==='${m}'?'':'${m}';render()">${m}</button>`).join('')}</div>${diaryCalOpen?diCalendarHTML():''}<div id="di-list">${diEntriesListHTML()}</div>`;}
function diEntriesListHTML(){const q=(diaryQ||'').toLowerCase();return diaryEntries.filter(e=>(!q||String(e.text||'').toLowerCase().includes(q))&&(!diaryMoodFilter||e.mood===diaryMoodFilter)&&(!diaryFavOnly||e.fav)).map(e=>`<div class="glass p-4 mb-2.5"><div class="flex items-center gap-2 mb-1.5 flex-wrap"><span class="text-xl">${e.mood||'😐'}</span><b class="font-display text-[13px]">${esc(e.date||'')}</b>${e.fav?'<span class="text-yellow-300">⭐</span>':''}<div style="margin-left:auto" class="flex gap-1"><button class="a-btn" onclick="diFav('${e.id}')">⭐</button><button class="a-btn" onclick="openDiEntry('${e.id}')">✏️</button><button class="a-btn danger" onclick="diDel('entries','${e.id}')">🗑</button></div></div><div class="text-[13.5px] text-white/85 whitespace-pre-wrap">${esc(e.text||'')}</div></div>`).join('')||emptyState('book-open','No entries yet');}
function renderDiList(){const el=$('#di-list');if(el){el.innerHTML=diEntriesListHTML();lucide.createIcons();}}
function diCalendarHTML(){const y=diaryCalDate.getFullYear(),m=diaryCalDate.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),eds=new Set(diaryEntries.map(e=>e.date));let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cells+=`<div class="cal-cell ${diaryCalSel===key?'sel':''} ${localKey(new Date())===key?'today':''}" onclick="diaryCalSel='${key}';render()">${d}${eds.has(key)?'<span class="cal-dot"></span>':''}</div>`;}return `<div class="glass p-4 mb-3"><div class="flex items-center justify-between mb-2"><button class="a-btn" onclick="diCalShift(-1)">←</button><b class="font-display text-[14px]">${new Date(y,m).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button class="a-btn" onclick="diCalShift(1)">→</button></div><div class="cal-grid">${['S','M','T','W','T','F','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div></div>`;}
function diCalShift(n){diaryCalDate=new Date(diaryCalDate.getFullYear(),diaryCalDate.getMonth()+n,1);render();}
function openDiEntry(id,presetDate){const e=id?diaryEntries.find(x=>x.id===id):null;diaryEditId=id||null;window._diMood=e?e.mood:DIARY_MOODS[0];$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><b class="font-display text-[16px] block mb-3">${e?'✏️ Edit':'➕ New Entry'}</b><label class="lbl">Date</label><input id="de-date" type="date" class="input-field" value="${esc(e?e.date:(presetDate||localKey(new Date())))}"><label class="lbl">Mood</label><div class="flex gap-1.5 flex-wrap mb-2">${DIARY_MOODS.map(m=>`<button class="a-btn" style="${(e?e.mood:DIARY_MOODS[0])===m?'background:rgba(99,102,241,.25);border-color:rgba(99,102,241,.6)':''}" data-mood="${m}" onclick="diPickMood(this)">${m}</button>`).join('')}</div><label class="lbl">Entry</label><textarea id="de-text" class="input-field" rows="4" maxlength="500" placeholder="Dear diary...">${esc(e?e.text:'')}</textarea><button class="btn-primary w-full py-3 font-bold mt-3" onclick="saveDiEntry()">💾 Save</button></div></div>`;}
function diPickMood(btn){window._diMood=btn.dataset.mood;$$('#modal-root .a-btn').forEach(b=>{if(b.dataset.mood){b.style.background='rgba(255,255,255,.06)';b.style.borderColor='rgba(255,255,255,.12)';}});btn.style.background='rgba(99,102,241,.25)';btn.style.borderColor='rgba(99,102,241,.6)';}
async function saveDiEntry(){const date=$('#de-date').value,text=$('#de-text').value.trim();if(!date||!text)return toast('Date and text required','warning');if(diaryEditId)await db.ref('diary/'+MY.uid+'/entries/'+diaryEditId).update({date,text,mood:window._diMood});else await db.ref('diary/'+MY.uid+'/entries').push({date,text,mood:window._diMood,fav:false,ts:Date.now()});closeModal();toast('Saved 📖','success');}
async function diFav(id){const e=diaryEntries.find(x=>x.id===id);if(e)await db.ref('diary/'+MY.uid+'/entries/'+id+'/fav').set(!e.fav);}
async function diDel(kind,id){if(!confirm('Delete?'))return;await db.ref('diary/'+MY.uid+'/'+kind+'/'+id).remove();toast('Deleted','info');}
function diTodosHTML(){return `<div class="flex gap-2 mb-3"><input id="td-text" class="input-field flex-1" maxlength="80" placeholder="New task..." onkeydown="if(event.key==='Enter')addDiTodo()"><button class="btn-primary px-4 font-bold text-sm" onclick="addDiTodo()">➕</button></div><div>${diaryTodos.map(t=>`<div class="a-row"><input type="checkbox" ${t.done?'checked':''} onchange="diTodoDone('${t.id}',this.checked)" style="width:17px;height:17px;accent-color:#6366F1;cursor:pointer"><span class="flex-1 text-[13.5px]" style="${t.done?'text-decoration:line-through;opacity:.5':''}">${esc(t.text)}</span><button class="a-btn danger" onclick="diDel('todos','${t.id}')">🗑</button></div>`).join('')||emptyState('check-circle','No tasks')}</div>`;}
async function addDiTodo(){const v=$('#td-text').value.trim();if(!v)return;await db.ref('diary/'+MY.uid+'/todos').push({text:v,done:false,ts:Date.now()});}
async function diTodoDone(id,done){await db.ref('diary/'+MY.uid+'/todos/'+id+'/done').set(done);}
function diScheduleHTML(){return `<button class="a-btn mb-3" onclick="openDiSched()">➕ Weekly Slot</button><div>${diarySchedule.map(s=>`<div class="a-row"><span class="badge" style="color:#818CF8">${DAYS[s.day]||''}</span><span class="badge">${esc(s.time||'')}</span><span class="flex-1 text-[13.5px]">${esc(s.title)}</span><button class="a-btn" onclick="openDiSched('${s.id}')">✏️</button><button class="a-btn danger" onclick="diDel('schedule','${s.id}')">🗑</button></div>`).join('')||emptyState('calendar','No schedule')}</div>`;}
function openDiSched(id){const s=id?diarySchedule.find(x=>x.id===id):null;diaryEditSchedId=id||null;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><b class="font-display text-[16px] block mb-3">${s?'✏️ Edit':'➕ Slot'}</b><label class="lbl">Day</label><select id="ds-day" class="input-field">${DAYS.map((d,i)=>`<option value="${i}" ${s&&s.day===i?'selected':''}>${d}</option>`).join('')}</select><label class="lbl">Time</label><input id="ds-time" type="time" class="input-field" value="${esc(s?s.time:'09:00')}"><label class="lbl">Title</label><input id="ds-title" class="input-field" maxlength="60" value="${esc(s?s.title:'')}"><button class="btn-primary w-full py-3 font-bold mt-3" onclick="saveDiSched()">💾 Save</button></div></div>`;}
async function saveDiSched(){const day=+$('#ds-day').value,time=$('#ds-time').value,title=$('#ds-title').value.trim();if(!title)return toast('Title required','warning');if(diaryEditSchedId)await db.ref('diary/'+MY.uid+'/schedule/'+diaryEditSchedId).update({day,time,title});else await db.ref('diary/'+MY.uid+'/schedule').push({day,time,title,ts:Date.now()});closeModal();toast('Saved 📅','success');}
function diAlarmsHTML(){return `<button class="a-btn mb-3" onclick="openDiAlarm()">➕ Alarm</button><div>${diaryAlarms.map(a=>`<div class="a-row"><span class="badge" style="color:#F43F5E;border-color:rgba(244,63,94,.4)">⏰ ${esc(a.time)}</span><span class="flex-1 text-[13.5px]">${esc(a.label||'Alarm')}</span><button class="a-btn" onclick="openDiAlarm('${a.id}')">✏️</button><button class="a-btn danger" onclick="diDel('alarms','${a.id}')">🗑</button></div>`).join('')||emptyState('alarm-clock','No alarms')}</div>`;}
function openDiAlarm(id){const a=id?diaryAlarms.find(x=>x.id===id):null;diaryEditAlarmId=id||null;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><b class="font-display text-[16px] block mb-3">${a?'✏️ Edit':'⏰ Alarm'}</b><label class="lbl">Time</label><input id="da-time" type="time" class="input-field" value="${esc(a?a.time:'07:00')}"><label class="lbl">Label</label><input id="da-label" class="input-field" maxlength="40" value="${esc(a?a.label:'')}"><button class="btn-primary w-full py-3 font-bold mt-3" onclick="saveDiAlarm()">💾 Save</button></div></div>`;}
async function saveDiAlarm(){const time=$('#da-time').value,label=$('#da-label').value.trim();if(!time)return toast('Time required','warning');if(diaryEditAlarmId)await db.ref('diary/'+MY.uid+'/alarms/'+diaryEditAlarmId).update({time,label});else await db.ref('diary/'+MY.uid+'/alarms').push({time,label,ts:Date.now()});closeModal();toast('Saved ⏰','success');}
function checkAlarms(){if(!MY||!diaryAlarms.length)return;window._diFired=window._diFired||{};const n=new Date(),hhmm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),dk=localKey(n);for(const a of diaryAlarms){const fk=dk+'|'+a.id+'|'+hhmm;if(a.time===hhmm&&!window._diFired[fk]){window._diFired[fk]=true;stopAlarmSound();alarmAudioTimer=setInterval(beep,700);setTimeout(stopAlarmSound,15000);toast('⏰ '+(a.label||'Time is up!'),'warning');}}}
function stopAlarmSound(){if(alarmAudioTimer){clearInterval(alarmAudioTimer);alarmAudioTimer=null;}}
function diEventsHTML(){return `<button class="a-btn mb-3" onclick="openDiEvent()">➕ Event</button><div>${diaryEvents.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(ev=>`<div class="a-row"><span class="badge" style="color:#EC4899">${esc(ev.date||'')}</span><span class="flex-1 text-[13.5px]">${esc(ev.title)}</span><button class="a-btn" onclick="openDiEvent('${ev.id}')">✏️</button><button class="a-btn danger" onclick="diDel('events','${ev.id}')">🗑</button></div>`).join('')||emptyState('party-popper','No events')}</div>`;}
function openDiEvent(id){const ev=id?diaryEvents.find(x=>x.id===id):null;diaryEditEventId=id||null;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><b class="font-display text-[16px] block mb-3">${ev?'✏️ Edit':'🎉 Event'}</b><label class="lbl">Date</label><input id="dv-date" type="date" class="input-field" value="${esc(ev?ev.date:localKey(new Date()))}"><label class="lbl">Title</label><input id="dv-title" class="input-field" maxlength="60" value="${esc(ev?ev.title:'')}"><button class="btn-primary w-full py-3 font-bold mt-3" onclick="saveDiEvent()">💾 Save</button></div></div>`;}
async function saveDiEvent(){const date=$('#dv-date').value,title=$('#dv-title').value.trim();if(!date||!title)return toast('Both required','warning');if(diaryEditEventId)await db.ref('diary/'+MY.uid+'/events/'+diaryEditEventId).update({date,title});else await db.ref('diary/'+MY.uid+'/events').push({date,title,ts:Date.now()});closeModal();toast('Saved 🎉','success');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#gsearch-root')&&$('#gsearch-root').innerHTML)closeGSearch();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(MY)openGSearch();}});
(async()=>{
document.documentElement.style.setProperty('--bubble',bubbleColor);
lucide.createIcons();
applyDayNight();
try{const s=(await db.ref('meta/settings').once('value')).val()||{};SETTINGS={...SETTINGS,...s};applySettings(s);}catch(e){}
removeElonBattle();removeBotBattles();deleteDefaultBattles();
const h=location.hash.match(/#battle=(.+)/);
if(h){view='battle';viewParam=h[1];}
const sess=loadSession();
const impUid=isAdmin?localStorage.getItem('basiler_impersonate'):null;
if(impUid){try{const u=(await db.ref('users/'+impUid).once('value')).val();if(u){startApp({uid:impUid,...u});return;}}catch(e){}localStorage.removeItem('basiler_impersonate');}
if(sess&&sess.uid){try{const u=(await db.ref('users/'+sess.uid).once('value')).val();if(u){startApp({uid:sess.uid,...u});return;}if(sess.email){const acc=(await db.ref('accounts/'+emailKey(sess.email)).once('value')).val();if(acc&&acc.uid===sess.uid){await db.ref('users/'+sess.uid).set({name:acc.name,email:acc.email,avatar:acc.avatar||AVATAR_PRESETS[0],xp:0,createdAt:acc.createdAt||Date.now(),loginCount:1,lastLogin:Date.now(),timeSpent:0});startApp({uid:sess.uid,name:acc.name,avatar:acc.avatar||AVATAR_PRESETS[0],xp:0});return;}}}catch(e){}clearSession();}
showAuth();})();
</script>
</body>
</html>
