<style>
*,*::before,*::after{border-radius:0!important}

.font-display{font-family:'Sora',sans-serif}
.glass{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px)}

@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

.a-tab:hover{color:#fff}.a-tab.active{color:#fff;background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

@keyframes lbGlow{0%,100%{box-shadow:0 0 10px -2px rgba(129,140,248,.5),inset 0 0 6px rgba(129,140,248,.2)}50%{box-shadow:0 0 26px -2px rgba(129,140,248,.95),inset 0 0 12px rgba(167,139,250,.45)}}
.lb-btn{padding:11px 20px;font-weight:800;font-size:13.5px;cursor:pointer;color:#C7C9DE;border:1px solid rgba(129,140,248,.6);background:linear-gradient(110deg,rgba(99,102,241,.1) 30%,rgba(167,139,250,.4) 48%,rgba(244,114,182,.25) 52%,rgba(99,102,241,.1) 70%);background-size:220% 100%;animation:lbShine 2.4s linear infinite,lbGlow 2.4s ease-in-out infinite;transition:.25s}

.lb-btn.active{color:#fff;border-color:#A5B4FC}

.w-title{font-family:'Sora';font-weight:800;font-size:46px;animation:wUp .7s .35s ease both}

.vs-wrap{position:relative}.vs-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;background:linear-gradient(135deg,#6366F1,#A855F7);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:800;font-size:13px;color:#fff;box-shadow:0 8px 24px -6px rgba(99,102,241,.7);border:3px solid #0A0B16;z-index:5}

function compressImage(file,maxDim=800,q=.6){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,maxDim/img.width);const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',q));};img.onerror=()=>rej(new Error('bad'));img.src=e.target.result;};r.onerror=()=>rej(new Error('read'));r.readAsDataURL(file);});}

function hashPass(p){let h=0;const s=String(p);for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return 'p'+(h>>>0).toString(36)+'_'+s.length;}
function hashPin(p){let h=0;const s=String(p);for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return 'pin'+(h>>>0).toString(36);}

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();}
function mixHex(a,b){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex((A.r+B.r)/2,(A.g+B.g)/2,(A.b+B.b)/2);}

async function incDaily(type){if(!MY)return;const def=dailyDef();if(def.type!==type)return;const today=localKey(new Date());let d=(MY.daily&&MY.daily.date===today)?{...MY.daily}:{date:today,progress:0,done:false};if(d.done)return;d.progress++;if(d.progress>=def.target){d.done=true;const old=MY.xp||0,nw=old+def.xp;MY.daily=d;MY.xp=nw;await db.ref('users/'+MY.uid).update({daily:d,xp:nw});flyXP('🎯 Daily Complete +'+def.xp+' XP!');fireConfetti();beep();checkLevelUp(old,nw);}else{MY.daily=d;await db.ref('users/'+MY.uid+'/daily').set(d);}}
function dailyCardHTML(){const def=dailyDef(),today=localKey(new Date());const d=(MY.daily&&MY.daily.date===today)?MY.daily:{progress:0,done:false};const pct=Math.min(100,Math.round((d.progress||0)/def.target*100));return `<div class="glass-strong p-4 mb-5 flex items-center gap-3 flex-wrap" style="border-color:rgba(251,191,36,.35)"><div class="text-3xl">🎯</div><div class="flex-1 min-w-[200px]"><div class="flex justify-between text-[12.5px] font-bold"><span>Daily Challenge: ${def.n}</span><span style="color:${d.done?'#10B981':'#FCD34D'}">${d.done?'✅ Done':'+'+def.xp+' XP'}</span></div><div class="h-2.5 bg-white/10 mt-2 overflow-hidden border border-white/10"><div class="h-full hue-anim" style="width:${pct}%;background:linear-gradient(90deg,#FBBF24,#F97316)"></div></div><div class="text-[10.5px] text-white/40 mt-1">${Math.min(d.progress||0,def.target)}/${def.target}${d.done?' — completed! 🎉':' — keep going!'}</div></div></div>`;}
function mostVotedHTML(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));if(!live.length)return'';live.sort((a,b)=>votesOf(b[1])-votesOf(a[1]));const[id,b]=live[0],total=votesOf(b);if(!total)return'';const opts=b.options||[];const lead=opts.length?opts.reduce((m,o,i,arr)=>Object.keys(o.votes||{}).length>Object.keys(arr[m].votes||{}).length?i:m,0):0;return `<div class="glass-strong p-4 mb-5 card-hover cursor-pointer" style="border-color:rgba(251,191,36,.55);background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(255,255,255,.02))" onclick="openBattle('${id}')"><div class="flex items-center gap-3 flex-wrap"><div class="text-3xl">👑</div><div class="flex-1 min-w-[180px]"><div class="text-[10px] uppercase tracking-widest font-bold" style="color:#FCD34D">Most Voted Battle</div><div class="font-display font-extrabold text-[15.5px] leading-snug clamp2 mt-0.5">${esc(b.title)}</div><div class="text-[11px] text-white/45 mt-1">🏆 Leading: <b style="color:#FCD34D">${esc(opts[lead]?opts[lead].label:'Tie')}</b> · <span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span></div></div><div class="text-center"><div class="font-display font-extrabold text-2xl" style="color:#FCD34D">${fmt(total)}</div><div class="text-[9px] text-white/40 font-bold uppercase tracking-wider">total votes</div></div></div></div>`;}
function battleOfDayHTML(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));if(live.length<3)return'';live.sort((a,b)=>votesOf(b[1])-votesOf(a[1]));const d=new Date(),seed=+(String(d.getFullYear())+String(d.getMonth()+1)+String(d.getDate()));const pick=live[seed%Math.min(5,live.length)];if(!pick)return'';const[id,b]=pick;const opts=b.options||[];const counts=opts.map(o=>Object.keys(o.votes||{}).length);const mx=Math.max(...counts,0);const wi=counts.indexOf(mx);return `<div class="botd p-4 mb-5 cursor-pointer card-hover" onclick="openBattle('${id}')"><div class="flex items-center gap-2 mb-2 flex-wrap"><span class="badge" style="color:#FCD34D;border-color:rgba(251,191,36,.5)"><span class="live-dot"></span>⭐ BATTLE OF THE DAY</span><span class="badge">${new Date().toLocaleDateString('en-US',{weekday:'long'})}</span></div><div class="font-display font-extrabold text-[17px] leading-snug clamp2 mb-2">${esc(b.title)}</div><div class="flex items-center justify-between text-[11.5px] text-white/50 font-semibold flex-wrap gap-2"><span>🗳 ${fmt(votesOf(b))} votes · 🏆 ${esc(opts[wi]?opts[wi].label:'Tie')}</span><span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span></div></div>`;}
function trendingHTML(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));live.sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));const top=live.slice(0,10);if(!top.length)return'';return `<div class="mb-6"><div class="flex items-center gap-2 mb-3 flex-wrap"><i data-lucide="flame" class="w-5 h-5 text-orange-400"></i><b class="font-display text-lg">Trending</b><span class="badge" style="color:#F97316">🔥 TOP</span><span class="text-[10.5px] text-white/35 font-semibold" style="margin-left:auto">latest battles first · swipe →</span></div><div class="flex gap-3 overflow-x-auto pb-2">${top.map(([id,b],i)=>`<div class="glass card-hover trend-box cursor-pointer" style="border-color:${i===0?'rgba(249,115,22,.5)':'rgba(255,255,255,.09)'}" onclick="openBattle('${id}')"><div class="flex items-center gap-1.5 mb-1.5 flex-wrap">${i===0?'<span class="badge" style="color:#FCD34D;border-color:rgba(251,191,36,.5)">👑 TOP</span>':`<span class="font-display font-extrabold text-[11px]" style="color:#F97316">🔥 #${i+1}</span>`}${b.tournament?'<span class="badge" style="color:#FCD34D">🥇</span>':''}${b.anon?'<span class="badge" style="color:#8A8DA3">🙈</span>':''}</div><div class="font-display font-bold text-[12.5px] leading-snug clamp2 mb-2" style="min-height:33px">${esc(b.title)}</div><div class="flex justify-between text-[10.5px] text-white/40 font-semibold"><span>🗳 ${fmt(votesOf(b))}</span><span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span></div></div>`).join('')}</div></div>`;}
function statusRingsHTML(){const ups=statusUploaders();if(!ups.length&&!statusesOf(MY.uid).length)return'';let html=`<div class="mb-5"><div class="flex items-center gap-2 mb-2.5"><i data-lucide="circle-dot" class="w-4 h-4 text-pink-400"></i><b class="font-display text-[15px]">Status</b><span class="badge" style="color:#EC4899">Shorts</span></div><div class="flex gap-3 overflow-x-auto pb-2">`;html+=`<div style="text-align:center;cursor:pointer" onclick="openStatusScreen()"><div class="st-ring ${hasUnseenStatus(MY.uid)?'':'seen'}" style="background:linear-gradient(135deg,#6366F1,#A855F7)">${statusesOf(MY.uid).length?`<img src="${MY.avatar||AVATAR_PRESETS[0]}">`:`<div>＋</div>`}</div><div class="text-[9.5px] font-bold text-white/50 mt-1">My status</div></div>`;ups.slice(0,20).forEach(uid=>{const u=allUsers[uid]||{};const un=hasUnseenStatus(uid);html+=`<div style="text-align:center;cursor:pointer" onclick="openStatusScreen('${uid}')"><div class="st-ring ${un?'':'seen'}"><img src="${u.avatar||AVATAR_PRESETS[0]}"></div><div class="text-[9.5px] font-bold text-white/50 mt-1 truncate" style="max-width:64px">${esc(u.name||'User')}</div></div>`;});return html+'</div></div>';}
async function toggleFollow(uid){if(!uid||uid===MY.uid)return;const f=myFollowing.has(uid),u=allUsers[uid];if(f){myFollowing.delete(uid);await db.ref('follows/'+MY.uid+'/following/'+uid).remove();await db.ref('follows/'+uid+'/followers/'+MY.uid).remove();await db.ref('users/'+uid+'/followersCount').set(Math.max(0,(u&&u.followersCount)||1)-1);await db.ref('users/'+MY.uid+'/followingCount').set(Math.max(0,myFollowing.size));toast('Unfollowed','info');}else{myFollowing.add(uid);await db.ref('follows/'+MY.uid+'/following/'+uid).set(true);await db.ref('follows/'+uid+'/followers/'+MY.uid).set(true);await db.ref('users/'+uid+'/followersCount').set(((u&&u.followersCount)||0)+1);await db.ref('users/'+MY.uid+'/followingCount').set(myFollowing.size);pushNotif(uid,'follow',MY.name+' started following you 🎉',{});toast('Following ✅','success');beep();}if(statusOpen)styRerender();else render();}

function openGiftXP(uid){const u=allUsers[uid];if(!u)return toast('User not found','error');$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2.5"><div class="w-9 h-9 flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F97316)"><i data-lucide="gift" class="w-4 h-4 text-white"></i></div><b class="font-display text-[16px]">🎁 Gift XP</b></div><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="flex items-center gap-3 mb-3"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover"><div><b class="text-[14px]">${esc(u.name)}</b><div class="text-[10.5px] text-cyan-300 font-bold">${userCode(uid)}</div></div></div><div class="glass p-2.5 mb-3 text-[12.5px]">Your balance: <b class="text-yellow-300">${fmt(MY.xp||0)} XP</b></div><input id="gift-amt" type="number" min="1" class="input-field" placeholder="Custom amount (e.g. 50)" onkeydown="if(event.key==='Enter')sendGiftXP('${uid}')"><div class="flex gap-2 mt-2 flex-wrap">${[10,50,100,250,500].map(v=>`<button class="a-btn" onclick="document.getElementById('gift-amt').value=${v}">+${v}</button>`).join('')}</div><button class="btn-primary w-full py-3 font-bold mt-4" onclick="sendGiftXP('${uid}')" style="background:linear-gradient(135deg,#FBBF24,#F97316)">🎁 Send Gift</button></div></div>`;lucide.createIcons();}
async function sendGiftXP(uid){const u=allUsers[uid];if(!u)return toast('User not found','error');const amt=parseInt($('#gift-amt').value,10);if(isNaN(amt)||amt<=0)return toast('Enter a valid amount','warning');if(amt>(MY.xp||0))return toast('Not enough XP!','warning');const myNew=(MY.xp||0)-amt,theirNew=(u.xp||0)+amt;await db.ref('users/'+MY.uid+'/xp').set(myNew);await db.ref('users/'+uid+'/xp').set(theirNew);MY.xp=myNew;pushNotif(uid,'gift',MY.name+' gifted you '+amt+' XP! 🎁',{});closeModal();flyXP('🎁 '+amt+' XP → '+u.name);fireConfetti();beep();}
function pageGift(){window._sgQ=window._sgQ||'';return `<div class="max-w-3xl mx-auto fade-up"><button class="btn-ghost px-4 py-2 text-sm font-bold mb-5" onclick="navBack()">← Back</button><div class="flex items-center gap-3 mb-1"><div class="w-11 h-11 flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F97316)"><i data-lucide="gift" class="w-5 h-5 text-white"></i></div><div><h2 class="font-display font-extrabold text-2xl">🎁 Send Gift</h2><div class="text-[11px] text-white/40 font-bold uppercase tracking-wider">Gift your XP to any user</div></div></div><div class="glass p-3 flex items-center gap-2 mt-4 mb-3"><i data-lucide="search" class="w-4 h-4 text-white/30"></i><input class="bg-transparent border-none flex-1 text-white text-sm" placeholder="Search users by name..." value="${esc(window._sgQ)}" oninput="window._sgQ=this.value;renderGiftList()"></div><div class="glass p-2.5 mb-4 text-[12.5px]">Your balance: <b class="text-yellow-300">${fmt(MY.xp||0)} XP</b></div><div id="sg-list">${giftListHTML()}</div></div>`;}
function giftListHTML(){const q=(window._sgQ||'').toLowerCase();return Object.entries(allUsers).filter(([uid,u])=>uid!==MY.uid&&uid!=='system'&&!bannedUsers.has(uid)&&(!q||(u.name||'').toLowerCase().includes(q))).map(([uid,u])=>`<div class="a-row"><div style="position:relative"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover">${isOnline(uid)?'<span class="live-dot" style="position:absolute;bottom:-2px;right:-2px;border:2px solid #0A0B14"></span>':''}</div><div class="flex-1 min-w-[110px] cursor-pointer" onclick="openUser('${uid}')"><b class="text-[13px]">${esc(u.name)}</b> <span class="text-[9px] text-cyan-300 font-bold">${userCode(uid)}</span><div class="text-[10px] text-white/40">⚡ Level ${levelOf(u.xp||0)} · ${fmt(u.xp||0)} XP</div></div><button class="a-btn gift" onclick="openGiftXP('${uid}')">🎁 Gift</button></div>`).join('')||emptyState('gift','No users found');}
function renderGiftList(){const el=$('#sg-list');if(el){el.innerHTML=giftListHTML();lucide.createIcons();}}
function pageSuggest(){return `<div class="max-w-3xl mx-auto fade-up"><button class="btn-ghost px-4 py-2 text-sm font-bold mb-5" onclick="navBack()">← Back</button><div class="flex items-center gap-3 mb-1"><div class="w-11 h-11 flex items-center justify-center" style="background:linear-gradient(135deg,#8B5CF6,#06B6D4)"><i data-lucide="lightbulb" class="w-5 h-5 text-white"></i></div><div><h2 class="font-display font-extrabold text-2xl">💡 Suggest an Idea</h2><div class="text-[11px] text-white/40 font-bold uppercase tracking-wider">Tell the admin what to add!</div></div></div><div class="glass-strong p-5 mt-4"><textarea id="sug-text" class="input-field" rows="4" maxlength="300" placeholder="e.g. Please add a quiz feature..."></textarea><button class="btn-primary w-full py-3 font-bold text-[13.5px] mt-3" onclick="sendSuggestionPage()" style="background:linear-gradient(135deg,#8B5CF6,#06B6D4)">📨 Send Suggestion</button></div><h3 class="font-display font-bold text-lg mt-7 mb-3">My Suggestions</h3><div id="my-sug-list">${mySuggestionsHTML()}</div></div>`;}
function mySuggestionsHTML(){return allSuggestions.filter(s=>s.uid===MY.uid).map(s=>`<div class="glass p-3.5 mb-2.5"><div class="text-[13px] text-white/85 whitespace-pre-wrap">💡 ${esc(s.text)}</div><div class="text-[10.5px] text-white/35 mt-1.5">${fmtDate(s.ts)} · ${fmtClock(s.ts)} · ${fmtTime(s.ts)}</div></div>`).join('')||emptyState('lightbulb','No suggestions yet');}
async function sendSuggestionPage(){const t=$('#sug-text').value.trim();if(t.length<5)return toast('Suggestion too short','warning');await db.ref('suggestions').push({uid:MY.uid,name:MY.name,avatar:MY.avatar,text:t,ts:Date.now()});$('#sug-text').value='';toast('💡 Suggestion sent to admin!','success');beep();const el=$('#my-sug-list');if(el){el.innerHTML=mySuggestionsHTML();lucide.createIcons();}}
function pageSuggestions(){return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">📨 Suggestions</h2><p class="text-white/45 text-sm mb-5">${allSuggestions.length} user suggestions</p>${allSuggestions.map(s=>{const u=allUsers[s.uid];return `<div class="glass card-hover p-4 mb-3" style="border-color:rgba(167,139,250,.3)"><div class="flex items-center gap-2.5 flex-wrap mb-2"><img src="${(s.avatar||(u||{}).avatar)||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover cursor-pointer" onclick="openUser('${s.uid}')"><div class="flex-1 min-w-[130px]"><b class="text-[13.5px]">${esc(s.name)}</b> <span class="text-[9px] text-cyan-300 font-bold">${userCode(s.uid)}</span><div class="text-[10.5px] text-white/40">${fmtDate(s.ts)} · ${fmtTime(s.ts)}</div></div><button class="a-btn" onclick="startDM('${s.uid}')">💬 Message</button><button class="a-btn danger" onclick="delSuggestion('${s.id}')">🗑 Delete</button></div><div class="text-[13.5px] text-white/85 whitespace-pre-wrap">💡 ${esc(s.text)}</div></div>`;}).join('')||emptyState('lightbulb','No suggestions yet')}</div>`;}
async function delSuggestion(id){if(!confirm('Delete this suggestion?'))return;await db.ref('suggestions/'+id).remove();toast('Suggestion deleted','info');}
function openPostModal(){window._postImg=null;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[17px]">➕ Create Post</b><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><label class="lbl">Text</label><textarea id="pt-text" class="input-field" rows="3" placeholder="Share your thoughts..."></textarea><label class="lbl">Image (optional)</label><label class="btn-ghost px-4 py-2.5 text-[13px] font-bold cursor-pointer inline-flex items-center gap-2">📷 Add Image<input type="file" accept="image/*" hidden onchange="pickPostImg(this)"></label><div id="pt-img-prev" class="mt-2"></div><label class="lbl">Poll (optional)</label><input id="pt-q" class="input-field" style="margin-bottom:6px" placeholder="Poll question"><div class="grid grid-cols-2 gap-2">${[0,1,2,3].map(i=>`<input id="pt-o${i}" class="input-field" maxlength="30" placeholder="Option ${i+1}${i>1?' (optional)':''}">`).join('')}</div><button class="btn-primary w-full py-3 font-bold mt-4" onclick="createPost()">🚀 Post</button></div></div>`;lucide.createIcons();}
async function pickPostImg(inp){const f=inp.files[0];if(!f)return;if(f.size>8*1048576)return toast('Image too big (max 8MB)','warning');try{const d=await compressImage(f,700,.65);window._postImg=d;$('#pt-img-prev').innerHTML=`<div class="glass p-2 flex items-center gap-2"><img src="${d}" class="w-14 h-14 object-cover"><span class="text-[12px] text-white/60 flex-1">Image ready</span><button class="a-btn danger" onclick="window._postImg=null;document.getElementById('pt-img-prev').innerHTML=''">Remove</button></div>`;}catch(e){toast('Could not load image','error');}}
async function createPost(){const text=$('#pt-text').value.trim(),img=window._postImg,q=$('#pt-q').value.trim();const opts=[0,1,2,3].map(i=>($('#pt-o'+i).value||'').trim()).filter(Boolean);if(!text&&!img&&!q)return toast('Write something or add image/poll','warning');if(q&&opts.length<2)return toast('Poll needs at least 2 options','warning');const p={uid:MY.uid,name:MY.name,avatar:MY.avatar,ts:Date.now(),likes:{}};if(text)p.text=text;if(img)p.img=img;if(q&&opts.length>=2)p.poll={q,opts:opts.map(l=>({label:l,votes:{}}))};await db.ref('posts').push(p);await db.ref('users/'+MY.uid).update({postsCount:(MY.postsCount||0)+1});incDaily('post');window._postImg=null;closeModal();toast('Post created! 🚀','success');}
async function delPost(id){if(!confirm('Delete this post?'))return;const p=allPosts.find(x=>x.id===id);await db.ref('posts/'+id).remove();if(p&&p.uid===MY.uid)await db.ref('users/'+MY.uid).update({postsCount:Math.max(0,(MY.postsCount||1)-1)});toast('Post deleted','info');}
async function reactPost(id,emo){const p=allPosts.find(x=>x.id===id);if(!p)return;const mine=(p.likes||{})[MY.uid];const ref=db.ref('posts/'+id+'/likes/'+MY.uid);if(mine===emo)await ref.remove();else{await ref.set(emo);if(!mine&&p.uid!==MY.uid)pushNotif(p.uid,'react',MY.name+' reacted '+emo+' to your post',{});incDaily('react');}}
async function votePostPoll(id,oi){const p=allPosts.find(x=>x.id===id);if(!p||!p.poll)return;const prev=p.poll.opts.findIndex(o=>(o.votes||{})[MY.uid]);if(prev===oi)return toast('You already voted this option','warning');const u={};if(prev>=0)u['posts/'+id+'/poll/opts/'+prev+'/votes/'+MY.uid]=null;u['posts/'+id+'/poll/opts/'+oi+'/votes/'+MY.uid]=Date.now();await db.ref().update(u);if(prev<0){incDaily('vote');beep();toast('Poll vote cast! ✅','success');}}
function postCard(p){const mine=p.uid===MY.uid,likes=p.likes||{},counts={};Object.values(likes).forEach(e=>counts[e]=(counts[e]||0)+1);const myLike=likes[MY.uid];let pollHTML='';if(p.poll){const opts=p.poll.opts||[],tot=opts.reduce((a,o)=>a+Object.keys(o.votes||{}).length,0),my=opts.findIndex(o=>(o.votes||{})[MY.uid]);pollHTML=`<div class="glass p-3 mt-3"><div class="font-bold text-[14px] mb-2">📊 ${esc(p.poll.q)}</div>${opts.map((o,i)=>{const c=Object.keys(o.votes||{}).length,pct=tot?Math.round(c/tot*100):0;return `<div class="relative mb-1.5 cursor-pointer" style="border:1px solid ${my===i?'rgba(99,102,241,.6)':'rgba(255,255,255,.12)'};padding:8px 10px;overflow:hidden" onclick="votePostPoll('${p.id}',${i})"><div class="absolute inset-y-0 left-0 gradient-brand opacity-25" style="width:${pct}%"></div><div class="relative flex justify-between text-[13px] font-semibold"><span>${esc(o.label)}${my===i?' ✓':''}</span><span>${pct}%</span></div></div>`;}).join('')}<div class="text-[10.5px] text-white/35 mt-1">🗳 ${tot} votes</div></div>`;}return `<div class="glass p-4 mb-3 fade-up"><div class="flex items-center gap-2.5 flex-wrap"><img src="${p.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover cursor-pointer" onclick="openUserModal('${p.uid}')"><div class="min-w-0 flex-1 cursor-pointer" onclick="openUserModal('${p.uid}')"><b class="text-[13.5px]" style="color:${colorFor(p.uid)}">${esc(p.name)}</b> <span class="text-[9px] text-cyan-300 font-bold">${userCode(p.uid)}</span><div class="text-[10.5px] text-white/35">${fmtTime(p.ts)}</div></div>${!mine?`<button class="a-btn ${myFollowing.has(p.uid)?'':'gift'}" style="padding:4px 10px;font-size:11px" onclick="toggleFollow('${p.uid}')">${myFollowing.has(p.uid)?'✓ Following':'➕ Follow'}</button>`:''}${mine?`<button class="a-btn danger" style="padding:4px 10px;font-size:11px" onclick="delPost('${p.id}')">🗑</button>`:''}</div>${p.text?`<div class="text-[14px] text-white/85 whitespace-pre-wrap mt-2.5">${esc(p.text)}</div>`:''}${p.im function battleStatsHTML(b){const opts=b.options||[],times=[];opts.forEach(o=>Object.values(o.votes||{}).forEach(ts=>{if(ts)times.push(ts);}));if(!times.length)return'';const start=b.createdAt||Math.min(...times),end=Math.max(b.endsAt||Date.now(),Math.max(...times)),span=Math.max(end-start,1),N=12,buckets=new Array(N).fill(0);times.forEach(ts=>{let i=Math.floor((ts-start)/span*N);if(i<0)i=0;if(i>=N)i=N-1;buckets[i]++;});const mx=Math.max(...buckets,1),voters=times.length,part=Math.round(voters/Math.max(1,Object.keys(allUsers).length)*100),avgH=span/36e5,vph=avgH>0?(voters/avgH).toFixed(1):voters;let vh='';if(!b.anon){vh=opts.flatMap(o=>Object.entries(o.votes||{}).map(([uid,ts])=>({uid,ts}))).sort((a,b)=>b.ts-a.ts).slice(0,5).map(v=>{const u=allUsers[v.uid];return u?`<img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-6 h-6 object-cover cursor-pointer" title="${esc(u.name)}" onclick="openUser('${v.uid}')">`:'';}).join('');}return `<div class="glass p-5 mt-4"><div class="flex items-center gap-2 mb-4"><i data-lucide="activity" class="w-5 h-5 text-emerald-400"></i><b class="font-display">📊 Battle Statistics</b></div><div class="flex items-end gap-1.5 mb-4" style="height:64px">${buckets.map(c=>`<div class="flex-1 gradient-brand" style="height:${Math.max(6,c/mx*100)}%;opacity:${.35+.65*(c/mx)}" title="${c}"></div>`).join('')}</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="stat-tile"><b class="text-emerald-400" data-count="${voters}">0</b><span>Total voters</span></div><div class="stat-tile"><b class="text-cyan-300">${part}%</b><span>Participation</span></div><div class="stat-tile"><b class="text-indigo-300">${vph}</b><span>Votes / hour</span></div><div class="stat-tile"><b class="text-yellow-300" data-count="${mx}">0</b><span>Peak</span></div></div>${vh?`<div class="flex items-center gap-2 mt-3"><span class="text-[11px] text-white/40 font-bold">Recent voters:</span><div class="flex gap-1.5">${vh}</div></div>`:''}</div>`;}

async function createTournament(){const name=$('#tm-name').value.trim(),cat=$('#tm-cat').value,opts=tOpts.map(o=>o.trim()).filter(Boolean);if(name.length<3)return toast('Name too short','warning');if(opts.length!==tSize)return toast('All '+tSize+' options required','warning');if(new Set(opts).size!==opts.length)return toast('Options must be unique','warning');const tref=await db.ref('tournaments').push({name,size:tSize,category:cat,options:opts,creator:MY.uid,creatorName:MY.name,createdAt:Date.now(),round:1,status:'active',winner:'',matches:{}});const nids={};for(let i=0;i<opts.length;i+=2){const bref=await db.ref('battles').push({title:`${name} — R1: ${opts[i]} vs ${opts[i+1]}`,category:cat,creator:MY.uid,creatorName:MY.name,createdAt:Date.now(),endsAt:Date.now()+864e5,tournament:tref.key,round:1,match:i/2,options:[{label:opts[i],img:'',votes:{}},{label:opts[i+1],img:'',votes:{}}]});nids[i/2]=bref.key;}await db.ref('tournaments/'+tref.key+'/matches/1').set(nids);await db.ref('users/'+MY.uid+'/achievements/tournament1').set(Date.now());closeModal();toast('Tournament started! 🥇','success');fireConfetti();navTo('tournaments');}
async function checkTournaments(){if(!MY)return;for(const[id,t]of Object.entries(allTournaments)){if(!t||t.status!=='active')continue;const ms=t.matches&&t.matches[t.round];if(!ms)continue;const ids=Object.values(ms);if(ids.length<2)continue;const battles=ids.map(b=>allBattles[b]);if(battles.some(b=>!b)||battles.some(b=>Date.now()<=(b.endsAt||0)))continue;const winners=battles.map(b=>{const o=b.options||[],c=o.map(x=>Object.keys(x.votes||{}).length),tot=c.reduce((a,x)=>a+x,0);if(!tot)return null;const mx=Math.max(...c);return c.filter(x=>x===mx).length===1?o[c.indexOf(mx)].label:null;});if(winners.some(w=>!w)){for(let i=0;i<battles.length;i++)if(!winners[i])await db.ref('battles/'+ids[i]+'/endsAt').set(Date.now()+216e5);continue;}if(winners.length===1){await db.ref('tournaments/'+id).update({status:'finished',winner:winners[0]});if(t.creator&&t.creator!==MY.uid)pushNotif(t.creator,'tournament','🏆 Your tournament "'+t.name+'" finished! Winner: '+winners[0],{});continue;}const no=winners.map(w=>({label:w})),nids={};for(let i=0;i<no.length;i+=2){const bref=await db.ref('battles').push({title:t.name+' — R'+(t.round+1)+': '+no[i].label+' vs '+no[i+1].label,category:t.category,creator:t.creator,creatorName:t.creatorName,createdAt:Date.now(),endsAt:Date.now()+864e5,tournament:id,round:t.round+1,match:i/2,options:[{label:no[i].label,img:'',votes:{}},{label:no[i+1].label,img:'',votes:{}}]});nids[i/2]=bref.key;}await db.ref('tournaments/'+id+'/matches/'+(t.round+1)).set(nids);await db.ref('tournaments/'+id+'/round').set(t.round+1);toast('🥇 Tournament "'+t.name+'" — Round '+(t.round+1)+' started!','success');}}
function tournamentCard(id,t){const totalR=Math.round(Math.log2(t.size||4));let cols='';for(let r=1;r<=totalR;r++){const ms=(t.matches||{})[r]||{};cols+=`<div style="min-width:200px;flex:1"><div class="text-[10px] uppercase tracking-wider text-white/35 font-bold mb-1.5">${r===totalR?'🏆 Final':'Round '+r}</div>${Object.values(ms).map(bid=>{const b=allBattles[bid];if(!b)return'';const ended=Date.now()>(b.endsAt||0);let wl='';if(ended){const c=(b.options||[]).map(o=>Object.keys(o.votes||{}).length),mx=Math.max(...c);if(c.filter(x=>x===mx).length===1)wl=b.options[c.indexOf(mx)].label;}return `<div class="glass p-2.5 mb-1.5 cursor-pointer flex items-center gap-2" onclick="openBattle('${bid}')"><i data-lucide="swords" class="w-3.5 h-3.5 text-white/30"></i><span class="text-[11.5px] flex-1 truncate">${esc((b.options||[]).map(o=>o.label).join(' vs '))}</span>${wl?`<span class="badge" style="color:#FCD34D">🏆 ${esc(wl)}</span>`:`<span class="badge tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span>`}</div>`;}).join('')||'<div class="text-[11px] text-white/25 px-1 py-2">Coming soon…</div>'}</div>`;}return `<div class="glass-strong p-4 mb-4"><div class="flex items-center gap-2 flex-wrap mb-3"><i data-lucide="medal" class="w-5 h-5" style="color:#FCD34D"></i><b class="font-display text-[16px] flex-1 min-w-[150px]">${esc(t.name)}</b><span class="badge" style="color:${catOf(t.category).color}">${catOf(t.category).name}</span><span class="badge">${t.size} players</span>${t.status==='finished'?'<span class="badge" style="color:#10B981">✅ Finished</span>':`<span class="badge" style="color:#F97316">Round ${t.round} live</span>`}</div>${t.status==='finished'?`<div class="glass p-3 text-center mb-3" style="border-color:rgba(251,191,36,.4)"><div class="text-[10px] uppercase tracking-widest text-white/40 font-bold mb-0.5">🏆 Winner</div><div class="font-display font-extrabold text-xl golden-quote">${esc(t.winner)}</div></div>`:''}<div class="flex gap-3 overflow-x-auto">${cols}</div><div class="text-[10.5px] text-white/30 mt-2">by ${esc(t.creatorName||'')} · ${fmtDate(t.createdAt)}</div></div>`;}

async function _sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function hashSecure(p,salt){try{if(window.crypto&&crypto.subtle)return 'v2'+await _sha(String(salt)+'::v2::'+String(p));}catch(e){}return hashPass(p);}

  $('#app').innerHTML=html;

function analyzeImage(src){return new Promise(res=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{if(!img.width||!img.height)return res({ok:false});const S=56,sc=Math.min(1,S/Math.max(img.width,img.height)),w=Math.max(2,Math.round(img.width*sc)),h=Math.max(2,Math.round(img.height*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);const d=ctx.getImageData(0,0,w,h).data;let lum=0,sat=0,n=w*h;const lums=new Array(n);for(let i=0;i<n;i++){const j=i*4,r=d[j],g=d[j+1],b2=d[j+2],l=.299*r+.587*g+.114*b2;lums[i]=l;lum+=l;const mx=Math.max(r,g,b2),mn=Math.min(r,g,b2);sat+=mx===0?0:(mx-mn)/mx;}lum/=n;sat/=n;let vr=0;for(let i=0;i<n;i++)vr+=(lums[i]-lum)*(lums[i]-lum);const std=Math.sqrt(vr/n);let edges=0;for(let y=1;y<h;y++)for(let x=1;x<w;x++){const i2=(y*w+x)*4,lc=.299*d[i2-4]+.587*d[i2-3]+.114*d[i2-2],lb=.299*d[i2-w*4]+.587*d[i2-w*4+1]+.114*d[i2-w*4+2];if(Math.abs(lc-lb)>18)edges++;}res({ok:true,brightness:lum/255,saturation:sat,contrast:std/128,detail:Math.min(1,edges/Math.max(1,(w-1)*(h-1))*3)});}catch(e){res({ok:false});}};img.onerror=()=>res({ok:false});img.src=src;});}
async function computerCalc(bid){const b=allBattles[bid];if(!b)return;const opts=b.options||[];if(!opts.length)return toast('No options','warning');$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-card scale-in text-center"><div class="text-5xl mb-3">🤖</div><b class="font-display text-lg">Computer Calculator</b><div class="text-white/45 text-sm mt-2">Analyzing…</div></div></div>`;const an=[];for(const o of opts)an.push(await analyzeImage(o.img||''));const scores=opts.map((o,i)=>{const a=an[i];if(a&&a.ok)return{label:o.label,real:true,b:Math.round(a.brightness*100),s:Math.round(a.saturation*100),c:Math.round(Math.min(100,a.contrast*100)),d:Math.round(a.detail*100),score:Math.round(Math.min(100,Math.max(6,a.brightness*30+a.saturation*25+a.contrast*25+a.detail*25+6)))};let h=0;const t=String(o.label||('Option '+(i+1)));for(let j=0;j<t.length;j++)h=(h*33+t.charCodeAt(j))>>>0;return{label:o.label,real:false,b:35+(h%55),s:30+(h%60),c:35+(h%50),d:30+(h%55),score:30+(h%55)};});const total=scores.reduce((x,s)=>x+s.score,0)||1;let pcts=scores.map(s=>Math.round(s.score/total*100));const diff=100-pcts.reduce((a,b)=>a+b,0);if(pcts.length&&diff)pcts[pcts.length-1]+=diff;const wi=pcts.indexOf(Math.max(...pcts)),close=pcts.length>1&&(Math.max(...pcts)-Math.min(...pcts))<=5;const bar=(l,v)=>`<div class="flex items-center gap-2 mb-1"><span class="text-[10.5px] text-white/45" style="width:74px">${l}</span><div class="flex-1 h-2 bg-white/10 overflow-hidden"><div class="h-full" style="width:${Math.min(100,v)}%;background:linear-gradient(90deg,#06B6D4,#3B82F6)"></div></div><span class="text-[10.5px] text-white/55" style="width:32px;text-align:right">${v}</span></div>`;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2.5"><div class="w-9 h-9 flex items-center justify-center" style="background:line async function adminFinishNow(id){if(!isAdmin)return toast('Admins only','error');if(_finishLock.has(id))return toast('Already being finished…','warning');const b=allBattles[id];if(!b)return;if(archivedResults[id])return toast('Already finished!','warning');if(Date.now()>(b.endsAt||0))return toast('Battle already ended','warning');if(!confirm('Finish this battle NOW?'))return;_finishLock.add(id);const counts=(b.options||[]).map(o=>Object.keys(o.votes||{}).length),total=counts.reduce((a,c)=>a+c,0);let w='Tie';if(total>0){const mx=Math.max(...counts);if(counts.filter(c=>c===mx).length===1)w=b.options[counts.indexOf(mx)].label;}try{await db.ref('results/'+id).set({title:b.title,category:b.category,winner:w,total,endedAt:Date.now(),creator:b.creator||'',creatorName:b.creatorName||'',endedEarly:true});await db.ref('battles/'+id).remove();await db.ref('comments/'+id).remove();}catch(e){_finishLock.delete(id);showFirebaseError(e);return;}archivedResults[id]={title:b.title,category:b.category,winner:w,total,endedAt:Date.now(),endedEarly:true};toast('⚡ Battle finished early!','success');lbView='results';navTo('leaderboard');}

async function doSpinPage(){if(pageSpinning)return;const today=new Date().toDateString();if(MY.lastSpin===today)return toast('Already spun today','warning');pageSpinning=true;const w=$('#pg-spin-wheel'),btn=$('#pg-spin-btn');if(!w){pageSpinning=false;return;}if(btn){btn.disabled=true;btn.style.opacity=.5;btn.textContent='🎡 Spinning…';}const seg=360/WHEEL.length;const pickI=Math.floor(Math.random()*WHEEL.length);const desired=((360-(pickI*seg+seg/2))%360+360)%360;let final=wheelRot+360*6;final+=((desired-(final%360))+360)%360;w.style.transform=`rotate(${final}deg)`;wheelRot=final;setTimeout(async()=>{const val=WHEEL[pickI].v;const old=MY.xp||0,nw=old+val;try{await db.ref('users/'+MY.uid).update({xp:nw,lastSpin:today});}catch(e){}MY.xp=nw;MY.lastSpin=today;pageSpinning=false;pushHist('basiler_spinhist',{v:val,date:new Date().toLocaleString()});fireConfetti();flyXP('🎡 +'+val+' XP!');beep();checkLevelUp(old,nw);render();},4800);}

function spinRoulettePage(){const live=Object.entries(allBattles).filter(([,b])=>Date.now()<=(b.endsAt||0));if(!live.length)return toast('No live battles','warning');const btn=$('#pg-rou-btn'),el=$('#pg-rou-display');if(btn){btn.disabled=true;btn.style.opacity=.5;btn.textContent='🎲 Shuffling…';}let i=0,rounds=0;const step=()=>{if(!el)return;el.textContent=live[i%live.length][1].title;el.style.transform='scale(1.06)';setTimeout(()=>{if(el)el.style.transform='scale(1)';},45);i++;rounds++;if(rounds<live.length*3+Math.floor(Math.random()*live.length)){rouletteTimer=setTimeout(step,55+rounds*9);}else{const pick=live[(i-1)%live.length];el.innerHTML='🎉 '+esc(pick[1].title);fireConfetti();beep();setTimeout(()=>{openBattle(pick[0]);},900);}};step();}
function pageToolLove(){const hist=getHist('basiler_lovehist');return `<div class="max-w-2xl mx-auto fade-up">${toolHeaderHTML('heart','Love Calculator','Check name compatibility','linear-gradient(135deg,#EC4899,#F472B6)')}<div class="glass-strong p-6 v6-rotX"><div class="text-center mb-4"><div class="text-5xl v6-heart">💖</div></div><div class="space-y-3"><input id="pg-lc1" class="input-field" maxlength="25" placeholder="Your name" onkeydown="if(event.key==='Enter')document.getElementById('pg-lc2').focus()"><input id="pg-lc2" class="input-field" maxlength="25" placeholder="Their name" onkeydown="if(event.key==='Enter')checkLovePage()"><button class="btn-primary w-full py-3.5 font-extrabold" onclick="checkLovePage()" style="background:linear-gradient(135deg,#EC4899,#F43F5E)">💖 Check Love</button></div><div id="pg-lc-res" style="display:none" class="mt-4"></div></div><div class="glass-strong p-5 mt-4"><div class="flex items-center gap-2 mb-3"><i data-lucide="history" class="w-4 h-4 text-pink-400"></i><b class="font-display">💘 History</b></div>${hist.length?hist.map((h,i)=>`<div class="a-row v6-fadeR" style="animation-delay:${i*60}ms"><span class="badge" style="color:#F472B6">${h.p}%</span><span class="flex-1 text-[12.5px] text-white/70">${esc(h.a)} ♡ ${esc(h.b)}</span><span class="text-[10px] text-white/30">${esc(h.d)}</span></div>`).join(''):'<div class="text-white/35 text-[12.5px]">No checks yet — try it above!</div>'}</div></div>`;}
function calcLovePct(a,b){a=String(a).toLowerCase().trim();b=String(b).toLowerCase().trim();const key=[a,b].sort().join('♡');let h=0;for(let i=0;i<key.length;i++)h=((h<<5)-h+key.charCodeAt(i))|0;return Math.abs(h)%101;}
async function checkLovePage(){const a=$('#pg-lc1').value.trim(),b=$('#pg-lc2').value.trim();if(!a||!b)return toast('Enter both names','warning');const pct=calcLovePct(a,b),res=$('#pg-lc-res');let msg,emoji,color;if(pct>=80){msg='Perfect Match!';emoji='💕';color='#EC4899';}else if(pct>=60){msg='Great Connection!';emoji='💗';color='#F472B6';}else if(pct>=40){msg='Good Friends';emoji='💛';color='#FBBF24';}else if(pct>=20){msg='Acquaintances';emoji='🤍';color='#94A3B8';}else{msg='Not a Match';emoji='💔';color='#64748B';}pushHist('basiler_lovehist',{a,b,p:pct,d:new Date().toLocaleDateString()});if(pct>(MY.loveHigh||0)){await db.ref('users/'+MY.uid).update({loveHigh:pct,loveHighWith:b});MY.loveHigh=pct;MY.loveHighWith=b;fireConfetti();toast('🏆 New personal best: '+pct+'%!','success');}res.style.display='block';res.innerHTML=`<div class="text-center v6-zoomBurst" style="background:rgba(236,72,153,.06);border:1px solid rgba(236,72,153,.25);padding:22px"><div style="font-size:46px" class="v6-heart">${emoji}</div><div class="font-display font-extrabold text-5xl mt-2 anim-colorCycle" style="color:${color}">${pct}%</div><div class="text-[13px] text-white/70 mt-2">${esc(a)} ♡ ${esc(b)}</div><div class="text-[15px] font-bold mt-1" style="color:${color}">${msg}</div></div>`;beep();}

function gsPageResultsHTML(q){const s=q.trim().toLowerCase();if(!s)return'';const users=Object.entries(allUsers).filter(([uid,u])=>uid!=='system'&&!bannedUsers.has(uid)&&(u.name||'').toLowerCase().includes(s)).slice(0,8);const battles=Object.entries(allBattles).filter(([,b])=>(b.title||'').toLowerCase().includes(s)||(b.tags||[]).some(t=>t.toLowerCase().includes(s))).slice(0,8);const posts=allPosts.filter(p=>(p.text||'').toLowerCase().includes(s)).slice(0,6);let h='';if(users.length)h+=`<div class="text-[10.5px] uppercase tracking-wider font-bold text-white/35 mb-1.5 mt-2 v6-fadeR">👤 Users (${users.length})</div>`+users.map((u2,i)=>`<div class="gs-result glass p-2.5 mb-1.5 flex items-center gap-2.5 cursor-pointer card-hover v6-zoomBurst" style="animation-delay:${i*40}ms" onclick="openUser('${u2[0]}')"><img src="${u2[1].avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover"><div class="flex-1 min-w-0"><b class="text-[13.5px]">${esc(u2[1].name)}</b><div class="text-[10px] text-cyan-300 font-bold">${userCode(u2[0])} · L${levelOf(u2[1].xp||0)} · ⚡${fmt(u2[1].xp||0)} XP</div></div><i data-lucide="chevron-right" class="w-4 h-4 text-white/25"></i></div>`).join('');if(battles.length)h+=`<div class="text-[10.5px] uppercase tracking-wider font-bold text-white/35 mb-1.5 mt-3 v6-fadeR">⚔ Battles (${battles.length})</div>`+battles.map((b2,i)=>`<div class="gs-result glass p-2.5 mb-1.5 flex items-center gap-2.5 cursor-pointer card-hover v6-zoomBurst" style="animation-delay:${i*40}ms" onclick="openBattle('${b2[0]}')"><div class="flex-1 min-w-0"><b class="text-[13px] clamp2">${esc(b2[1].title)}</b><div class="text-[10px] text-white/40">🗳 ${fmt(votesOf(b2[1]))} · ${catOf(b2[1].category).name}</div></div><i data-lucide="chevron-right" class="w-4 h-4 text-white/25"></i></div>`).join('');if(posts.length)h+=`<div class="text-[10.5px] uppercase tracking-wider font-bold text-white/35 mb-1.5 mt-3 v6-fadeR">📝 Posts (${posts.length})</div>`+posts.map((p,i)=>`<div class="gs-result glass p-2 function genPassHTML(){const cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?';let p='';for(let i=0;i<window._pl;i++)p+=cs[Math.floor(Math.random()*cs.length)];const sc=[/[a-z]/.test(p),/[A-Z]/.test(p),/[0-9]/.test(p),/[!@#$%&*?]/.test(p)].filter(Boolean).length;const st=sc<2?['Weak','#F43F5E',25]:sc<3?['Medium','#FBBF24',55]:sc<4?['Strong','#10B981',80]:['Very Strong','#10B981',100];window._lastPass=p;return `<div class="pas-word"><span>${esc(p)}</span><button class="a-btn" onclick="navigator.clipboard.writeText(window._lastPass).then(()=>toast('Password copied 📋','success'))">📋</button></div><div class="flex items-center gap-2"><div class="flex-1 h-2.5 bg-white/10 overflow-hidden"><div style="width:${st[2]}%;height:100%;background:${st[1]}"></div></div><b style="color:${st[1]};font-size:11px">${st[0]}</b></div>`;}

function pageToolConv(){const U={km:'Kilometers',mi:'Miles',kg:'Kilograms',lb:'Pounds',cm:'Centimeters',in:'Inches'};const c=window._cv||['km','mi'];return `<div class="max-w-2xl mx-auto fade-up">${toolHeaderHTML('repeat','Unit Converter','km · miles · kg · lbs · cm · in','linear-gradient(135deg,#06B6D4,#3B82F6)')}<div class="glass-strong p-5"><div class="grid grid-cols-2 gap-3"><div><label class="lbl">From</label><select id="cv-f" class="input-field">${Object.keys(U).map(k=>`<option value="${k}" ${c[0]===k?'selected':''}>${U[k]} (${k})</option>`).join('')}</select></div><div><label class="lbl">To</label><select id="cv-t" class="input-field">${Object.keys(U).map(k=>`<option value="${k}" ${c[1]===k?'selected':''}>${U[k]} (${k})</option>`).join('')}</select></div></div><label class="lbl">Value</label><input id="cv-v" type="number" class="input-field" placeholder="e.g. 10" onkeydown="if(event.key==='Enter')doConv()"><button class="btn-primary w-full py-3.5 font-extrabold mt-3" onclick="doConv()" style="background:linear-gradient(135deg,#06B6D4,#3B82F6)">🔄 CONVERT</button><div id="cv-out" class="mt-3"></div></div></div>`;}
function doConv(){const U={km:{mi:.621371},mi:{km:1.60934},kg:{lb:2.20462},lb:{kg:.453592},cm:{in:.393701},in:{cm:2.54}};const f=$('#cv-f').value,t=$('#cv-t').value,v=parseFloat($('#cv-v').value);window._cv=[f,t];if(isNaN(v))return toast('Enter a number first','warning');if(f===t){$('#cv-out').innerHTML=`<div class="glass p-3 text-center font-display font-extrabold text-xl v6-zoomBurst">${v} ${f}</div>`;return;}const r=v*U[f][t];$('#cv-out').innerHTML=`<div class="glass p-3 text-center v6-zoomBurst"><div class="text-white/40 text-[11px]">${v} ${f} =</div><div class="font-display font-extrabold text-2xl" style="color:#67E8F9">${r.toFixed(4)} ${t}</div><button class="a-btn mt-2" onclick="navigator.clipboard.writeText('${r.toFixed(4)}').then(()=>toast('Copied 📋','success'))">📋 Copy</button></div>`;beep();}

function playVoice(btn,id){const m=chatMsgs.find(x=>x.id===id);if(!m||!m.voice)return;const wave=btn.parentElement?btn.parentElement.querySelector('.voice-wave'):null;if(window._va){window._va.pause();if(_lastVoiceBtn){_lastVoiceBtn.textContent='▶';const lw=_lastVoiceBtn.parentElement?_lastVoiceBtn.parentElement.querySelector('.voice-wave'):null;if(lw)lw.classList.remove('playing');}}if(window._va&&window._va._bid===id){window._va._bid=null;_lastVoiceBtn=null;window._va=null;return;}const a=new Audio(m.voice);a._bid=id;window._va=a;_lastVoiceBtn=btn;btn.textContent='⏸';if(wave)wave.classList.add('playing');a.onended=()=>{btn.textContent='▶';if(wave)wave.classList.remove('playing');if(window._va===a)window._va=null;};a.onpause=()=>{btn.textContent='▶';if(wave)wave.classList.remove('playing');};a.play().catch(()=>{btn.textContent='▶';if(wave)wave.classList.remove('playing');toast('Cannot play voice','error');});}
/* ===== ★ PIN MESSAGE ===== */
async function pinMsg(id){const m=chatMsgs.find(x=>x.id===id);if(!m||m.pending)return;await db.ref(chatPath()+'/pinned').set({id,uid:m.uid,name:m.name,text:String(m.text||'[media]').slice(0,90),ts:m.ts});toast('📌 Pinned','success');}
async function unpinMsg(){await db.ref(chatPath()+'/pinned').remove();toast('Unpinned','info');}
function renderPinnedBar(){const el=document.getElementById('pin-bar');if(!el)return;const p=window._pinned;if(!p){el.innerHTML='';el.style.display='none';return;}el.style.display='flex';el.innerHTML=`<i data-lucide="pin" class="w-3.5 h-3.5 text-yellow-300"></i><div class="flex-1 min-w-0 text-[12px]"><b class="text-yellow-300">Pinned</b> · <b>${esc(p.name)}</b>: <span class="text-white/70">${esc(p.text)}</span></div><button class="msg-act" onclick="unpinMsg()"><i data-lucide="x" class="w-3 h-3"></i></button>`;lucide.createIcons();}
/* ===== ★ LIVE COUNTDOWN ===== */
function startLiveCountdown(endAt){stopLiveCountdown();const tick=()=>{const el=document.getElementById('live-cd');if(!el)return stopLiveCountdown();let d=Math.max(0,endAt-Date.now());if(d<=0){el.innerHTML='<b style="color:#F43F5E;font-family:Sora">⏱ Ended</b>';return stopLiveCountdown();}const dy=Math.floor(d/864e5),h=Math.floor(d%864e5/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);el.innerHTML=(dy>0?`<div class="cd-seg"><b>${dy}</b><span>DAYS</span></div>`:'')+`<div class="cd-seg"><b>${String(h).padStart(2,'0')}</b><span>HRS</span></div><div class="cd-seg"><b>${String(m).padStart(2,'0')}</b><span>MIN</span></div><div class="cd-seg" style="border-color:rgba(244,63,94,.5)"><b style="color:#F43F5E">${String(s).padStart(2,'0')}</b><span>SEC</span></div>`;};tick();cdTimer=setInterval(tick,1000);}
function stopLiveCountdown(){if(cdTimer){clearInterval(cdTimer);cdTimer=null;}}

r gap-3 flex-wrap v6-fadeR" style="border-color:rgba(56,189,248,.4)"><span class="text-2xl">🕐</span><img src="${latestLogin[1].avatar||AVATAR_PRESETS[0]}" class="w-11 h-11 object-cover cursor-pointer" onclick="adminPage='logins';render()"><div class="flex-1 min-w-[140px]"><div class="text-[9px] uppercase tracking-widest text-cyan-300 font-bold">Latest Login</div><b class="font-display text-[15px]">${esc(latestLogin[1].name)}</b><div class="text-[10.5px] text-white/40">${latestLogin[1].lastLogin?fmtTime(latestLogin[1].lastLogin):'Never'}</div></div><button class="a-btn" onclick="adminPage='logins';render()">Activity →</button></div>`:''}<div class="glass-strong p-3.5 mb-4 flex items-center gap-3 v6-fadeR" style="border-color:rgba(236,72,153,.4);cursor:pointer" onclick="adminBroadcast()"><div class="w-11 h-11 flex items-center justify-center flex-shrink-0" style="background:linear-gradient(135deg,#EC4899,#F43F5E);color:#fff"><i data-lucide="megaphone" class="w-5 h-5"></i></div><div class="flex-1 min-w-0"><div class="font-display font-bold text-[15px]">📢 Broadcast Message</div><div class="text-[11px] text-white/45">👑 Send green OWNER message to ALL users</div></div><i data-lucide="chevron-right" class="w-4 h-4 text-white/25"></i></div><div class="grid md:grid-cols-2 gap-3">${cards.map((c,i)=>`<div class="adm-card" style="animation-delay:${i*50}ms" onclick="navAdmin('${c.p}')"><div class="adm-ic" style="background:${c.c}22;border:1px solid ${c.c}55;color:${c.c}"><i data-lucide="${c.ic}" class="w-5 h-5"></i></div><div class="min-w-0"><div class="font-display font-bold text-[15.5px]">${c.t}</div><div class="text-[11.5px] text-white/45">${c.d}</div></div><i data-lucide="chevron-right" class="w-4 h-4 text-white/20 ml-auto"></i></div>`).join('')}</div></div>`;}
function pageLogins(){const users=Object.entries(allUsers).map(([uid,u])=>({uid,...u})).filter(u=>u.uid!=='system').sort((a,b)=>(b.lastLogin||0)-(a.lastLogin||0));const tl=users.reduce((a,u)=>a+(u.loginCount||0),0);const latest=users[0];return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}${impLiveBox()}<h2 class="font-display font-extrabold text-2xl mb-1">🔐 Login Activity</h2><p class="text-white/45 text-sm mb-3">Latest login first · time spent</p>${latest?`<div class="glass-strong p-4 mb-4 flex items-center gap-3 flex-wrap" style="border-color:rgba(56,189,248,.4)"><div class="text-3xl">🕐</div><img src="${latest.avatar||AVATAR_PRESETS[0]}" class="w-12 h-12 object-cover cursor-pointer" onclick="openUser('${latest.uid}')"><div class="flex-1 min-w-[150px]"><div class="text-[10px] uppercase tracking-widest font-bold mb-0.5" style="color:#38BDF8">Latest Login</div><b class="font-display text-[16px]">${esc(latest.name)}</b><div class="text-[10.5px] text-white/40">${latest.lastLogin?fmtTime(latest.lastLogin):'Never'}</div></div><span class="badge" style="color:#38BDF8">⏱ ${fmtDur(latest.timeSpent)}</span></div>`:''}<div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-5"><div class="stat-tile"><b class="text-cyan-300" data-count="${users.length}">0</b><span>Users</span></div><div class="stat-tile"><b class="text-emerald-400" data-count="${tl}" data-fmt="1">0</b><span>Total logins</span></div><div class="stat-tile"><b class="text-indigo-300">${onlineUsers.length}</b><span>Online now</span></div><div class="stat-tile"><b class="text-yellow-300">${fmtDur(users.reduce((a,u)=>a+(u.timeSpent||0),0))}</b><span>Total time</span></div></div>${users.map((u,i)=>`<div class="a-row"><span class="badge" style="color:#818CF8">#${i+1}</span><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover"><div class="flex-1 min-w-[110px]"><b class="text-[13.5px]">${esc(u.name)}</b> ${uidChip(u.uid)}</div><span class="badge" style="color:#22D3EE">🔐 ${u.loginCount||0}</span> function pageStudio(){const grad=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`,mixed=mixHex(stC1,stC2);return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">🎨 Theme Studio</h2><p class="text-white/45 text-sm mb-2">Global — applies to ALL users instantly</p><div class="glass-strong p-5 mb-5"><div class="st-preview mb-3" id="stprev" style="background:${grad}"></div><div class="grid grid-cols-2 gap-3 mb-3"><div><label class="lbl">Color 1</label><input type="color" id="stc1" class="st-color-in" value="${stC1}" oninput="stUpd()"></div><div><label class="lbl">Color 2</label><input type="color" id="stc2" class="st-color-in" value="${stC2}" oninput="stUpd()"></div></div><label class="lbl">Angle: <span id="stangval">${stAngle}°</span></label><input type="range" min="0" max="360" id="stang" class="st-range mb-4" value="${stAngle}" oninput="stUpd()"><div class="flex gap-2 flex-wrap mb-4"><button class="btn-primary px-4 py-2.5 font-bold text-[13px] flex-1 min-w-[140px]" onclick="stApply()">✅ Apply Globally</button><button class="btn-ghost px-4 py-2.5 font-bold text-[13px]" onclick="stMixNow()">🎨 Mix</button><button class="btn-ghost px-4 py-2.5 font-bold text-[13px]" onclick="stRandom()">🎲 Random</button></div><div class="flex items-center gap-3 flex-wrap"><span class="text-[11px] text-white/40 font-bold">Mix:</span><div class="st-mixbox" style="background:${mixed}"></div><code class="text-[10.5px] text-white/50">${mixed}</code><button class="a-btn" style="margin-left:auto" onclick="stUseMix()">Use as Color 2</button></div></div><div class="glass-strong p-5"><label class="lbl">Quick Palette</label><div class="flex gap-2 flex-wrap mb-4">${STUDIO_PALETTE.map(c=>`<div class="solid-sw" style="background:${c}" onclick="stPick('${c}')"></div>`).join('')}</div><label class="lbl">Solid Backgrounds — one click global</label><div class="grid grid-cols-4 md:grid-cols-8 gap-2">${STUDIO_SOLIDS.map(c=>`<div class="solid-sw" style="background:${c}" onclick="stApplySolid('${c}')"></div>`).join('')}</div></div></div>`;}
function stUpd(){stC1=$('#stc1').value;stC2=$('#stc2').value;stAngle=+$('#stang').value;if($('#stprev'))$('#stprev').style.background=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`;if($('#stangval'))$('#stangval').textContent=stAngle+'°';}
function stPick(c){stC1=c;$('#stc1').value=c;stUpd();toast('Color 1 = '+c,'info');}
function stMixNow(){stC2=mixHex(stC1,stC2);$('#stc2').value=stC2;stUpd();toast('Mixed → '+stC2,'success');}
function stUseMix(){stC2=mixHex(stC1,stC2);$('#stc2').value=stC2;stUpd();toast('Mix as Color 2','success');}
function stRandom(){stC1=randColor();stC2=randColor();stAngle=Math.floor(Math.random()*360);$('#stc1').value=stC1;$('#stc2').value=stC2;$('#stang').value=stAngle;stUpd();toast('🎲 Random','info');}
async function stApply(){const css=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`;await db.ref('meta/settings').update({theme:-1,customBg:css});SETTINGS.customBg=css;SETTINGS.theme=-1;applySettings(SETTINGS);toast('🌍 Applied to ALL users!','success');render();}
async function stApplySolid(c){await db.ref('meta/settings').update({theme:-1,customBg:c});SETTINGS.customBg=c;SETTINGS.theme=-1;applySettings(SETTINGS);toast('🌍 Applied to ALL users!','success');render();}
function pageAdminUsers(){const q=(adminQ||'').toLowerCase();const users=Object.entries(allUsers).filter(([uid])=>uid!=='system'&&(!q||(allUsers[uid].name||'').toLowerCase().includes(q)));return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}${impLiveBox()}<h2 class="font-display font-extrabold text-2xl mb-1">👤 Users</h2><p class="text-white/45 text-sm mb-3">${users.length} users · ${bannedUsers.size} banned</p><div class="glass p-2.5 flex items-center gap-2 mb-3 v6-blurIn"><i data-lucide="search" class="w-4 h-4 text-white/30"></i><input class="bg-transparent border-none flex-1 text-white text-[13px]" placeholder="Search users..." value="${esc(adminQ)}" oninput="adminQ=this.value;render()"><button class="a-btn" onclick="adminQ='';render()">Clear</button></div><div class="glass p-3 mb-5 text-[12px] text-white/55 flex items-center gap-2" style="border-color:rgba(168,85,247,.35)"><i data-lucide="venetian-mask" class="w-4 h-4 text-fuchsia-400"></i> 🎭 <b>Impersonate:</b> tap a user 5x fast (within 3 sec)</div>${users.map(([uid,u])=>`<div class="a-row v6-fadeR"><div class="flex items-center gap-2.5 flex-1 min-w-[140px] cursor-pointer" onclick="adminTapUser('${uid}')"><img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover"><div><b class="text-[13.5px]">${esc(u.name)}</b> ${uidChip(uid)}<div class="text-[10.5px] text-white/40">L${levelOf(u.xp)} · ${fmt(u.xp||0)} XP · ⏱ ${fmtDur(u.timeSpent)}</div></div></div><span class="badge" style="color:${isOnline(uid)?'#10B981':'#8A8DA3'}">${isOnline(uid)?'online':'offline'}</span>${u.verified?`<button class="a-btn" onclick="adminVerify('${uid}')">✅ Unverify</button>`:`<button class="a-btn" style="color:#38BDF8;border-color:rgba(56,189,248,.4)" onclick="adminVerify('${uid}')">Verify</button>`}${bannedUsers.has(uid)?`<button class="a-btn" onclick="adminUnban('${uid}')">Unban</button>`:`<button class="a-btn danger" onclick="adminBan('${uid}')">Ban</button>`}<button class="a-btn gift" onclick="adminGift('${uid}')">Gift XP</button></div>`).join('')||emptyState('users',q?'No users match your search':'No users')}</div>`;}
function pageAdminBattles(){const bl=Object.entries(allBattles);return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚔ Battles</h2><p class="text-white/45 text-sm mb-6">${bl.length} active</p>${bl.map(([id,b])=>`<div class="a-row"><span class="badge" style="color:${catOf(b.category).color}">${catOf(b.category).name}</span><div class="flex-1 min-w-[150px]"><b class="text-[13px]">${esc(b.title)}</b><div class="text-[10.5px] text-white/40">${fmt(votesOf(b))} votes · by ${esc(b.creatorName||'?')}</div></div><button class="a-btn" onclick="openBattle('${id}')">View</button>${Date.now()<=(b.endsAt||0)?`<button class="a-btn" style="color:#FCD34D;border-color:rgba(245,158,11,.45)" onclick="adminFinishNow('${id}')">⚡ Finish</button>`:''}<button class="a-btn danger" onclick="adminDelBattle('${id}')">Delete</button></div>`).join('')||emptyState('swords','No battles')}</div>`;}
function adminViewVotes(id){const b=allBattles[id];if(!b)return;const html=(b.options||[]).map(o=>{const vs=Object.entries(o.votes||{}).map(([uid,ts])=>{const u=allUsers[uid];return `<div class="a-row"><img src="${(u||{}).avatar||AVATAR_PRESETS[0]}" class="w-7 h-7 object-cover"><b class="text-[12px]">${esc(u?u.name:'Unknown')}</b>${uidChip(uid)}<span class="text-[10px] text-white/35" style="margin-left:auto">${fmtTime(ts)}</span></div>`;}).join('');return `<div class="mb-4"><div class="font-display font-bold text-[13.5px] mb-1.5">${esc(o.label)} — ${Object.keys(o.votes||{}).length}</div>${vs||'<div class="text-white/30 text-[11.5px] mb-2">No votes</div>'}</div>`;}).join('');$('#admin-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)document.getElementById('admin-root').innerHTML=''"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[15px]">🗳 Votes</b><button class="icobtn" style="width:34px;height:34px" onclick="document.getElementById('admin-root').innerHTML=''"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="text-[12px] text-white/50 mb-3">${esc(b.title)}</div>${html}</div></div>`;lucide.createIcons();}
/* 🔒 Privacy — ab password nahi dikhta (decPass secured hai Part 4 me) */
function pageAdminPrivacy(){const accs=Object.values(adminAccounts||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}${impLiveBox()}<h2 class="font-display font-extrabold text-2xl mb-1">🔒 Privacy & Accounts</h2><div class="glass p-3 mb-4 text-[12px] text-white/55">Total accounts: ${accs.length} · 🔐 passwords securely hashed</div>${accs.map(a=>`<div class="a-row"><img src="${(allUsers[a.uid]||{}).avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover"><div class="flex-1 min-w-[220px]"><div class="text-[14px] font-bold">👤 ${esc(a.name)} <span class="text-[10px] text-cyan-300 font-bold">${userCode(a.uid)}</span></div><div class="text-[12px] text-white/60">📧 ${esc(a.email)}</div><div class="text-[12px] font-bold" style="color:#FCD34D">🔑 ${esc(decPass(a.pw))}</div></div><button class="a-btn danger" onclick="adminDeleteAcc('${a.uid}','${emailKey(a.email)}')">Delete</button></div>`).join('')||emptyState('lock','No accounts')}</div>`;}
function pageAdminSettings(){return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚙ Global Settings</h2><p class="text-white/45 text-sm mb-2">Applies to ALL users instantly</p><div class="glass-strong p-6"><label class="lbl">Website Name (all users)</label><div class="flex gap-2 mb-3"><input id="ad-name" class="input-field" maxlength="20" value="${esc(SETTINGS.name)}"><button class="a-btn" onclick="adminSaveName()">Save</button></div><label class="lbl">Chatter App Name (all users)</label><div class="flex gap-2 mb-3"><input id="ad-cname" class="input-field" maxlength="20" value="${esc(SETTINGS.chatName)}"><button class="a-btn" onclick="adminSaveChatName()">Save</button></div><button class="btn-primary w-full py-3 font-bold mb-5" onclick="navAdmin('studio')" style="background:linear-gradient(135deg,#EC4899,#8B5CF6)">🎨 Theme Studio (Global)</button><label class="lbl">🖼 Chat Wallpaper for ALL users (${CHAT_WALLS.length} wallpapers)</label><div class="flex gap-2 flex-wrap mb-2">${CHAT_WALLS.map((w,i)=>`<div class="solid-sw ${(SETTINGS.chatWall===i)?'sel':''}" style="background:${w.bg||'rgba(255,255,255,.05)'};width:38px;height:38px" title="${w.n}" onclick="adminSetWall(${i})"></div>`).join('')}</div><div class="glass p-2.5 mb-5 text-[11px] text-white/45">Note: if a user picked their own wallpaper, their choice applies; otherwise the admin one shows for everyone.</div><label class="lbl">Global Themes (${THEMES.length})</label><div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-5" style="max-height:300px;overflow-y:auto">${THEMES.map((t,i)=>`<div class="theme-sw ${SETTINGS.theme===i?'sel':''}" style="background:${t.bg||'radial-gradient(circle at 30% 30%,#312e81,#06070D)'}" onclick="adminSetTheme(${i})"><span>${t.n}</span></div>`).join('')}</div><label class="lbl">Toggles</label><div class="a-row"><span class="flex-1 text-[13px]">👁 Public "Who Voted"</span><button class="a-btn" onclick="adminToggle('publicVoters')">${SETTINGS.publicVoters?'ON ✅':'OFF'}</button></div><div class="a-row"><span class="flex-1 text-[13px]">Clear ALL chats</span><button class="a-btn danger" onclick="clearChatNow()">Clear</button></div></div></div>`;}
async function adminSetWall(i){await db.ref('meta/settings/chatWall').set(i);SETTINGS.chatWall=i;applyChatTheme();toast('🌍 Wallpaper applied to ALL!','success');render();}
async function adminBan(uid){await db.ref('meta/banned/'+uid).set(true);toast('Banned','success');}
async function adminUnban(uid){await db.ref('meta/banned/'+uid).remove();toast('Unbanned','info');}
async function adminVerify(uid){const u=allUsers[uid];if(!u)return;await db.ref('users/'+uid+'/verified').set(!u.verified);toast(u.verified?'Unverified':'Verified ✅','success');}
async function adminGift(uid){const amt=parseInt(prompt('XP amount to gift:'),10);if(isNaN(amt)||!amt)return toast('Invalid','warning');const u=allUsers[uid];if(!u)return;await db.ref('users/'+uid).update({xp:(u.xp||0)+amt});toast(amt+' XP gifted!','success');}
async function adminDeleteAcc(uid,key){if(!confirm('PERMANENTLY DELETE this account?'))return;await db.ref('accounts/'+key).remove();await db.ref('users/'+uid).remove();await db.ref('presence/'+uid).remove();await db.ref('dms/'+uid).remove();await db.ref('notifs/'+uid).remove();adminAccounts=Object.fromEntries(Object.entries(adminAccounts).filter(([k])=>k!==key));render();toast('Account deleted','error');}
async function adminDelBattle(id){if(!confirm('Delete this battle?'))return;await db.ref('battles/'+id).remove();await db.ref('comments/'+id).remove();toast('Deleted','info');}
async function adminSaveName(){const n=$('#ad-name').value.trim();if(!n)return;await db.ref('meta/settings/name').set(n);SETTINGS.name=n;toast('Updated for ALL 🌍','success');render();}
async function adminSaveChatName(){const n=$('#ad-cname').value.trim();if(!n)return;await db.ref('meta/settings/chatName').set(n);SETTINGS.chatName=n;toast('Updated for ALL 🌍','success');render();}
async function adminSetTheme(i){await db.ref('meta/settings').update({theme:i,customBg:null});SETTINGS.theme=i;SETTINGS.customBg='';applySettings(SETTINGS);toast('🌍 Theme applied to ALL!','success');render();}
async function adminToggle(k){const v=!SETTINGS[k];await db.ref('meta/settings/'+k).set(v);SETTINGS[k]=v;toast(k+' → '+(v?'ON':'OFF'),'info');render();}
/* 👑 OWNER: Suggestions + reply system */

async function _p99archive(){
  if(!MY||!dataReady||!dataReady.battles)return;
  var now=Date.now();
  for(var id in allBattles){
    var b=allBattles[id];
    if(!b||b.tournament)continue;
    if(archivedResults[id]||_finishLock.has(id))continue;
    if(now<=(b.endsAt||0))continue;
    _finishLock.add(id);
    try{
      var counts=(b.options||[]).map(function(o){return Object.keys(o.votes||{}).length;});
      var total=counts.reduce(function(a,c){return a+c;},0);
      var w='Tie';
      if(total>0){var mx=Math.max.apply(null,counts);if(counts.filter(function(c){return c===mx;}).length===1)w=b.options[counts.indexOf(mx)].label;}
      var rec={title:b.title,category:b.category,winner:w,total:total,endedAt:b.endsAt||now,creator:b.creator||'',creatorName:b.creatorName||''};
      await db.ref('results/'+id).set(rec);
      archivedResults[id]=rec;
      if(view==='leaderboard')render();
    }catch(e){}
    _finishLock.delete(id);
  }
}

  if(!confirm('Finish this battle NOW?'))return;

  var w='Tie';
  if(total>0){var mx=Math.max.apply(null,counts);if(counts.filter(function(c){return c===mx;}).length===1)w=b.options[counts.indexOf(mx)].label;}
  try{
    var rec={title:b.title,category:b.category,winner:w,total:total,endedAt:Date.now(),creator:b.creator||'',creatorName:b.creatorName||'',endedEarly:true};
    await db.ref('results/'+id).set(rec);

/* WHITE→BLACK · BLUE→GREEN (sirf day mode + diary/chat me) */
function _dFix(){
  if(!MY||document.hidden)return;
  if(!document.body.classList.contains('day'))return;
  if(view!=='diary'&&view!=='chat')return;
  var root=null;
  if(view==='chat'){root=document.querySelector('.chat-page');}
  else{root=document.querySelector('.main-content');}
  if(!root)return;
  var els=root.querySelectorAll('*');
  for(var i=0;i<els.length;i++){
    var el=els[i];
    try{
      var tg=el.tagName;
      if(tg==='SVG'||tg==='IMG'||tg==='VIDEO'||tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||tg==='CANVAS')continue;
      var has=false;
      for(var j=0;j<el.childNodes.length;j++){var cn=el.childNodes[j];if(cn.nodeType===3&&cn.textContent&&cn.textContent.trim()){has=true;break;}}
      if(!has)continue;
      var cls=String(el.className||'');
      if(/gradient-text|rainbow-name|q9-shine|q9-galaxy|galaxy-name/.test(cls))continue;
      var cs=getComputedStyle(el);
      var m=String(cs.color).match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
      if(!m)continue;
      var r=+m[1],g=+m[2],b=+m[3];
      var lum=(0.299*r+0.587*g+0.114*b);
      var mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx===0?0:(mx-mn)/mx;
      var isWhite=(lum>170&&sat<0.32);
      var isBlue=(b>r+30&&b>=g+15&&sat>0.22);
      if(!isWhite&&!isBlue)continue;
      var bgLum=0.9,bgSat=0,node=el,depth=0,found=false;
      while(node&&node!==document.body&&depth<4){
        var bcs=getComputedStyle(node);
        var bm=String(bcs.backgroundColor).match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+))?/);
        if(bm&&(bm[4]===undefined||+bm[4]>0.55)){
          var br=+bm[1],bg2=+bm[2],bb=+bm[3];
          bgLum=(0.299*br+0.587*bg2+0.114*bb)/255;
          var bmx=Math.max(br,bg2,bb),bmn=Math.min(br,bg2,bb);
          bgSat=bmx===0?0:(bmx-bmn)/bmx;
          found=true;break;
        }
        node=node.parentElement;depth++;
      }
      if(found&&bgSat>0.3)continue;
      if(isBlue){el.style.color='#15803D';}
      else if(isWhite&&bgLum>0.5){el.style.color='#1B1C2A';}
    }catch(e){}
  }
}

/* ==================== G: ADD / DELETE ==================== */
async function gmAdd(){
  var name=document.getElementById('gm-name');
  var desc=document.getElementById('gm-desc');
  var code=document.getElementById('gm-code');
  var nm=name?name.value.trim():'';
  var ds=desc?desc.value.trim():'';
  var cd=code?code.value.trim():'';
  if(!nm||nm.length<2){try{toast('Game name likho','warning');}catch(e){}return;}
  if(!cd||cd.length<50){try{toast('Game code paste karo (poora HTML)','warning');}catch(e){}return;}
  if(cd.length>200000){try{toast('Code bohat bara hai (max 200KB) — game ko chhota karo','warning');}catch(e){}return;}
  var icons=gmIcons();
  var icon=window._gmSelIcon||icons[Math.floor(Math.random()*icons.length)];
  var grad=GM_GRADS[window._gmSelGrad||0];
  var ord=gmGames.length?Math.max.apply(null,gmGames.map(function(g){return g.ord||0;}))+1:1;
  var btn=document.querySelector('.gm-addbox .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='⏳ Adding...';}
  try{
    await db.ref('minigames').push({name:nm,desc:ds,code:cd,icon:icon,grad:grad,ord:ord,by:MY.name,ts:Date.now()});
    if(name)name.value='';
    if(desc)desc.value='';
    if(code)code.value='';
    window._gmSelIcon=null;
    fireConfetti();try{beep();}catch(e){}
    try{toast('🎮 Game added successfully!','success');}catch(e){}
    render();
  }catch(e){
    try{toast('Add failed — code bara ho sakta hai','error');}catch(x){}
  }
  if(btn){btn.disabled=false;btn.textContent='➕ Add Game';}
}
async function gmDel(id){
  var g=gmGames.filter(function(x){return x.id===id;})[0];
  if(!g)return;
  if(!confirm('Delete "'+g.name+'"?'))return;
  try{await db.ref('minigames/'+id).remove();try{toast('Game deleted','info');}catch(e){}}catch(e){}
}

      if(document.hidden&&Notification.permission==='granted'&&localStorage.getItem('basiler_pushmute')!=='1'){

          n.onclick=()=>{window.focus();n.close();};

      }
    },()=>{});
  }catch(e){}
}

  if(!('Notification' in window))return;
  const p=await Notification.requestPermission();
  document.getElementById('admin-root').innerHTML='';
  toast(p==='granted'?'🔔 Notifications ON!':'Permission denied',p==='granted'?'success':'warning');
}
async function togglePushNotifs(){
  if(!('Notification' in window))return toast('Is browser me supported nahi','error');
  const muted=localStorage.getItem('basiler_pushmute')==='1';
  if(muted){localStorage.setItem('basiler_pushmute','0');toast('🔔 Notifications ON','success');render();return;}
  if(Notification.permission==='granted'){localStorage.setItem('basiler_pushmute','1');toast('🔕 Notifications muted','info');render();return;}
  const p=await Notification.requestPermission();
  localStorage.setItem('basiler_pushmute',p==='granted'?'0':'1');

  render();
}

async function buyShop(cat,id,price){
  const owned=((MY.shop||{}).owned)||{};
  if(owned[cat+'_'+id])return;
  if((MY.xp||0)<price)return toast('XP kam hai! '+fmt(price)+' XP chahiye','warning');
  try{
    const u={xp:(MY.xp||0)-price};
    u['shop/owned/'+cat+'_'+id]=Date.now();
    await db.ref('users/'+MY.uid).update(u);
    MY.xp=(MY.xp||0)-price;
    MY.shop={...(MY.shop||{}),owned:{...(MY.shop||{}).owned,[cat+'_'+id]:Date.now()}};
    toast('🛒 Purchased! Ab Equip karo','success');beep();fireConfetti();
    render();
  }catch(e){toast('Purchase failed','error');}
}
async function equipShop(cat,id){
  try{
    await db.ref('users/'+MY.uid+'/shop/'+cat).set(id);
    MY.shop={...(MY.shop||{}),[cat]:id};
    toast('✨ Equipped!','success');beep();
    render();
  }catch(e){toast('Failed','error');}
}
async function unequipShop(cat){
  try{
    await db.ref('users/'+MY.uid+'/shop/'+cat).remove();
    if(MY.shop)delete MY.shop[cat];
    toast('Unequipped','info');
    render();
  }catch(e){}
}

  document.querySelectorAll('#cmt-list .fade-up').forEach(row=>{
    const img=row.querySelector('img');
    const m=(((img&&img.getAttribute('onclick'))||'').match(/openUserModal\('([^']+)'\)/));
    if(!m)return;
    const u=allUsers[m[1]]||{};
    const sp=u.shop||{};
    const b=row.querySelector('.glass b');
    if(!b)return;
    if(sp.colors==='rainbow')b.classList.add('rainbow-name');
    else if(sp.colors)b.style.color=sp.colors;
    if(sp.titles&&!b.querySelector('.shop-title')){
      const t=document.createElement('span');t.className='shop-title';t.textContent=sp.titles;
      b.appendChild(t);
    }
  });
}
const _sfRCM=renderChatMsgs;
renderChatMsgs=function(){_sfRCM();try{shopStyleChat();}catch(e){}};
const _sfCH=commentsHTML;
commentsHTML=function(){const h=_sfCH();setTimeout(()=>{try{shopStyleComments();}catch(e){}},0);return h;};
const _sfOUM=openUserModal;
openUserModal=function(uid){
  _sfOUM(uid);
  try{
    const u=(MY&&uid===MY.uid)?MY:(allUsers[uid]||{});
    const sp=(u&&u.shop)||{};
    const card=document.querySelector('#modal-root .modal-card');
    if(!card)return;
    if(sp.frames){const img=card.querySelector('img');if(img)img.classList.add('shopframe-'+sp.frames);}
    const h3=card.querySelector('h3');
    if(h3){
      if(sp.colors==='rainbow')h3.classList.add('rainbow-name');
      else if(sp.colors)h3.style.color=sp.colors;
      if(sp.titles&&!h3.querySelector('.shop-title')){const b=document.createElement('span');b.className='shop-title';b.textContent=sp.titles;h3.appendChild(b);}
    }
  }catch(e){}
};
/* 5d: Nav + router + home + drawer me Shop add */
const _sfNavItems=navItems;
navItems=function(){
  const a=_sfNavItems();const out=[];
  a.forEach(it=>{if(it.v!=='shop')out.push(it);if(it.v==='profile')out.push({v:'shop',ic:'shopping-bag',l:'XP Shop'});});
  return out;
};
const _sfPageHTML=pageHTML;
pageHTML=function(){if(view==='shop')return pageShop();return _sfPageHTML();};
const _sfHome=pageHome;
pageHome=function(){
  let h=_sfHome();
  try{
    h=h.replace('👥 Community</button>','👥 Community</button><button class="pill-btn" onclick="navTo(\'shop\')"><i data-lucide="shopping-bag" class="w-4 h-4"></i> XP Shop</button>');
  }catch(e){}
  return h;
};
const _sfDrawer=drawerHTML;
drawerHTML=function(){
  let h=_sfDrawer();
  try{
    const btns=[];
    if('Notification' in window){
      const muted=localStorage.getItem('basiler_pushmute')==='1';
      btns.push(`<button class="btn-ghost w-full py-2 text-[12px] font-bold mb-1.5" onclick="togglePushNotifs()">${muted?'🔕':'🔔'} Notifications ${muted?'OFF':'ON'}</button>`);
    }
    btns.push(`<button class="btn-ghost w-full py-2 text-[12px] font-bold mb-1.5" onclick="pwaInstall()">📲 Install App</button>`);
    btns.push(`<button class="btn-ghost w-full py-2 text-[12px] font-bold mb-1.5" onclick="closeDrawer();navTo('shop')">🛒 XP Shop</button>`);
    const idx=h.indexOf('onclick="doLogout()"');
    if(idx>0){
      const bIdx=h.lastIndexOf('<button',idx);
      h=h.slice(0,bIdx)+btns.join('')+h.slice(bIdx);
    }
  }catch(e){}
  return h;
};

/* ===== 6: startApp hook — push init + ek dafa permission ask ===== */
const _sfStartApp=startApp;
startApp=function(me){
  _sfStartApp(me);
  initPushListener();
  setTimeout(askPushOnce,2500);
};

/* ===== 7: Keyboard shortcut (Ctrl+K = search) ===== */
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(MY)openGSearch();}});

/* ===== 8: 🚀 BOOT — sab kuch start yahin se hota hai ===== */
(async()=>{
document.documentElement.style.setProperty('--bubble',bubbleColor);
lucide.createIcons();
applyDayNight();
try{const s=(await db.ref('meta/settings').once('value')).val()||{};SETTINGS={...SETTINGS,...s};applySettings(s);}catch(e){}
removeElonBattle();removeBotBattles();deleteDefaultBattles();
const h=location.hash.match(/#battle=(.+)/);
if(h){view='battle';viewParam=h[1];}
const sess=loadSession();
const impUid=isAdmin?localStorage.getItem('basiler_impersonate'):null;
if(impUid){try{const u=(await db.ref('users/'+impUid).once('value')).val();if(u){startApp({uid:impUid,...u});return;}}catch(e){}localStorage.removeItem('basiler_impersonate');}
if(sess&&sess.uid){try{const u=(await db.ref('users/'+sess.uid).once('value')).val();if(u){startApp({uid:sess.uid,...u});return;}if(sess.email){const acc=(await db.ref('accounts/'+emailKey(sess.email)).once('value')).val();if(acc&&acc.uid===sess.uid){await db.ref('users/'+sess.uid).set({name:acc.name,email:acc.email,avatar:acc.avatar||AVATAR_PRESETS[0],xp:0,createdAt:acc.createdAt||Date.now(),loginCount:1,lastLogin:Date.now(),timeSpent:0});startApp({uid:sess.uid,name:acc.name,avatar:acc.avatar||AVATAR_PRESETS[0],xp:0});return;}}}catch(e){}clearSession();}
showAuth();})();
</script>
