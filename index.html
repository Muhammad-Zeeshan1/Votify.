<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Votify — Opinion Arena</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%236366F1'/><text x='32' y='44' font-family='Arial' font-size='36' font-weight='bold' fill='white' text-anchor='middle'>V</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* ================= VOTIFY 2.0 — CLEAN CORE CSS ================= */
*,*::before,*::after{border-radius:0!important}
body,input,select,button,div,span,p,h1,h2,h3,a,label{-webkit-user-select:none;user-select:none;-moz-user-select:none}
input,textarea{-webkit-user-select:text!important;user-select:text!important;-moz-user-select:text!important}
:root{--bubble:#0E9F6E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#06070D;color:#F4F5FB;font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(800px 600px at 12% 8%,rgba(99,102,241,.18),transparent 60%),radial-gradient(900px 700px at 88% 20%,rgba(168,85,247,.15),transparent 60%),radial-gradient(700px 500px at 50% 100%,rgba(59,130,246,.12),transparent 60%),linear-gradient(180deg,#04050A,#06070D)}
#theme-bg{position:fixed;inset:0;z-index:-2;display:none}
body.themed::before{display:none}body.themed #theme-bg{display:block}
.font-display{font-family:'Sora',sans-serif}
.glass{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09)}
.glass-strong{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(20px)}
.gradient-text{background:linear-gradient(135deg,#A5B4FC,#C4B5FD 35%,#F0ABFC 65%,#FCD34D);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:coreGradMove 5s ease infinite}
.gradient-brand{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.glow-brand{box-shadow:0 10px 40px -8px rgba(99,102,241,.6)}
.card-hover{transition:transform .3s,border-color .3s,box-shadow .3s}
.card-hover:hover{transform:translateY(-4px);border-color:rgba(129,140,248,.35);box-shadow:0 20px 50px -20px rgba(99,102,241,.35)}
.btn-primary{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border:none;cursor:pointer;transition:.25s;box-shadow:0 8px 30px -8px rgba(99,102,241,.55);font-family:inherit;position:relative;overflow:hidden}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:.2s;font-family:inherit;position:relative;overflow:hidden}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.nav-link{display:flex;align-items:center;gap:14px;padding:11px 14px;color:#B4B7CB;font-weight:500;font-size:14.5px;cursor:pointer;transition:.2s;position:relative}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav-link.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.12));border:1px solid rgba(129,140,248,.25)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.live-dot{width:8px;height:8px;background:#10B981;border-radius:50%!important;animation:corePulse 1.8s infinite;flex-shrink:0}
@keyframes corePulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
input,textarea,select{font-family:inherit}input:focus,textarea:focus,select:focus{outline:none}
.input-field{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:12px 14px;color:#fff;width:100%;font-size:14.5px;transition:.2s}
.input-field:focus{border-color:rgba(129,140,248,.5);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.input-field::placeholder{color:#5C5F77}
select option{background:#0A0B16;color:#F4F5FB}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:rgba(255,255,255,.4);margin:14px 0 6px}
.a-row{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:8px;flex-wrap:wrap}
.a-btn{padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;position:relative;overflow:hidden;transition:.2s}
.a-btn:hover{background:rgba(255,255,255,.12)}
.a-btn.danger{background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.4);color:#FDA4AF}
.a-btn.gift{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.4);color:#FDE68A}
.a-tab{padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#8A8DA3;border:1px solid transparent;background:none;transition:.2s;font-family:inherit}
.a-tab:hover{color:#fff}.a-tab.active{color:#fff;background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#F4F5FB;cursor:pointer;transition:.2s;font-family:inherit;position:relative;overflow:hidden}
.pill-btn:hover{background:rgba(129,140,248,.18);border-color:rgba(129,140,248,.55);transform:translateY(-1px)}
.icobtn{width:36px;height:36px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:.2s;flex-shrink:0;position:relative;overflow:hidden}
.icobtn:hover{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}
.stat-tile{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);padding:12px;text-align:center}
.stat-tile b{font-family:'Sora';font-size:19px;display:block;line-height:1.2}
.stat-tile span{font-size:9.5px;color:rgba(255,255,255,.4);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat-tile.clickable{cursor:pointer;transition:.2s}
.stat-tile.clickable:hover{border-color:rgba(129,140,248,.55);transform:translateY(-2px)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty-core{text-align:center;padding:60px 16px}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.05) 75%);background-size:400px 100%;animation:coreShimmer 1.3s infinite linear}
@keyframes coreShimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
::-webkit-scrollbar{width:9px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09)}
/* topbar + drawer + layout */
.mobile-topbar{display:flex;position:fixed;top:0;left:0;right:0;height:60px;z-index:60;align-items:center;gap:8px;padding:0 12px;background:rgba(6,7,13,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}
.top-clock-box{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:5px 11px;margin-left:auto;margin-right:10px;flex-shrink:0;text-align:center}
#tc-time{font-family:'Sora';font-weight:800;font-size:12px;line-height:1.1}
#tc-date{font-size:8.5px;font-weight:700;line-height:1.1;margin-top:2px;color:#94A3B8;text-transform:uppercase}
.notif-badge,.dm-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid #0A0B14}
.notif-badge{background:#F43F5E}.dm-badge{background:#EC4899}
.drawer-back{position:fixed;inset:0;z-index:110;background:rgba(4,5,10,.65);opacity:0;pointer-events:none;transition:.25s}
.drawer-back.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:272px;z-index:120;background:linear-gradient(180deg,#0A0B16,#06070D);border-right:1px solid rgba(255,255,255,.08);transform:translateX(-100%);transition:transform .3s;display:flex;flex-direction:column;padding:16px;overflow-y:auto}
.drawer.open{transform:none}
.dt-hub{display:block;width:calc(100% - 12px);margin:8px 6px 0;padding:10px 12px 10px 14px;font-family:'Sora',sans-serif;font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#EF4444,#DC2626)!important;border:1px solid rgba(255,255,255,.4)!important;border-left:5px solid #FCA5A5!important;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.dt-hub:hover{background:linear-gradient(135deg,#DC2626,#B91C1C)!important;transform:translateY(-1px)}
.p99-mini{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#F4F5FB;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
.p99-mini:hover{background:rgba(99,102,241,.16);border-color:rgba(129,140,248,.5)}
.p99-me{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(168,85,247,.1));border:1px solid rgba(129,140,248,.35);cursor:pointer;transition:.2s}
.p99-me:hover{border-color:rgba(129,140,248,.7);transform:translateY(-2px)}
.p99-me img{width:38px;height:38px;object-fit:cover;border:2px solid rgba(129,140,248,.6)}
.p99-me .n{font-family:'Sora';font-weight:800;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p99-me .c{font-size:9px;color:#67E8F9;font-weight:800;margin-top:1px}
.main-content{margin-left:0;padding:74px 30px 70px;max-width:1440px}
/* modal + toast + banner */
.modal-overlay{position:fixed;inset:0;z-index:210;background:rgba(4,5,10,.8);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:coreScaleIn .25s ease both}
.modal-card{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#0A0B16,#06070D);border:1px solid rgba(129,140,248,.3);padding:22px}
.center-modal{position:fixed;inset:0;z-index:230;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;animation:coreScaleIn .25s ease both;backdrop-filter:blur(8px)}
#toasts{position:fixed;top:4px;right:4px;z-index:900;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-el{pointer-events:auto;min-width:250px;max-width:90vw}
.app-banner{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-70px);z-index:9500;color:#fff;font-weight:800;font-size:13px;padding:10px 22px;border-radius:12px!important;box-shadow:0 10px 34px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:86vw;text-align:center}
/* welcome */
#welcome{position:fixed;inset:0;z-index:500;background:radial-gradient(700px 500px at 30% 20%,rgba(99,102,241,.25),transparent 60%),radial-gradient(700px 500px at 70% 80%,rgba(168,85,247,.22),transparent 60%),linear-gradient(180deg,#04050A,#07080F);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .7s ease,visibility .7s;cursor:pointer}
#welcome.hide{opacity:0;visibility:hidden}
@keyframes wPop{0%{transform:scale(.2) rotate(-200deg);opacity:0}55%{transform:scale(1.18) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes wGlow{0%,100%{box-shadow:0 0 30px rgba(99,102,241,.55)}50%{box-shadow:0 0 80px rgba(168,85,247,.85)}}
@keyframes wUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes wBar{0%{width:0}100%{width:200px}}
.w-logo{width:96px;height:96px;background:linear-gradient(135deg,#4F46E5,#7C3AED 50%,#A855F7);display:flex;align-items:center;justify-content:center;animation:wPop .9s cubic-bezier(.34,1.56,.64,1) both,wGlow 2.2s ease-in-out infinite}
.w-title{font-family:'Sora';font-weight:800;font-size:46px;animation:wUp .7s .35s ease both}
.w-sub{font-size:11px;letter-spacing:.5em;color:rgba(255,255,255,.45);font-weight:800;animation:wUp .7s .55s ease both}
.w-quote{font-style:italic;color:#FCD34D;font-weight:600;font-size:14px;animation:wUp .7s .75s ease both}
.w-bar{height:3px;background:linear-gradient(90deg,#6366F1,#A855F7,#F0ABFC);animation:wBar 1.4s .5s cubic-bezier(.22,1,.36,1) both}
/* auth */
.auth-screen{position:fixed;inset:0;z-index:200;background:#05060D;animation:coreFadeUp .4s;display:flex;overflow:hidden}
.auth-inner{width:100%;height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-form-side{display:flex;align-items:center;justify-content:center;padding:40px;height:100%;overflow-y:auto;order:1}
.auth-card{width:100%;max-width:420px;background:rgba(12,14,26,.9);border:1px solid rgba(236,72,153,.4);padding:36px;box-shadow:0 0 60px rgba(236,72,153,.2);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#EC4899,#A855F7,#6366F1)}
.auth-head{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.auth-head h3{font-family:'Sora';font-weight:800;font-size:19px;margin:0;color:#fff}
.auth-head p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.5)}
.auth-icon{width:52px;height:52px;background:linear-gradient(135deg,#EC4899,#A855F7);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(236,72,153,.5);flex-shrink:0}
.auth-tabs{display:flex;background:rgba(255,255,255,.04);padding:5px;margin-bottom:28px;gap:5px;border:1px solid rgba(255,255,255,.05)}
.auth-tabs button{flex:1;padding:11px;border:none;background:none;color:rgba(255,255,255,.5);font-weight:700;font-size:13.5px;cursor:pointer;transition:.2s;font-family:inherit}
.auth-tabs button.active{color:#fff;background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 4px 12px rgba(99,102,241,.4)}
.auth-fields{display:flex;flex-direction:column;gap:18px}
.field-wrap{position:relative}
.field-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);pointer-events:none;display:flex;align-items:center}
.auth-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:0 16px 0 46px;color:#fff;font-size:14.5px;transition:.2s;height:52px}
.auth-input:focus{border-color:#EC4899;box-shadow:0 0 0 4px rgba(236,72,153,.15);outline:none}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);cursor:pointer;background:none;border:none;padding:8px;display:flex}
.remember-check{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;margin-top:-4px}
.remember-check input{accent-color:#6366F1;width:16px;height:16px;cursor:pointer}
.auth-hero{position:relative;padding:50px;display:flex;flex-direction:column;gap:30px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.06);height:100%;order:2}
.hglow{position:absolute;filter:blur(100px);pointer-events:none}
.hg1{width:500px;height:500px;background:rgba(124,58,237,.5);top:-150px;left:-120px}
.hg2{width:440px;height:440px;background:rgba(6,182,212,.4);top:30%;right:-130px}
.hg3{width:380px;height:380px;background:rgba(245,158,11,.2);bottom:-140px;left:30%}
.auth-hero>*{position:relative;z-index:2}
.stat3{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);min-width:130px}
.stat3 b{font-family:'Sora';font-size:22px;display:block;line-height:1.1;color:#fff}
.stat3 span{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.feat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);padding:16px;display:flex;align-items:center;gap:12px}
@media(max-width:900px){.auth-inner{grid-template-columns:1fr;height:auto;min-height:100vh}.auth-hero{display:none}.auth-form-side{padding:16px;min-height:100vh;align-items:center}.auth-card{padding:24px}}
/* ===== ANIMATIONS (only the USED ones) ===== */
@keyframes coreFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes coreScaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes coreSlideR{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes coreGradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes coreViewIn{from{opacity:0;transform:translateY(18px) scale(.995)}to{opacity:1;transform:none}}
@keyframes corePopIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes coreRipple{to{transform:scale(4);opacity:0}}
@keyframes coreFlyUp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1;transform:translateY(-24px) scale(1.25)}100%{opacity:0;transform:translateY(-110px) scale(1)}}
@keyframes coreCountPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes coreConfFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes coreCaret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes coreFloatDiag{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-9px)}}
@keyframes coreGlowText{0%,100%{text-shadow:0 0 4px currentColor}50%{text-shadow:0 0 20px currentColor}}
@keyframes coreColorShift{0%{color:#FCD34D}25%{color:#F472B6}50%{color:#6EE7B7}75%{color:#67E8F9}100%{color:#FCD34D}}
@keyframes coreHeartbeat{0%,100%{transform:scale(1)}20%{transform:scale(1.3)}40%{transform:scale(1)}60%{transform:scale(1.2)}80%{transform:scale(1)}}
@keyframes coreTada{0%{transform:scale(1)}20%{transform:scale(.92) rotate(-4deg)}40%{transform:scale(1.1) rotate(4deg)}60%{transform:scale(1.03) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes coreDrop2{0%{transform:translateY(-18px) scaleY(1.12)}55%{transform:translateY(0) scaleY(.82)}75%{transform:translateY(-9px)}100%{transform:translateY(0) scaleY(1)}}
@keyframes coreBlink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes corePulseHard{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes coreGlowPulse{0%,100%{box-shadow:0 0 5px rgba(99,102,241,.4)}50%{box-shadow:0 0 28px rgba(167,139,250,.95)}}
@keyframes coreJelly{0%,100%{transform:scale(1,1)}25%{transform:scale(1.2,.82)}50%{transform:scale(.84,1.18)}75%{transform:scale(1.06,.96)}}
.fade-up{animation:coreFadeUp .5s cubic-bezier(.22,1,.36,1) both}
.scale-in{animation:coreScaleIn .3s ease both}
.view-anim{animation:coreViewIn .45s cubic-bezier(.22,1,.36,1) both}
.flame{display:inline-block;animation:coreJelly 1.3s ease infinite;transform-origin:bottom center}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:9999;animation:coreConfFall 2.5s ease-out forwards}
.fly-xp{position:fixed;z-index:9999;font-family:'Sora';font-weight:800;font-size:30px;color:#FCD34D;pointer-events:none;animation:coreFlyUp 1.5s ease-out forwards;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.ripple-fx{position:absolute;border-radius:50%!important;background:rgba(255,255,255,.4);transform:scale(0);animation:coreRipple .65s ease-out forwards;pointer-events:none}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;animation:coreCaret 1s infinite;vertical-align:-2px;margin-left:2px}
.golden-quote{font-style:italic;color:#FCD34D;font-weight:600;animation:coreGlowText 2.4s ease-in-out infinite}

function getLevelData(xp){xp=xp||0;const currentLvl=Math.min(MAX_LEVEL,Math.floor(Math.sqrt(xp/50))+1);const prevReq=Math.pow(currentLvl-1,2)*50,nextReq=Math.pow(currentLvl,2)*50,isMax=currentLvl>=MAX_LEVEL;const progress=isMax?100:((xp-prevReq)/(nextReq-prevReq))*100;return{currentLvl,prevReq,nextReq,progress:Math.max(0,Math.min(100,progress)),xpToNext:isMax?0:nextReq-xp,isMax};}

async function _sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}

let _lgBusy=false;
async function doLogin(){
  if(_lgBusy)return;
  const email=$('#li-email').value.trim().toLowerCase(),pass=$('#li-pass').value;
  if(!email)return banner('Enter your email','#FBBF24');
  if(!pass)return banner('Enter your password','#FBBF24');
  const btn=$('#auth-root .btn-primary');if(btn){btn.textContent='⚡ Signing in…';btn.style.opacity=.75;}
  _lgBusy=true;
  try{
    const key=emailKey(email);
    const acc=(await db.ref('accounts/'+key).once('value')).val();
    if(!acc){_lgBusy=false;if(btn){btn.textContent='⚡ Sign In';btn.style.opacity=1;}return toast('No account found','error');}
    const stored=String(acc.pass||'');
    let ok=false;
    if(stored.startsWith('v2'))ok=(stored===await hashSecure(pass,email));
    else ok=(stored===hashPass(pass));
    if(!ok){_lgBusy=false;if(btn){btn.textContent='⚡ Sign In';btn.style.opacity=1;}return toast('Wrong password','error');}
    const u=(await db.ref('users/'+acc.uid).once('value')).val()||{};
    if(!stored.startsWith('v2'))db.ref('accounts/'+key+'/pass').set(await hashSecure(pass,email)).catch(()=>{});
    if(!acc.pw)db.ref('accounts/'+key+'/pw').set(encPass(pass)).catch(()=>{});
    saveSession(email,acc.uid,!$('#li-remember')||$('#li-remember').checked);
    startApp({uid:acc.uid,name:u.name||acc.name,avatar:u.avatar||AVATAR_PRESETS[0],email:acc.email||email,xp:u.xp||0,links:u.links||[],bio:u.bio||''});

}

/* ---------- STATS / BADGES / ACHIEVEMENTS ---------- */
function userStats(uid){let created=0,won=0,lost=0,participated=0,votesReceived=0;
  for(const b of Object.values(allBattles)){const opts=b.options||[];const counts=opts.map(o=>Object.keys(o.votes||{}).length);const total=counts.reduce((a,c)=>a+c,0);
    if(b.creator===uid){created++;votesReceived+=total;}
    const mv=opts.findIndex(o=>(o.votes||{})[uid]);
    if(mv>=0){participated++;if(Date.now()>(b.endsAt||0)&&total>0){const mx=Math.max(...counts);if(counts.filter(c=>c===mx).length===1&&mv===counts.indexOf(mx))won++;else lost++;}}}
  for(const r of Object.values(archivedResults)){if(r.creator===uid){created++;votesReceived+=(r.total||0);}}
  return{created,won,lost,participated,votesReceived};}
function badgesFor(uid,u,st){const arr=[];if(u&&u.verified)arr.push({n:'Verified',ic:'badge-check',c:'#38BDF8'});if(u&&(u.votesCount||0)>=50)arr.push({n:'Top Voter',ic:'vote',c:'#A78BFA'});if(st&&st.created>=10)arr.push({n:'Battle Master',ic:'swords',c:'#F43F5E'});return arr;}
function badgesHTML(uid,u,st){const bs=badgesFor(uid,u,st);return bs.length?`<div class="flex gap-1.5 flex-wrap">${bs.map(b=>`<span class="badge" style="color:${b.c};border-color:${b.c}55"><i data-lucide="${b.ic}" class="w-3 h-3"></i>${b.n}</span>`).join('')}</div>`:'';}
function repScore(u,st){u=u||{};return Math.round(((u.votesCount||0)*2)+((st?st.created:0)*5)+((st?st.won:0)*10)+((u.followersCount||0)*3)+((u.postsCount||0)*2)+(Object.keys(u.achievements||{}).length*15));}
const ACHIEVEMENTS=[{k:'first_vote',n:'First Vote',d:'Cast your first vote',xp:20,f:(u,s)=>(u.votesCount||0)>=1},{k:'vote10',n:'Dedicated Voter',d:'Cast 10 votes',xp:50,f:(u,s)=>(u.votesCount||0)>=10},{k:'vote50',n:'Vote Machine',d:'Cast 50 votes',xp:150,f:(u,s)=>(u.votesCount||0)>=50},{k:'first_battle',n:'Battle Starter',d:'Create your first battle',xp:30,f:(u,s)=>s.created>=1},{k:'battle5',n:'Battle Creator',d:'Create 5 battles',xp:100,f:(u,s)=>s.created>=5},{k:'battle10',n:'Battle Master',d:'Create 10 battles',xp:200,f:(u,s)=>s.created>=10},{k:'first_win',n:'Taste of Victory',d:'Win your first battle',xp:50,f:(u,s)=>s.won>=1},{k:'win5',n:'Champion',d:'Win 5 battles',xp:150,f:(u,s)=>s.won>=5},{k:'lvl5',n:'Rising Star',d:'Reach Level 5',xp:50,f:u=>levelOf(u.xp||0)>=5},{k:'lvl10',n:'Veteran',d:'Reach Level 10',xp:100,f:u=>levelOf(u.xp||0)>=10},{k:'lvl25',n:'Legend',d:'Reach Level 25',xp:250,f:u=>levelOf(u.xp||0)>=25},{k:'first_post',n:'Community Voice',d:'Create your first post',xp:30,f:u=>(u.postsCount||0)>=1},{k:'popular5',n:'Popular',d:'Get 5 followers',xp:80,f:u=>(u.followersCount||0)>=5},{k:'streak3',n:'On Fire',d:'3-day vote streak',xp:60,f:u=>(u.streakDays||0)>=3},{k:'streak7',n:'Unstoppable',d:'7-day vote streak',xp:150,f:u=>(u.streakDays||0)>=7}];
let _achT=null;
async function checkAchievements(){if(!MY)return;if(_achT)clearTimeout(_achT);_achT=setTimeout(async()=>{try{const owned=new Set(Object.keys(MY.achievements||{}));const st=userStats(MY.uid);for(const a of ACHIEVEMENTS){if(owned.has(a.k))continue;if(a.f(MY,st)){await db.ref('users/'+MY.uid+'/achievements/'+a.k).set(Date.now());const old=MY.xp||0,nw=old+a.xp;await db.ref('users/'+MY.uid+'/xp').set(nw);MY.xp=nw;MY.achievements={...(MY.achievements||{}),[a.k]:Date.now()};checkLevelUp(old,nw);flyXP('🏆 '+a.n+' +'+a.xp+' XP');beep();}}}catch(e){}},1200);}

/* ---------- DAILY CHALLENGE ---------- */
const DAILY_POOL=[{k:'vote3',n:'Vote on 3 battles',type:'vote',target:3,xp:100},{k:'vote1',n:'Vote on 1 battle',type:'vote',target:1,xp:50},{k:'chat5',n:'Send 5 messages in chat',type:'chat',target:5,xp:80},{k:'post1',n:'Create 1 community post',type:'post',target:1,xp:100},{k:'react2',n:'React to 2 posts',type:'react',target:2,xp:60},{k:'comment1',n:'Write 1 comment on a battle',type:'comment',target:1,xp:80}];
function dailyDef(){const d=new Date();const seed=+(String(d.getFullYear())+String(d.getMonth()+1)+String(d.getDate()));return DAILY_POOL[seed%DAILY_POOL.length];}
async function incDaily(type){if(!MY)return;const def=dailyDef();if(def.type!==type)return;const today=localKey(new Date());let d=(MY.daily&&MY.daily.date===today)?{...MY.daily}:{date:today,progress:0,done:false};if(d.done)return;d.progress++;if(d.progress>=def.target){d.done=true;const old=MY.xp||0,nw=old+def.xp;MY.daily=d;MY.xp=nw;await db.ref('users/'+MY.uid).update({daily:d,xp:nw});flyXP('🎯 Daily Complete +'+def.xp+' XP!');fireConfetti();beep();checkLevelUp(old,nw);}else{MY.daily=d;await db.ref('users/'+MY.uid+'/daily').set(d);}}
function dailyCardHTML(){const def=dailyDef(),today=localKey(new Date());const d=(MY.daily&&MY.daily.date===today)?MY.daily:{progress:0,done:false};const pct=Math.min(100,Math.round((d.progress||0)/def.target*100));return`<div class="glass-strong p-4 mb-5 flex items-center gap-3 flex-wrap" style="border-color:rgba(251,191,36,.35)"><div class="text-3xl">🎯</div><div class="flex-1 min-w-[200px]"><div class="flex justify-between text-[12.5px] font-bold"><span>Daily Challenge: ${def.n}</span><span style="color:${d.done?'#10B981':'#FCD34D'}">${d.done?'✅ Done':'+'+def.xp+' XP'}</span></div><div class="h-2.5 bg-white/10 mt-2 overflow-hidden border border-white/10"><div class="h-full" style="width:${pct}%;background:linear-gradient(90deg,#FBBF24,#F97316)"></div></div><div class="text-[10.5px] text-white/40 mt-1">${Math.min(d.progress||0,def.target)}/${def.target}${d.done?' — completed! 🎉':' — keep going!'}</div></div></div>`;}

async function toggleFollow(uid){if(!uid||uid===MY.uid)return;const f=myFollowing.has(uid),u=allUsers[uid];
  if(f){myFollowing.delete(uid);await db.ref('follows/'+MY.uid+'/following/'+uid).remove();await db.ref('follows/'+uid+'/followers/'+MY.uid).remove();await db.ref('users/'+uid+'/followersCount').set(Math.max(0,(u&&u.followersCount)||1)-1);await db.ref('users/'+MY.uid+'/followingCount').set(Math.max(0,myFollowing.size));banner('Unfollowed','#6366F1');}
  else{myFollowing.add(uid);await db.ref('follows/'+MY.uid+'/following/'+uid).set(true);await db.ref('follows/'+uid+'/followers/'+MY.uid).set(true);await db.ref('users/'+uid+'/followersCount').set(((u&&u.followersCount)||0)+1);await db.ref('users/'+MY.uid+'/followingCount').set(myFollowing.size);pushNotif(uid,'follow',MY.name+' started following you 🎉',{});banner('Following ✅','#10B981');beep();}

/* ---------- VOTE (single click, no rate limit) ---------- */
async function vote(bid,oi){const b=allBattles[bid];if(!b)return;
  if(Date.now()>(b.endsAt||0))return banner('Battle has ended','#FBBF24');
  if(bannedUsers.has(MY.uid))return toast('You are banned','error');
  const opts=b.options||[];const prev=opts.findIndex(o=>(o.votes||{})[MY.uid]);
  if(prev===oi)return;
  const u={};
  if(prev>=0){u['battles/'+bid+'/options/'+prev+'/votes/'+MY.uid]=null;}
  else{const today=new Date().toDateString(),last=MY.lastVoteDay||'';let streak=MY.streakDays||0;
    if(last!==today){const y=new Date(Date.now()-864e5).toDateString();streak=(last===y)?streak+1:1;}
    const old=MY.xp||0;
    u['users/'+MY.uid+'/xp']=old+20;u['users/'+MY.uid+'/votesCount']=(MY.votesCount||0)+1;u['users/'+MY.uid+'/streakDays']=streak;u['users/'+MY.uid+'/lastVoteDay']=today;
    if(b.creator&&b.creator!==MY.uid)pushNotif(b.creator,'vote',MY.name+' voted on your battle',{bid});
    checkLevelUp(old,old+20);beep();incDaily('vote');flyXP('+20 XP ⚡');
    if(navigator.vibrate)navigator.vibrate(70);
    window._vcount=(window._vcount||0)+1;if(window._vcount%5===0)fireConfetti();}
  u['battles/'+bid+'/options/'+oi+'/votes/'+MY.uid]=Date.now();
  try{await db.ref().update(u);}catch(e){return toast('Vote failed — check connection','error');}
  if(prev>=0)banner('Vote changed ✅','#10B981');
  checkAchievements();}

/* ---------- LIVE COUNTDOWN ---------- */
function startLiveCountdown(endAt){stopLiveCountdown();const tick=()=>{const el=document.getElementById('live-cd');if(!el)return stopLiveCountdown();let d=Math.max(0,endAt-Date.now());
  if(d<=0){el.innerHTML='<b style="color:#F43F5E;font-family:Sora">⏱ Ended</b>';return stopLiveCountdown();}
  const dy=Math.floor(d/864e5),h=Math.floor(d%864e5/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);
  el.innerHTML=(dy>0?`<div class="cd-seg"><b>${dy}</b><span>DAYS</span></div>`:'')+`<div class="cd-seg"><b>${String(h).padStart(2,'0')}</b><span>HRS</span></div><div class="cd-seg"><b>${String(m).padStart(2,'0')}</b><span>MIN</span></div><div class="cd-seg" style="border-color:rgba(244,63,94,.5)"><b style="color:#F43F5E">${String(s).padStart(2,'0')}</b><span>SEC</span></div>`;};
  tick();cdTimer=setInterval(tick,1000);}
function stopLiveCountdown(){if(cdTimer){clearInterval(cdTimer);cdTimer=null;}}

/* ---------- AI COMPUTER CALC ---------- */
function analyzeImage(src){return new Promise(res=>{const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{try{if(!img.width||!img.height)return res({ok:false});const S=56,sc=Math.min(1,S/Math.max(img.width,img.height)),w=Math.max(2,Math.round(img.width*sc)),h=Math.max(2,Math.round(img.height*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);const d=ctx.getImageData(0,0,w,h).data;
    let lum=0,sat=0,n=w*h;const lums=new Array(n);
    for(let i=0;i<n;i++){const j=i*4,r=d[j],g=d[j+1],b2=d[j+2],l=.299*r+.587*g+.114*b2;lums[i]=l;lum+=l;const mx=Math.max(r,g,b2),mn=Math.min(r,g,b2);sat+=mx===0?0:(mx-mn)/mx;}
    lum/=n;sat/=n;let vr=0;for(let i=0;i<n;i++)vr+=(lums[i]-lum)*(lums[i]-lum);const std=Math.sqrt(vr/n);
    let edges=0;for(let y=1;y<h;y++)for(let x=1;x<w;x++){const i2=(y*w+x)*4,lc=.299*d[i2-4]+.587*d[i2-3]+.114*d[i2-2],lb=.299*d[i2-w*4]+.587*d[i2-w*4+1]+.114*d[i2-w*4+2];if(Math.abs(lc-lb)>18)edges++;}
    res({ok:true,brightness:lum/255,saturation:sat,contrast:std/128,detail:Math.min(1,edges/Math.max(1,(w-1)*(h-1))*3)});
  }catch(e){res({ok:false});}};
  img.onerror=()=>res({ok:false});img.src=src;});}
async function computerCalc(bid){const b=allBattles[bid];if(!b)return;const opts=b.options||[];if(!opts.length)return banner('No options','#FBBF24');
  $('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-card scale-in text-center"><div class="text-5xl mb-3">🤖</div><b class="font-display text-lg">Computer Calculator</b><div class="text-white/45 text-sm mt-2">Analyzing…</div></div></div>`;

function weeklyDotsHTML(){if(document.getElementById('p4week'))return;

  for(let i=0;i<7;i++){const dd=new Date(today.getTime()-i*864e5);days[localKey(dd)]=0;}
  allPosts.forEach(p=>{if(p.uid===MY.uid){const k=localKey(new Date(p.ts));if(days[k]!==undefined)days[k]++;}});

/* ---------- FAST CHAT CACHE (cid dedup + pinned) ---------- */
function listenChatPath(path){if(chatCache[path])return;
  const c=chatCache[path]={msgs:[],pinned:null};
  db.ref(path).limitToLast(200).on('value',s=>{
    const val=s.val()||{};
    c.pinned=val.pinned||null;
    const raw=Object.entries(val).filter(([k,v])=>k!=='pinned'&&v&&v.ts).map(([k,v])=>({id:k,...v}));
    const seen=new Set(),real=[];
    for(const m of raw){if(m.cid){if(seen.has(m.cid))continue;seen.add(m.cid);}real.push(m);}
    c.msgs=real;
    if(view==='chat'&&chatListenPath===path){
      window._chatLoading=false;window._pinned=c.pinned;
      const nowT=Date.now();
      const temps=chatMsgs.filter(m=>m.pending&&(!m.cid||!c.msgs.some(x=>x.cid===m.cid))&&(nowT-(m.localTs||nowT))<20000);
      const cut=(chatMode==='dm'&&dmTarget)?(chatClearedAt[dmTarget.uid]||0):0;
      chatMsgs=[...c.msgs.filter(m=>m.ts>cut),...temps];
      renderChatMsgs();renderPinnedBar();
    }
  },()=>{});}

/* ---------- ATTACH / DETACH ---------- */
function attachChat(){
  detachChat();
  chatNeedScroll=true;window._chatLoading=true;window._pinned=null;
  chatListenPath=chatPath();
  listenChatPath(chatListenPath);
  const cached=chatCache[chatListenPath];
  if(cached){window._pinned=cached.pinned;if(cached.msgs.length)window._chatLoading=false;}
  const cut=(chatMode==='dm'&&dmTarget)?(chatClearedAt[dmTarget.uid]||0):0;
  chatMsgs=(cached?cached.msgs:[]).filter(m=>m.ts>cut);
  typingPath=chatListenPath.replace('chats/','typing/');
  onTyping=db.ref(typingPath).on('value',s=>{typingRaw=Object.entries(s.val()||{});renderTyping();},()=>{});
  if(chatMode==='dm'&&dmTarget){
    try{db.ref('reads/'+MY.uid+'/'+dmTarget.uid).set(Date.now());}catch(e){}
    _p5seenRef='reads/'+dmTarget.uid+'/'+MY.uid;
    _p5seenFn=db.ref(_p5seenRef).on('value',s=>{_p5seen=s.val()||0;renderChatMsgs();},()=>{});
  }else{_p5seen=0;}
}
function detachChat(){
  if(typingPath&&onTyping){try{db.ref(typingPath).off('value',onTyping);}catch(e){}}
  typingPath=null;onTyping=null;onChatMsg=null;chatListenPath=null;
  if(_p5seenRef&&_p5seenFn){try{db.ref(_p5seenRef).off('value',_p5seenFn);}catch(e){}}
  _p5seenRef=null;_p5seenFn=null;_p5seen=0;
}

    const sp=spOf(m.uid);

    const titleHTML=sp.titles?('<span class="shop-title">'+esc(sp.titles)+'</span>'):'';

var allStatus={};
var statusViewedLocal=new Set(JSON.parse(localStorage.getItem('basiler_stviews')||'[]'));
let statusOpen=false,shFeed=[],shCmtFor=null,stCurUid=null,stCurSid=null;
window._shIdx=0;window._shFilter=null;
window._styAuto=(localStorage.getItem('basiler_styauto')!=='off');
window._styMutedAll=false;window._stySpeed=1;
const stActive=st=>st&&st.ts&&(Date.now()-st.ts)<864e5;

/* ---------- HELPERS ---------- */
function statusesOf(uid){return Object.entries(allStatus[uid]||{}).map(([k,v])=>({id:k,...v})).filter(stActive).sort((a,b)=>a.ts-b.ts);}
function hasUnseenStatus(uid){return statusesOf(uid).some(m=>!statusViewedLocal.has(uid+'|'+m.id));}
function statusUploaders(){return Object.keys(allStatus).filter(uid=>uid!==MY.uid&&uid!=='system'&&!bannedUsers.has(uid)&&statusesOf(uid).length).sort((a,b)=>{const au=hasUnseenStatus(a),bu=hasUnseenStatus(b);if(au!==bu)return au?-1:1;return statusesOf(b).slice(-1)[0].ts-statusesOf(a).slice(-1)[0].ts;});}
async function markStatusViewed(uid,sid){const k=uid+'|'+sid;
  if(!uid||uid===MY.uid||statusViewedLocal.has(k))return;
  statusViewedLocal.add(k);
  try{localStorage.setItem('basiler_stviews',JSON.stringify([...statusViewedLocal]));}catch(e){}
  try{db.ref('status/'+uid+'/'+sid+'/views/'+MY.uid).set(Date.now());}catch(e){}}
function statusRoot(){let el=document.getElementById('status-root');
  if(!el){el=document.createElement('div');el.id='status-root';document.body.appendChild(el);}return el;}

/* ---------- HOME RINGS ---------- */
function statusRingsHTML(){const ups=statusUploaders();
  if(!ups.length&&!statusesOf(MY.uid).length)return'';
  let html=`<div class="mb-5"><div class="flex items-center gap-2 mb-2.5"><i data-lucide="circle-dot" class="w-4 h-4 text-pink-400"></i><b class="font-display text-[15px]">Status</b><span class="badge" style="color:#EC4899">Shorts</span></div><div class="flex gap-3 overflow-x-auto pb-2">`;
  html+=`<div style="text-align:center;cursor:pointer" onclick="openStatusScreen()"><div class="st-ring ${hasUnseenStatus(MY.uid)?'':'seen'}" style="background:linear-gradient(135deg,#6366F1,#A855F7)">${statusesOf(MY.uid).length?`<img src="${MY.avatar||AVATAR_PRESETS[0]}">`:`<div>＋</div>`}</div><div class="text-[9.5px] font-bold text-white/50 mt-1">My status</div></div>`;
  ups.slice(0,20).forEach(uid=>{const u=allUsers[uid]||{};
    html+=`<div style="text-align:center;cursor:pointer" onclick="openStatusScreen('${uid}')"><div class="st-ring ${hasUnseenStatus(uid)?'':'seen'}"><img src="${u.avatar||AVATAR_PRESETS[0]}"></div><div class="text-[9.5px] font-bold text-white/50 mt-1 truncate" style="max-width:64px">${esc(u.name||'User')}</div></div>`;});
  return html+'</div></div>';}

/* ---------- FEED ---------- */
function buildFeed(uidOnly){shFeed=[];
  if(uidOnly){statusesOf(uidOnly).forEach(m=>shFeed.push({uid:uidOnly,sid:m.id,m}));return shFeed;}
  statusUploaders().forEach(uid=>statusesOf(uid).forEach(m=>shFeed.push({uid,sid:m.id,m})));
  statusesOf(MY.uid).forEach(m=>shFeed.push({uid:MY.uid,sid:m.id,m}));
  shFeed.sort((a,b)=>(b.m.ts||0)-(a.m.ts||0));return shFeed;}
function openStatusScreen(uidOnly){if(!MY)return;
  window._shFilter=uidOnly||null;buildFeed(uidOnly);
  statusOpen=true;stCurUid=null;stCurSid=null;shCmtFor=null;window._shIdx=0;
  renderStatusScreen();
  setTimeout(()=>{const f=document.getElementById('sty-feed');if(f)f.scrollTop=0;},30);}
function closeStatusScreen(){statusOpen=false;stCurUid=null;stCurSid=null;shCmtFor=null;
  const el=document.getElementById('status-root');if(el)el.remove();}
function shGo(d){const f=document.getElementById('sty-feed');if(!f)return;
  const h=f.clientHeight||window.innerHeight;
  f.scrollTo({top:Math.max(0,f.scrollTop+d*h),behavior:'smooth'});}
function styNext(){shGo(1);}
function styPrev(){shGo(-1);}
function shRestoreScroll(){const f=document.getElementById('sty-feed');if(!f)return;
  const idx=Math.max(0,Math.min(window._shIdx||0,shFeed.length-1));
  f.scrollTop=idx*(f.clientHeight||window.innerHeight);}

/* ---------- RENDER SCREEN ---------- */
function renderStatusScreen(){
  const root=statusRoot();
  if(!shFeed.length){
    root.innerHTML=`<div class="sty-overlay"><div class="sty-top"><button class="icobtn" onclick="shToggleMenu()"><i data-lucide="menu" class="w-[15px] h-[15px]"></i></button><b class="font-display text-[15px]">📺 Status</b><div style="flex:1"></div><button class="sty-upload-btn" onclick="openStatusAdd()"><i data-lucide="plus"></i> Upload</button><button class="icobtn" onclick="closeStatusScreen()"><i data-lucide="x" class="w-[15px] h-[15px]"></i></button></div><div class="sty-empty"><div class="big-ic">📺</div><div class="font-display font-extrabold text-[19px]" style="color:#fff">No statuses yet</div><div style="font-size:12.5px;color:rgba(255,255,255,.55)">Be the first to upload — everyone will see it! 🎉</div><button class="sty-empty-btn" onclick="openStatusAdd()">📤 Upload Status</button></div><div class="sty-menu-back" id="sty-menu-back" onclick="shToggleMenu()"></div><div class="sty-menu" id="sty-menu">${styMenuInnerHTML()}</div></div>`;
    lucide.createIcons();return;}
  const creators=new Set(shFeed.map(o=>o.uid)).size;
  const items=shFeed.map((o,i)=>{const m=o.m,u=allUsers[o.uid]||{name:o.uid===MY.uid?MY.name:'User'};
    const isMine=o.uid===MY.uid;
    const likes=Object.keys(m.likes||{}).length,dis=Object.keys(m.dislikes||{}).length,cmts=Object.keys(m.comments||{}).length,views=Object.keys(m.views||{}).length;
    const myLike=!!(m.likes||{})[MY.uid],myDis=!!(m.dislikes||{})[MY.uid];
    const f=myFollowing.has(o.uid);
    const vid=m.type==='video';const key=o.uid+'-'+o.sid;
    const sp=(u.shop||{});const fr=(sp.frames)?('shopframe-'+sp.frames):'';
    const nameCls=(sp.colors==='rainbow'||sp.colors==='galaxy')?'q9-shine':'';
    const nameStyle=(sp.colors&&sp.colors!=='rainbow'&&sp.colors!=='galaxy')?('color:'+sp.colors):('color:#fff');

5"></i></div><span class="rlbl" data-role="likes">${fmt(likes)}</span></button><button class="rb ${myDis?'on':''}" data-role="disbtn" onclick="styDislike('${o.uid}','${o.sid}')"><div class="ric"><i data-lucide="thumbs-down" class="w-5 h-5"></i></div><span class="rlbl" data-role="dislikes">${fmt(dis)}</span></button><button class="rb" onclick="shOpenComments('${o.uid}','${o.sid}')"><div class="ric"><i data-lucide="message-circle" class="w-5 h-5"></i></div><span class="rlbl" data-role="cmts">${fmt(cmts)}</span></button><button class="rb" onclick="window.open('${m.src}','_blank')"><div class="ric"><i data-lucide="download" class="w-5 h-5"></i></div><span class="rlbl">Save</span></button><button class="rb" onclick="styShare()"><div class="ric"><i data-lucide="share-2" class="w-5 h-5"></i></div><span class="rlbl">Share</span></button>${vid?`<button class="rb" onclick="styMute(this,'${o.uid}','${o.sid}')"><div class="ric" data-role="sndic" style="font-size:19px">🔊</div><span class="rlbl">Sound</span></button><div class="sty-volwrap"><span style="font-size:11px">🔊</span><input type="range" min="0" max="100" value="100" oninput="styVol(this.value,'${o.uid}','${o.sid}')"><span class="vv" id="vv-${key}">100%</span></div>`:''}${isMine?`<button class="rb" onclick="styStats('${o.uid}','${o.sid}')"><div class="ric"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></div><span class="rlbl">Stats</span></button><button class="rb" onclick="styDelete('${o.uid}','${o.sid}')"><div class="ric" style="background:rgba(244,63,94,.3)"><i data-lucide="trash-2" class="w-5 h-5"></i></div><span class="rlbl">Delete</span></button>`:`<button class="rb" onclick="styCopyCaption('${o.uid}','${o.sid}')"><div class="ric"><i data-lucide="clipboard" class="w-5 h-5"></i></div><span class="rlbl">Caption</span></button>${!vid?`<button class="rb" onclick="styRepost('${o.uid}','${o.sid}')"><div class="ric"><i data-lucide="repeat-2" class="w-5 h-5"></i></div><span class="rlbl">Repost</span></button>`:''}`}</div></div>`;}).join('');
  root.innerHTML=`<div class="sty-overlay"><div class="sty-progress" id="sty-progress" style="position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#EF4444,#F97316);z-index:25;transition:width .25s;width:0%"></div><div class="sty-top"><button class="icobtn" onclick="shToggleMenu()" title="Menu"><i data-lucide="menu" class="w-[15px] h-[15px]"></i></button><b class="font-display text-[15px]">📺 Shorts</b><span class="badge" style="color:#F43F5E;background:rgba(0,0,0,.45);font-size:10px">${creators} creators</span><div style="flex:1"></div><button class="cbtn" id="sty-nextunseen" style="height:30px;font-size:10px" onclick="styNextUnseen()"><i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>Unseen</button><button class="sty-upload-btn" onclick="openStatusAdd()"><i data-lucide="plus"></i> Upload</button><button class="icobtn" onclick="closeStatusScreen()" title="Close"><i data-lucide="x" class="w-[15px] h-[15px]"></i></button></div><div class="sty-feed" id="sty-feed">${items}</div><div id="sty-csheet-host"></div><div class="sty-menu-back" id="sty-menu-back" onclick="shToggleMenu()"></div><div class="sty-menu" id="sty-menu">${styMenuInnerHTML()}</div></div>`;
  lucide.createIcons();shWireFeed();updSegs();}

/* ---------- RERENDER (partial — blink nahi) ---------- */
function styRerender(){if(!statusOpen)return;
  const before=shFeed.map(o=>o.uid+'|'+o.sid).join(',');
  buildFeed(window._shFilter);
  if(shFeed.map(o=>o.uid+'|'+o.sid).join(',')!==before){renderStatusScreen();shRestoreScroll();return;}
  shFeed.forEach(o=>{const m=((allStatus[o.uid]||{})[o.sid])||o.m;o.m=m;
    const item=document.getElementById('sty-item-'+o.uid+'-'+o.sid);if(!item)return;
    const likes=Object.keys(m.likes||{}).length,dis=Object.keys(m.dislikes||{}).length,cmts=Object.keys(m.comments||{}).length,views=Object.keys(m.views||{}).length;
    const set=(role,val)=>{const e=item.querySelector('[data-role="'+role+'"]');if(e)e.textContent=val;};
    set('likes',fmt(likes));set('dislikes',fmt(dis));set('cmts',fmt(cmts));set('views','👁 '+views+' views');
    const lk=item.querySelector('[data-role=likebtn]');if(lk)lk.classList.toggle('on',!!(m.likes||{})[MY.uid]);
    const dk=item.querySelector('[data-role=disbtn]');if(dk)dk.classList.toggle('on',!!(m.dislikes||{})[MY.uid]);
    const fb=item.querySelector('[data-role=followbtn]');
    if(fb&&o.uid!==MY.uid){const f=myFollowing.has(o.uid);fb.classList.toggle('on',f);fb.textContent=f?'✓ FOLLOWING':'🔴 FOLLOW';}});
  shSyncComments();}
function updSegs(){if(!statusOpen)return;
  const ov=document.querySelector('.sty-overlay');if(!ov)return;
  const segs=ov.querySelectorAll('.sty-seg');const idx=window._shIdx||0;
  segs.forEach((s,i)=>{s.classList.toggle('done',i<idx);s.classList.toggle('cur',i===idx);});
  const exp=ov.querySelector('.sty-exp');const cur=shFeed[idx];
  if(exp&&cur){const left=864e5-(Date.now()-cur.m.ts);exp.textContent=left>0?('⏳ '+fmtDur(Math.floor(left/1000))+' left'):'⏳ Expiring';}}
setInterval(updSegs,1000);

/* ---------- WIRE FEED (observer + autoplay + long-press) ---------- */
function onlyPlayThis(v){$$('#sty-feed video').forEach(x=>{if(x!==v){try{x.pause();}catch(e){}}});}
function shWireFeed(){const f=document.getElementById('sty-feed');if(!f)return;
  const tryPlay=v=>{if(!v)return;onlyPlayThis(v);
    v.play().then(()=>{if(window._styMutedAll)v.muted=true;}).catch(()=>{v.muted=true;v.play().catch(()=>{});});};
  $$('#sty-feed video').forEach(v=>{const key=v.id.replace('sty-vid-','');const ov=document.getElementById('sty-ov-'+key);
    v.onpause=()=>{if(ov)ov.style.display='flex';};
    v.onplay=()=>{if(ov)ov.style.display='none';onlyPlayThis(v);};
    if(v.paused)tryPlay(v);});
  const io=new IntersectionObserver(entries=>{entries.forEach(en=>{
    const uid=en.target.dataset.uid,sid=en.target.dataset.sid;
    if(en.isIntersecting&&en.intersectionRatio>=.6){
      window._shIdx=shFeed.findIndex(o=>o.uid===uid&&o.sid===sid);
      stCurUid=uid;stCurSid=sid;markStatusViewed(uid,sid);
      const v=document.getElementById('sty-vid-'+uid+'-'+sid);
      if(v){v.currentTime=0;v.playbackRate=window._stySpeed||1;tryPlay(v);}
      const p=document.getElementById('sty-progress');
      if(p)p.style.width=Math.round(((window._shIdx+1)/shFeed.length)*100)+'%';
      updSegs();
    }else{const v=document.getElementById('sty-vid-'+uid+'-'+sid);if(v&&!v.paused)v.pause();}
  });},{root:f,threshold:[.6]});
  $$('#sty-feed .sty-item').forEach(it=>io.observe(it));
  /* long-press quick reactions + double-tap like */
  shFeed.forEach(o=>{const it=document.getElementById('sty-item-'+o.uid+'-'+o.sid);
    if(!it||it.dataset.rG)return;it.dataset.rG='1';
    const media=it.querySelector('.sty-media');if(!media)return;
    let lp=null,fired=false;
    const start=()=>{fired=false;lp=setTimeout(()=>{fired=true;showQuickRx(o);},550);};
    const cancel=()=>{clearTimeout(lp);};
    const wrap=media.parentElement;
    wrap.addEventListener('touchstart',start,{passive:true});
    wrap.addEventListener('touchend',cancel);wrap.addEventListener('touchmove',cancel);
    wrap.addEventListener('mousedown',start);wrap.addEventListener('mouseup',cancel);wrap.addEventListener('mouseleave',cancel);
    wrap.addEventListener('click',e=>{if(fired){e.stopPropagation();e.preventDefault();fired=false;}},true);});
  /* HOT badge */
  let hotIdx=-1,mx=-1;
  shFeed.forEach((o,i)=>{const v=Object.keys(o.m.views||{}).length;if(v>mx){mx=v;hotIdx=i;}});
  if(hotIdx>=0&&mx>2){const it=document.getElementById('sty-item-'+shFeed[hotIdx].uid+'-'+shFeed[hotIdx].sid);
    if(it){const info=it.querySelector('.sty-info-line');
      if(info&&!info.querySelector('.sty-hot')){const b=document.createElement('span');b.className='sty-hot';b.textContent='🔥 HOT';info.appendChild(b);}}}
  /* keyboard */
  if(!window._shKey){window._shKey=e=>{if(!statusOpen)return;
    if(e.key==='ArrowDown'||e.key==='PageDown'){e.preventDefault();styNext();}
    else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();styPrev();}
    else if(e.key==='Escape'){if(shCmtFor)shCloseComments();else closeStatusScreen();}};
    window.addEventListener('keydown',window._shKey);}}

/* ---------- VIDEO CONTROLS ---------- */
function styTogglePlay(uid,sid){const v=document.getElementById('sty-vid-'+uid+'-'+sid);if(!v)return;
  const ov=document.getElementById('sty-ov-'+uid+'-'+sid);
  if(v.paused){onlyPlayThis(v);v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});});if(ov)ov.style.display='none';}
  else{v.pause();if(ov)ov.style.display='flex';}}
function styVol(val,uid,sid){const v=document.getElementById('sty-vid-'+uid+'-'+sid);if(!v)return;
  const n=Math.max(0,Math.min(100,+val||0));v.volume=n/100;v.muted=(n===0)||window._styMutedAll;
  const lbl=document.getElementById('vv-'+uid+'-'+sid);if(lbl)lbl.textContent=n+'%';
  const ic=document.querySelector('#sty-item-'+uid+'-'+sid+' [data-role=sndic]');if(ic)ic.textContent=(n===0)?'🔇':'🔊';}
function styMute(btn,uid,sid){const v=document.getElementById('sty-vid-'+uid+'-'+sid);if(!v)return;
  v.muted=!v.muted;
  const ic=btn.querySelector('.ric'),lb=btn.querySelector('.rlbl');
  if(ic&&ic.textContent.length<=2)ic.textContent=v.muted?'🔇':'🔊';
  if(lb)lb.textContent=v.muted?'Sound OFF':'Sound ON';
  const sl=document.querySelector('#sty-item-'+uid+'-'+sid+' input[type=range]');
  if(sl){sl.value=v.muted?0:Math.round((v.volume||1)*100);
    const lbl=document.getElementById('vv-'+uid+'-'+sid);if(lbl)lbl.textContent=(v.muted?0:Math.round((v.volume||1)*100))+'%';}}
function styVideoSpeed(){const v=document.getElementById('sty-vid-'+stCurUid+'-'+stCurSid);
  if(!v)return banner('Not a video','#FBBF24');
  const sp=[0.5,1,1.5,2];window._stySpeed=sp[(sp.indexOf(v.playbackRate)+1)%sp.length]||1;
  v.playbackRate=window._stySpeed;banner('⚡ Speed: '+window._stySpeed+'x','#6366F1');}
function styVideoFull(){const v=document.getElementById('sty-vid-'+stCurUid+'-'+stCurSid);
  if(!v)return banner('Not a video','#FBBF24');
  if(v.requestFullscreen)v.requestFullscreen().catch(()=>banner('Fullscreen denied','#F43F5E'));
  else banner('Not supported','#FBBF24');}
function styMuteAllToggle(){window._styMutedAll=!window._styMutedAll;
  $$('#sty-feed video').forEach(v=>v.muted=window._styMutedAll);
  shToggleMenu();banner(window._styMutedAll?'🔇 All videos muted':'🔊 Videos unmuted','#6366F1');}

/* ---------- LIKE / DISLIKE ---------- */
function heartBurst(x,y){for(let i=0;i<7;i++){const h=document.createElement('div');
  h.className='heart-burst';h.textContent=['❤️','💖','💗','💕'][i%4];
  h.style.left=(x+(Math.random()*70-35))+'px';h.style.top=y+'px';
  h.style.animationDelay=(Math.random()*.25)+'s';h.style.fontSize=(18+Math.random()*16)+'px';
  document.body.appendChild(h);setTimeout(()=>h.remove(),1700);}}
async function styLike(btn,uid,sid){const m=((allStatus[uid]||{})[sid])||{};
  const liked=(m.likes||{})[MY.uid],dis=(m.dislikes||{})[MY.uid];
  if(!liked&&btn){const ric=btn.querySelector('.ric');
    if(ric){ric.style.animation='corePopIn2 .45s cubic-bezier(.34,1.56,.64,1)';setTimeout(()=>ric.style.animation='',500);}
    const r=btn.getBoundingClientRect();heartBurst(r.left+r.width/2,r.top+10);}
  const base=db.ref('status/'+uid+'/'+sid);
  try{if(liked)await base.child('likes/'+MY.uid).remove();
    else{await base.child('likes/'+MY.uid).set(true);
      if(dis)await base.child('dislikes/'+MY.uid).remove();
      if(uid!==MY.uid)pushNotif(uid,'react',MY.name+' liked your status 👍',{});}}catch(e){}
  styRerender();}
async function styDislike(uid,sid){const m=((allStatus[uid]||{})[sid])||{};
  const liked=(m.likes||{})[MY.uid],dis=(m.dislikes||{})[MY.uid];
  const base=db.ref('status/'+uid+'/'+sid);
  try{if(dis)await base.child('dislikes/'+MY.uid).remove();
    else{await base.child('dislikes/'+MY.uid).set(true);
      if(liked)await base.child('likes/'+MY.uid).remove();}}catch(e){}
  styRerender();}
document.addEventListener('dblclick',e=>{if(!statusOpen||shCmtFor)return;
  const it=e.target.closest('.sty-item');if(!it)return;
  const uid=it.dataset.uid,sid=it.dataset.sid;if(uid===MY.uid)return;
  const m=((allStatus[uid]||{})[sid])||{};

  styLike(null,uid,sid);banner('❤️ Liked!','#EC4899');});

/* ---------- COMMENTS ---------- */
function shOpenComments(uid,sid){shCmtFor={uid,sid};
  const host=document.getElementById('sty-csheet-host');if(!host)return;
  host.innerHTML=shCommentsHTML(uid,sid);lucide.createIcons();}
function shCloseComments(){shCmtFor=null;const h=document.getElementById('sty-csheet-host');if(h)h.innerHTML='';}
function shCommentsHTML(uid,sid){const m=((allStatus[uid]||{})[sid])||{};
  const cmts=Object.entries(m.comments||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>a.ts-b.ts);
  const isMine=uid===MY.uid,views=Object.keys(m.views||{});
  return `<div class="sty-csheet"><div class="cs-head"><span>💬 Comments (${cmts.length})</span><button class="icobtn" style="width:32px;height:32px" onclick="shCloseComments()"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="cs-body">${isMine&&views.length?`<div class="text-[11px] text-white/50 font-bold">👁 Viewed by: ${views.map(v=>esc((allUsers[v]||{}).name||'User')).join(', ')}</div>`:''}${cmts.map(c=>{const rxc={};Object.values(c.rx||{}).forEach(e=>rxc[e]=(rxc[e]||0)+1);
    const liked=(c.rx||{})[MY.uid]==='❤️';
    return `<div class="sty-cmt-row"><img class="av" src="${c.avatar||AVATAR_PRESETS[0]}" onclick="shCloseComments();openUserModal('${c.uid}')"><div class="sty-cmt-b"><span class="sty-cmt-name" onclick="shCloseComments();openUserModal('${c.uid}')">${esc(c.name)}</span><div class="sty-cmt-txt">${esc(c.text)}</div><div class="sty-cmt-meta"><button class="sty-cmt-act ${liked?'liked':''}" onclick="styReactComment('${sid}','${c.id}','❤️')">❤️ ${rxc['❤️']||''}</button><button class="sty-cmt-act" onclick="styReactComment('${sid}','${c.id}','👍')">👍</button><button class="sty-cmt-act" onclick="styReplyComment(decodeURIComponent('${encodeURIComponent(c.name)}'))">↩ Reply</button><span style="font-size:9.5px;color:rgba(255,255,255,.35);font-weight:700;margin-left:auto">${fmtTime(c.ts)}</span>${c.uid===MY.uid?`<button class="sty-cmt-act" style="color:#FDA4AF" onclick="styDelComment('${sid}','${c.id}')">🗑</button>`:''}${c.uid!==MY.uid?`<button class="sty-cmt-act" onclick="shCloseComments();closeStatusScreen();startDM('${c.uid}')">✉ DM</button>`:''}</div></div></div>`;}).join('')||'<div class="text-white/40 text-[12.5px]">No comments yet — be the first! 💬</div>'}</div>${!isMine?`<div class="cs-inp"><input id="sty-cmt-inp" class="input-field" style="padding:9px 12px;font-size:13px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#fff" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')styComment()"><button class="btn-primary px-3 font-bold text-sm" style="font-family:inherit" onclick="styComment()">➤</button></div>`:''}</div>`;}
function shSyncComments(){if(!shCmtFor)return;
  const h=document.getElementById('sty-csheet-host');if(!h)return;
  const old=document.getElementById('sty-cmt-inp');const val=old?old.value:'';
  h.innerHTML=shCommentsHTML(shCmtFor.uid,shCmtFor.sid);
  const ni=document.getElementById('sty-cmt-inp');if(ni)ni.value=val;
  lucide.createIcons();}
async function styReactComment(sid,cid,emo){if(!shCmtFor)return;
  const mine=(((allStatus[shCmtFor.uid]||{})[sid]||{}).comments||{})[cid];
  const myRx=(mine&&mine.rx||{})[MY.uid];
  const ref=db.ref('status/'+shCmtFor.uid+'/'+sid+'/comments/'+cid+'/rx/'+MY.uid);
  try{if(myRx===emo)await ref.remove();else await ref.set(emo);}catch(e){}
  shSyncComments();}
async function styDelComment(sid,cid){if(!shCmtFor)return;
  if(!confirm('Delete this comment?'))return;
  try{await db.ref('status/'+shCmtFor.uid+'/'+sid+'/comments/'+cid).remove();}catch(e){}
  shSyncComments();styRerender();}
function styReplyComment(name){const i=document.getElementById('sty-cmt-inp');
  if(i){i.value='@'+name+' '+i.value;i.focus();}}
async function styComment(){if(!shCmtFor)return;
  const i=document.getElementById('sty-cmt-inp'),t=i?i.value.trim():'';if(!t)return;
  const{uid,sid}=shCmtFor;
  try{await db.ref('status/'+uid+'/'+sid+'/comments').push({uid:MY.uid,name:MY.name,avatar:MY.avatar,text:t,ts:Date.now(),rx:{}});
    if(uid!==MY.uid)pushNotif(uid,'comment',MY.name+' commented on your status 💬',{});
    if(i)i.value='';
  }catch(e){}
  shSyncComments();styRerender();}

async function styRepost(uid,sid){const m=((allStatus[uid]||{})[sid])||{};

async function styDelete(uid,sid){if(uid!==MY.uid)return banner('Only your own status','#FBBF24');

  if(!shFeed.length&&window._shFilter){window._shFilter=null;buildFeed();}

function handleStatusFile(f){if(!f)return;
  const isVid=f.type.startsWith('video/');const maxMB=isVid?6:8;
  if(f.size>maxMB*1048576)return banner((isVid?'Video':'Image')+' too big — max '+maxMB+'MB','#FBBF24');

  else{const r=new FileReader();
    r.onload=async e=>{try{const img=new Image();img.src=e.target.result;
      await img.decode().catch(()=>{});
      const sc=Math.min(1,720/(img.width||720));
      const cv=document.createElement('canvas');
      cv.width=Math.round((img.width||720)*sc);cv.height=Math.round((img.height||720)*sc);

function checkAlarms(){if(!MY||!diaryAlarms.length)return;

  const n=new Date(),hhmm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),dk=localKey(n);

function doConv(){const S=window._p8;
  const U={km:{mi:.621371},mi:{km:1.60934},kg:{lb:2.20462},lb:{kg:.453592},cm:{in:.393701},in:{cm:2.54}};

  const r=v*U[f][t];
  out.innerHTML='<div class="glass p-3 text-center scale-in"><div class="text-white/40 text-[11px]">'+v+' '+f+' =</div><div class="font-display font-extrabold text-2xl" style="color:#67E8F9">'+r.toFixed(4)+' '+t+'</div><button class="a-btn mt-2" style="font-family:inherit" onclick="navigator.clipboard.writeText(\''+r.toFixed(4)+'\').then(()=>banner(\'Copied 📋\',\'#10B981\'))">📋 Copy</button></div>';

/* ---------- C: SOUND ENGINE ---------- */
function v91Tone(notes){ /* notes: [freq, delay, duration, volume] */
  if(!soundOn)return;
  var ctx=getACtx();if(!ctx)return;
  try{
    var t=ctx.currentTime;
    notes.forEach(function(n){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=n[0];
      var st=t+n[1],vol=n[3]||.12,dur=n[2]||.5;
      g.gain.setValueAtTime(.0001,st);
      g.gain.exponentialRampToValueAtTime(vol,st+.02);
      g.gain.exponentialRampToValueAtTime(.0001,st+dur);
      o.start(st);o.stop(st+dur+.05);
    });
  }catch(e){}}

  var now=Date.now();
  if(!force&&now-_v91markT<5000)return; /* throttle writes */
  _v91markT=now;
  v91wcSeen=now;
  try{localStorage.setItem('v91wcSeen',now);}catch(e){}
  try{db.ref('reads/'+MY.uid+'/wc').set(now);}catch(e){}
  v91wcCount=0;v91UpdateWC(0);}
function v91Recount(){
  var n=0;
  for(var i=0;i<v91wcMsgs.length;i++){
    var m=v91wcMsgs[i];
    if(m.ts>v91wcSeen&&m.uid!==MY.uid&&!bannedUsers.has(m.uid))n++;}
  v91wcCount=n;v91UpdateWC(n);}
function v91InitWC(){
  if(!MY||window._v91wcInit)return;window._v91wcInit=true;
  v91wcSeen=+(localStorage.getItem('v91wcSeen')||0);
  /* read-timestamp sync across devices */
  try{db.ref('reads/'+MY.uid+'/wc').on('value',function(s){var v=s.val()||0;if(v>v91wcSeen){v91wcSeen=v;v91Recount();}},function(){});}catch(e){}
  /* last 40 global messages → count unseen */
  try{db.ref('chats/global').limitToLast(40).on('value',function(s){
    v91wcMsgs=Object.values(s.val()||{}).filter(function(m){return m&&m.ts;});
    /* user is watching World Chatter right now → mark as seen instantly */
    if(!document.hidden&&view==='chat'&&chatMode==='global')v91MarkRead();
    v91Recount();
  },function(){});}catch(e){}
  /* alert on new message (when NOT watching the chat) */
  var gInit=false;const gAtt=Date.now();
  try{db.ref('chats/global').limitToLast(1).on('child_added',function(s){
    const m=s.val();
    if(!gInit){gInit=true;return;} /* skip the initial snapshot */
    if(!m||!m.ts||m.ts<gAtt)return;
    if(m.uid===MY.uid)return;          /* own message — no alert */
    if(bannedUsers.has(m.uid))return;
    if(!document.hidden&&view==='chat'&&chatMode==='global')return; /* already watching */
    v91WCNotify(m);
  },function(){});}catch(e){}
  /* safety refresh of badge */
  setInterval(function(){try{v91UpdateWC(v91wcCount);}catch(e){}},10000);}

/* ---------- A: Register the service worker ---------- */
window._v92sw = 'loading';
(function v92Init() {
  if (!('serviceWorker' in navigator)) { window._v92sw = 'unsupported'; return; }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js')
      .then(function () {
        window._v92sw = 'active';
        return navigator.serviceWorker.ready;
      })
      .then(function () {
        /* point the manifest link to the sw.js-served manifest */
        v92RelinkManifest();
        /* re-link again after a moment — forces Chrome to re-check installability */
        setTimeout(v92RelinkManifest, 2000);
      })
      .catch(function () { window._v92sw = 'missing'; });
  });
})();
function v92RelinkManifest() {
  try {
    var old = document.querySelector('link[rel="manifest"]');
    if (old) old.remove();
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'manifest.json'; /* served by sw.js */
    document.head.appendChild(l);
  } catch (e) {}
}

  const ua=navigator.userAgent;
  const inApp=/WhatsApp|FBAN|FBAV|Instagram|Snapchat|Line\/|Telegram|Twitter|TikTok|musical_ly|Snapchat|Viber|WeChat/i.test(ua);
  const chrome=/Chrome\/[\d.]+/i.test(ua)&&!/OPR\/|Opera|Edg\/|SamsungBrowser|YaBrowser|MiuiBrowser|HeyTapBrowser/i.test(ua)&&!inApp;
  const chromium=(/Chrome\/|Edg\/|SamsungBrowser|OPR\//i.test(ua))&&!inApp;
  return{
    isAndroid:/android/i.test(ua),
    isIOS:/iphone|ipad|ipod/i.test(ua),
    inApp:inApp,
    chrome:chrome,
    chromium:chromium,
    brand:(/HeyTapBrowser/i.test(ua))?'Oppo Browser':(/MiuiBrowser/i.test(ua))?'Xiaomi Browser':(/SamsungBrowser/i.test(ua))?'Samsung Internet':''

function v93OpenChrome(){

  const intent='intent://'+clean.replace(/^https?:\/\//,'')+
    '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(clean)+';end';
  location.href=intent;
}

async function adminSetTheme(i){try{await db.ref('meta/settings').update({theme:i,customBg:null});SETTINGS.theme=i;SETTINGS.customBg='';applySettings(SETTINGS);banner('🌍 Theme applied to ALL!','#10B981');render();}catch(e){}}
async function adminToggle(k){const v=!SETTINGS[k];try{await db.ref('meta/settings/'+k).set(v);SETTINGS[k]=v;banner(k+' → '+(v?'ON':'OFF'),'#6366F1');render();}catch(e){}}
async function clearChatNow(){if(!isAdmin)return banner('Admins only','#F43F5E');
  if(!confirm('Clear ALL chats for everyone?'))return;
  try{await db.ref('chats').remove();await db.ref('typing').remove();banner('All chats cleared 🧹','#F43F5E');}catch(e){}}

/* ---------- L: BROADCAST (👑 OWNER) ---------- */
async function adminBroadcast(){if(!isAdmin)return banner('Admins only','#F43F5E');
  const t=prompt('📢 Message to ALL users (green OWNER message 👑):');
  if(!t||t.trim().length<3)return banner('Message too short','#FBBF24');
  const msg=t.trim();
  const uids=Object.keys(allUsers).filter(u=>u!=='system'&&u!==MY.uid);
  if(!uids.length)return banner('No users found','#FBBF24');
  if(!confirm('Send to '+uids.length+' users?'))return;
  let n=0;
  for(const uid of uids){try{await db.ref('notifs/'+uid).push({type:'admin',text:msg,ts:Date.now(),owner:true});n++;}catch(e){}}
  banner('👑 Broadcast sent to '+n+' users','#10B981');fireConfetti();}

/* ---------- M: PWA — Install App (free, no files) ---------- */
(function(){
try{
  const mkIcon=s=>{const cv=document.createElement('canvas');cv.width=cv.height=s;
    const x=cv.getContext('2d');
    const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'#6366F1');g.addColorStop(1,'#A855F7');
    x.fillStyle=g;x.fillRect(0,0,s,s);
    x.fillStyle='#fff';x.font='bold '+Math.round(s*.6)+'px Arial';
    x.textAlign='center';x.textBaseline='middle';x.fillText('V',s/2,s*.54);
    return cv.toDataURL('image/png');};
  const man={name:'Votify — Opinion Arena',short_name:'Votify',
    start_url:location.origin+location.pathname,scope:location.origin+location.pathname,
    display:'standalone',background_color:'#06070D',theme_color:'#6366F1',
    icons:[{src:mkIcon(192),sizes:'192x192',type:'image/png'},{src:mkIcon(512),sizes:'512x512',type:'image/png'}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
  document.head.appendChild(l);
  const tm=document.createElement('meta');tm.name='theme-color';tm.content='#6366F1';document.head.appendChild(tm);
}catch(e){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._pwaPrompt=e;});
window.addEventListener('appinstalled',()=>{window._pwaPrompt=null;banner('📲 App installed! 🎉','#10B981');});
})();
function pwaInstall(){
  if(window._pwaPrompt){window._pwaPrompt.prompt();window._pwaPrompt.userChoice.then(()=>{window._pwaPrompt=null;}).catch(()=>{});return;}
  banner('📲 Browser menu (⋮) → "Install app" / "Add to Home screen"','#6366F1');}

/* ---------- N: PUSH NOTIFICATIONS (free — tab hidden pe bhi) ---------- */
function initPushListener(){
  if(!MY||window._pushInit)return;window._pushInit=true;
  if(!('Notification' in window))return;
  try{
    db.ref('notifs/'+MY.uid).limitToLast(3).on('value',s=>{
      const arr=Object.values(s.val()||{});
      const last=arr[arr.length-1];
      if(!last||!last.ts)return;
      if(window['_pn'+last.ts])return;window['_pn'+last.ts]=1;
      if(document.hidden&&Notification.permission==='granted'&&localStorage.getItem('v2pushmute')!=='1'){
        try{
          const opt={body:String(last.text||'').slice(0,120),tag:'vot'+last.ts};
          const fu=(allUsers[last.from]||{}).avatar;if(fu)opt.icon=fu;
          const n=new Notification(SETTINGS.name||'Votify',opt);
          n.onclick=()=>{window.focus();n.close();};
        }catch(e){}
      }
    },()=>{});
  }catch(e){}}
function askPushOnce(){
  if(!('Notification' in window))return;
  if(Notification.permission!=='default')return;
  if(localStorage.getItem('v2pushask')==='1')return;
  localStorage.setItem('v2pushask','1');
  setTimeout(()=>{
    if(!MY)return;
    $('#admin-root').innerHTML=`<div class="modal-overlay" style="z-index:300" onclick="if(event.target===this)document.getElementById('admin-root').innerHTML=''"><div class="modal-card scale-in text-center"><div class="text-4xl mb-2" style="animation:coreHeartbeat 1.5s infinite;display:inline-block">🔔</div><h3 class="font-display font-extrabold text-xl mb-1">Never Miss a Message!</h3><p class="text-white/45 text-[12.5px] mb-4">Jab koi aapko message bheje — notification milega, chahe aap dusri tab me ho.</p><div class="flex gap-2"><button class="btn-primary flex-1 py-3 font-bold" style="font-family:inherit" onclick="pushAllow()">🔔 Enable</button><button class="btn-ghost flex-1 py-3 font-bold" style="font-family:inherit" onclick="document.getElementById('admin-root').innerHTML=''">Later</button></div></div></div>`;
  },4000);}
async function pushAllow(){
  if(!('Notification' in window))return;
  const p=await Notification.requestPermission();
  document.getElementById('admin-root').innerHTML='';
  banner(p==='granted'?'🔔 Notifications ON!':'Permission denied',p==='granted'?'#10B981':'#FBBF24');}
async function togglePushNotifs(){
  if(!('Notification' in window))return banner('Is browser me supported nahi','#F43F5E');
  const muted=localStorage.getItem('v2pushmute')==='1';
  if(muted){localStorage.setItem('v2pushmute','0');banner('🔔 Notifications ON','#10B981');}
  else if(Notification.permission==='granted'){localStorage.setItem('v2pushmute','1');banner('🔕 Notifications muted','#6366F1');}
  else{const p=await Notification.requestPermission();localStorage.setItem('v2pushmute',p==='granted'?'0':'1');banner(p==='granted'?'🔔 ON':'Permission denied',p==='granted'?'#10B981':'#FBBF24');}
  render();}

/* ---------- O: DRAWER me Install + Notifications buttons ---------- */
(function(){var o=drawerHTML;
  drawerHTML=function(){
    var h=o();
    try{
      var btns='';
      if('Notification' in window){var muted=localStorage.getItem('v2pushmute')==='1';
        btns+='<button class="p99-mini" onclick="togglePushNotifs()">'+(muted?'🔕':'🔔')+' Notifications '+(muted?'OFF':'ON')+'</button>';}
      btns+='<button class="p99-mini" onclick="pwaInstall()">📲 Install App</button>';
      var idx=h.indexOf('<div class="p99-me"');
      if(idx>0)h=h.slice(0,idx)+btns+h.slice(idx);
    }catch(e){}
    return h;};
})();

/* ---------- P: TITLE + ONLINE/OFFLINE + BOOT HOOKS ---------- */
setInterval(function(){
  if(!MY){document.title='Votify — Opinion Arena';return;}
  var pre='';
  var dmN=notifs.filter(function(n){return n.ts>notifLastRead&&n.type==='dm';}).length;
  if(dmN)pre='('+dmN+') ';
  if(view==='battle'&&viewParam&&allBattles[viewParam]&&Date.now()<=(allBattles[viewParam].endsAt||0)){
    document.title=pre+'⏱ '+timeLeft(allBattles[viewParam].endsAt)+' · Votify';return;}
  document.title=pre+'Votify — Opinion Arena';
},3000);
window.addEventListener('offline',()=>toast('📴 Aap offline ho — messages fail ho sakte hain','error'));
window.addEventListener('online',()=>banner('📶 Internet wapas aa gaya!','#10B981'));
/* startApp hook: push init + ask once */
(function(){var o=startApp;
  startApp=function(me){o(me);
    try{initPushListener();}catch(e){}
    setTimeout(askPushOnce,2500);};})();
