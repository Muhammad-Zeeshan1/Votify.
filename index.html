<style>

const MAX_LEVEL = 1000;
function getLevelData(xp) {
    xp = xp || 0;

async function checkTournaments(){
if(!MY)return;
for(const[id,t]of Object.entries(allTournaments)){
if(!t||t.status!=='active')continue;
const ms=t.matches&&t.matches[t.round];
if(!ms)continue;
const ids=Object.values(ms);
if(ids.length<2)continue;
const battles=ids.map(bid=>allBattles[bid]);
if(battles.some(b=>!b))continue;
if(battles.some(b=>Date.now()<=(b.endsAt||0)))continue;
const winners=battles.map(b=>{
const opts=b.options||[];const counts=opts.map(o=>Object.keys(o.votes||{}).length);
const tot=counts.reduce((a,c)=>a+c,0);
if(!tot)return null;
const mx=Math.max(...counts);
if(counts.filter(c=>c===mx).length!==1)return null;
return opts[counts.indexOf(mx)].label;});
if(winners.some(w=>!w)){
for(let i=0;i<battles.length;i++){
if(!winners[i])await db.ref('battles/'+ids[i]+'/endsAt').set(Date.now()+216e5);}
continue;}
if(winners.length===1){
await db.ref('tournaments/'+id).update({status:'finished',winner:winners[0]});
if(t.creator&&t.creator!==MY.uid)pushNotif(t.creator,'tournament','🏆 Your tournament "'+t.name+'" finished! Winner: '+winners[0],{});
continue;}
const nextOpts=winners.map(w=>({label:w,img:((t.options||[]).find(o=>o===w)||{}).img||''}));
const nids={};
for(let i=0;i<nextOpts.length;i+=2){
const bref=await db.ref('battles').push({title:t.name+' — R'+(t.round+1)+': '+nextOpts[i].label+' vs '+nextOpts[i+1].label,category:t.category,creator:t.creator,creatorName:t.creatorName,createdAt:Date.now(),endsAt:Date.now()+864e5,tournament:id,round:t.round+1,match:i/2,options:[{label:nextOpts[i].label,img:nextOpts[i].img,votes:{}},{label:nextOpts[i+1].label,img:nextOpts[i+1].img,votes:{}}]});
nids[i/2]=bref.key;}
await db.ref('tournaments/'+id+'/matches/'+(t.round+1)).set(nids);
await db.ref('tournaments/'+id+'/round').set(t.round+1);
toast('🥇 Tournament "'+t.name+'" — Round '+(t.round+1)+' started!','success');}}

function battleCard(b,id){const cat=catOf(b.category),total=votesOf(b),ended=Date.now()>(b.endsAt||0);const opts=b.options||[];const lead=opts.length?opts.reduce((m,o,i,arr)=>Object.keys(o.votes||{}).length>Object.keys(arr[m].votes||{}).length?i:m,0):0;const pair=opts.length>=2?[opts[0],opts[1]]:null;const saved=myBookmarks.has(id);return `<div class="glass card-hover p-5 cursor-pointer fade-up" onclick="openBattle('${id}')"><div class="flex items-center gap-2 mb-3"><span class="badge" style="color:${cat.color};border-color:${cat.color}44"><i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>${cat.name}</span>${ended?'<span class="badge" style="color:#F43F5E">Ended</span>':'<span class="badge" style="color:#10B981"><span class="live-dot"></span>Live</span>'}${b.tournament?'<span class="badge" style="color:#FCD34D">🥇</span>':''}${b.anon?'<span class="badge" style="color:#8A8DA3">🙈</span>':''}<button onclick="event.stopPropagation();toggleBookmark('${id}')" class="ml-auto ${saved?'text-yellow-300':'text-white/30'} hover:text-yellow-300" title="Save"><i data-lucide="bookmark" class="w-4 h-4"></i></button><button onclick="event.stopPropagation();computerCalc('${id}')" class="text-white/30 hover:text-cyan-400" title="Computer Calculator"><i data-lucide="bot" class="w-4 h-4"></i></button><button onclick="event.stopPropagation();shareBattleWA('${id}')" class="text-white/30 hover:text-green-400" title="Share"><i data-lucide="share-2" class="w-4 h-4"></i></button></div><div class="font-display font-bold text-[16px] leading-snug mb-3 clamp2">${esc(b.title)}</div>${pair?`<div class="flex items-stretch gap-2 mb-3"><div class="flex-1 min-w-0">${pair[0].img?`<img src="${pair[0].img}" class="w-full aspect-video object-contain mb-1.5" style="background:#0A0B16">`:`<div class="w-full aspect-video mb-1.5 flex items-center justify-center" style="background:rgba(255,255,255,.05)">🖼</div>`}<div class="text-[12px] text-white/70 font-semibold truncate">${esc(pair[0].label)}</div></div><div class="font-display font-extrabold text-white/30 text-sm flex items-center">VS</div><div class="flex-1 min-w-0">${pair[1].img?`<img src="${pair[1].img}" class="w-full aspect-video object-contain mb-1.5" style="background:#0A0B16">`:`<div class="w-full aspect-video mb-1.5 flex items-center justify-center" style="background:rgba(255,255,255,.05)">🖼</div>`}<div class="text-[12px] text-white/70 font-semibold truncate">${esc(pair[1].label)}</div></div></div>`:`<div class="text-[12.5px] text-white/50 mb-3">${opts.map(o=>esc(o.label)).join(' vs ')}</div>`}${(b.tags||[]).length?`<div class="flex gap-1.5 flex-wrap mb-2">${b.tags.slice(0,3).map(t=>`<span class="badge" style="color:#67E8F9">#${esc(t)}</span>`).join('')}</div>`:''}<div class="flex justify-between text-[11.5px] text-white/40 font-semibold"><span>🗳 ${fmt(total)}</span>${ended?`<span>🏆 ${esc(opts[lead]?opts[lead].label:'Tie')}</span>`:`<span class="tl" data-end="${b.endsAt}">${timeLeft(b.endsAt)}</span>`}</div></div>`;}

function analyzeImage(src){return new Promise(res=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{try{if(!img.width||!img.height)return res({ok:false});const S=56;const sc=Math.min(1,S/Math.max(img.width,img.height));const w=Math.max(2,Math.round(img.width*sc)),h=Math.max(2,Math.round(img.height*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);const d=ctx.getImageData(0,0,w,h).data;let lum=0,sat=0,n=w*h;const lums=new Array(n);for(let i=0;i<n;i++){const j=i*4;const r=d[j],g=d[j+1],b2=d[j+2];const l=.299*r+.587*g+.114*b2;lums[i]=l;lum+=l;const mx=Math.max(r,g,b2),mn=Math.min(r,g,b2);sat+=mx===0?0:(mx-mn)/mx;}lum/=n;sat/=n;let vr=0;for(let i=0;i<n;i++)vr+=(lums[i]-lum)*(lums[i]-lum);const std=Math.sqrt(vr/n);let edges=0;for(let y=1;y<h;y++)for(let x=1;x<w;x++){const i2=(y*w+x)*4;const lc=.299*d[i2-4]+.587*d[i2-3]+.114*d[i2-2];const lb=.299*d[i2-w*4]+.587*d[i2-w*4+1]+.114*d[i2-w*4+2];if(Math.abs(lc-lb)>18)edges++;}const edgeD=edges/Math.max(1,(w-1)*(h-1));res({ok:true,brightness:lum/255,saturation:sat,contrast:std/128,detail:Math.min(1,edgeD*3)});}catch(e){res({ok:false});}};img.onerror=()=>res({ok:false});img.src=src;});}
async function computerCalc(bid){
const b=allBattles[bid];if(!b)return;const opts=b.options||[];
if(!opts.length)return toast('No options to analyze','warning');
 $('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-card scale-in text-center"><div class="text-5xl mb-3">🤖</div><b class="font-display text-lg">Computer Calculator</b><div class="text-white/45 text-sm mt-2">Analyzing battle images…</div></div></div>`;
const analyses=[];for(const o of opts)analyses.push(await analyzeImage(o.img||''));
const scores=opts.map((o,i)=>{const a=analyses[i];
if(a&&a.ok){const s=Math.round(Math.min(100,Math.max(6,a.brightness*30+a.saturation*25+a.contrast*25+a.detail*25+6)));return{label:o.label,real:true,b:Math.round(a.brightness*100),s:Math.round(a.saturation*100),c:Math.round(Math.min(100,a.contrast*100)),d:Math.round(a.detail*100),score:s};}
let h=0;const t=String(o.label||('Option '+(i+1)));for(let j=0;j<t.length;j++)h=(h*33+t.charCodeAt(j))>>>0;const v=30+(h%55);
return{label:o.label,real:false,b:35+(h%55),s:30+(h%60),c:35+(h%50),d:v,score:v};});
const total=scores.reduce((x,s)=>x+s.score,0)||1;
let pcts=scores.map(s=>Math.round(s.score/total*100));
const diff=100-pcts.reduce((a,b)=>a+b,0);if(pcts.length&&diff!==0)pcts[pcts.length-1]+=diff;
const wi=pcts.indexOf(Math.max(...pcts));
const close=pcts.length>1&&(Math.max(...pcts)-Math.min(...pcts))<=5;
const winnerLabel=close?'Too close to call — slight edge: '+opts[wi].label:opts[wi].label;
const conf=close?'Low confidence — both images are nearly equal!':'Confidence: '+Math.max(...pcts)+'% win chance';
const bar=(l,v)=>`<div class="flex items-center gap-2 mb-1"><span class="text-[10.5px] text-white/45" style="width:74px;flex-shrink:0">${l}</span><div class="flex-1 h-2 bg-white/10 overflow-hidden"><div class="h-full" style="width:${Math.min(100,v)}%;background:linear-gradient(90deg,#06B6D4,#3B82F6)"></div></div><span class="text-[10.5px] text-white/55" style="width:32px;text-align:right">${v}</span></div>`;
 $('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in">

async function saveAlarm(){const time=$('#da-time').value,label=$('#da-label').value.trim(),repeat=$('#da-repeat').value;if(!time)return toast('Please set alarm time','warning');if(diaryEditAlarmId){const old=diaryAlarms.find(x=>x.id===diaryEditAlarmId)||{};await db.ref('diary/'+MY.uid+'/alarms/'+diaryEditAlarmId).update({time,label:label||'Alarm',repeat,active:old.active!==false});}else await db.ref('diary/'+MY.uid+'/alarms').push({time,label:label||'Alarm',repeat,active:true,ts:Date.now(),lastFired:''});closeModal();toast('Alarm saved ✅','success');}

function ringAlarm(a){playAlarmSound();$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal-card scale-in text-center" style="border-color:rgba(251,191,36,.5)"><div class="text-6xl mb-3">⏰</div><h3 class="font-display font-extrabold text-2xl mb-1">${esc(a.label||'Alarm')}</h3><div class="font-display font-extrabold text-3xl text-yellow-300 mb-2">${esc(a.time)}</div><div class="text-white/50 text-sm mb-4">It's time! ${a.repeat==='once'?'(one-time alarm)':'(daily alarm)'}</div><button class="btn-primary w-full py-3 font-bold" onclick="stopAlarm()">⏹ Stop Alarm</button></div></div>`;}

function playAlarmSound(){stopAlarmSound();const ring=()=>{if(!soundOn)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[880,1100,880,1100].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;const t=ctx.currentTime+i*.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.start(t);o.stop(t+.18);});}catch(e){}};ring();alarmAudioTimer=setInterval(ring,1200);}
function stopAlarmSound(){if(alarmAudioTimer){clearInterval(alarmAudioTimer);alarmAudioTimer=null;}}

function openTodoForm(id){const t=id?diaryTodos.find(x=>x.id===id):null;diaryEditTodoId=id||null;$('#modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[17px]">${t?'✏️ Edit Task':'✅ Add To-Do Task'}</b><button class="icobtn" style="width:34px;height:34px" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><label class="lbl">Task</label><input id="dt-text" class="input-field" maxlength="120" placeholder="e.g. Complete homework / Buy groceries" value="${t?esc(t.text):''}" onkeydown="if(event.key==='Enter')saveTodo()"><button class="btn-primary w-full py-3 font-bold mt-4" onclick="saveTodo()">💾 Save Task</button></div></div>`;lucide.createIcons();setTimeout(()=>{const i=$('#dt-text');if(i)i.focus();},100);}
async function saveTodo(){const text=$('#dt-text').value.trim();if(!text)return toast('Please write the task','warning');if(diaryEditTodoId){const old=diaryTodos.find(x=>x.id===diaryEditTodoId)||{};await db.ref('diary/'+MY.uid+'/todos/'+diaryEditTodoId).update({text,done:old.done||false});}else await db.ref('diary/'+MY.uid+'/todos').push({text,done:false,ts:Date.now()});closeModal();toast('Task saved ✅','success');}

function diaryEventsHTML(){const list=diaryEvents.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));return `<button class="btn-primary px-4 py-2.5 font-bold text-[13px] mb-4" onclick="openEventForm()">➕ Add Event</button>${list.map(ev=>{const t=new Date(ev.date+'T00:00:00').getTime();const days=Math.ceil((t-Date.now())/864e5);let badge;if(days>0)badge=`<span class="badge" style="color:#818CF8">in ${days} day${days>1?'s':''}</span>`;else if(days===0)badge=`<span class="badge" style="color:#F43F5E">Today!</span>`;else badge=`<span class="badge" style="color:#8A8DA3">${-days} day${days<-1?'s':''} ago</span>`;return `<div class="glass card-hover p-3 mb-2 flex items-center gap-3 flex-wrap"><div style="min-width:60px"><div class="font-display font-extrabold text-[13px] text-indigo-300">${diaryDate(ev.date)}</div></div><div class="flex-1 min-w-[130px]"><b class="text-[13.5px]">${esc(ev.title)}</b>${ev.note?`<div class="text-[12px] text-white/50 mt-0.5">${esc(ev.note)}</div>`:''}</div>${badge}<button class="a-btn" onclick="openEventForm('${ev.id}')">✏️</button><button class="a-btn danger" onclick="delEvent('${ev.id}')">🗑</button></div>`;}).join('')||emptyState('calendar','No events yet — add birthdays, exams, meetings!')}`;}

<div class="st-preview mb-3" id="strand" style="background:linear-gradient(135deg, ${randColor()}, ${randColor()})"></div>
<button class="btn-ghost w-full py-2.5 font-bold text-[13px] mb-2" onclick="stRandom2()">🎲 Generate New Random</button>
<button class="btn-primary w-full py-3 font-bold" onclick="stApplyRandom2()">✅ Apply This Random</button>
</div>
</div>`;}

function stUpd(){
stC1=$('#stc1').value;stC2=$('#stc2').value;stAngle=+$('#stang').value;
const grad=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`;
const p=$('#stprev');if(p)p.style.background=grad;
const lbl=$('#stgrad');if(lbl)lbl.textContent=grad;
const av=$('#stangval');if(av)av.textContent=stAngle+'°';
const mb=$('#stmix');if(mb)mb.style.background=mixHex(stC1,stC2);}
function stPick(c){stC1=c;$('#stc1').value=c;stUpd();toast('Color 1 = '+c,'info');}
function stMixNow(){stC2=mixHex(stC1,stC2);$('#stc2').value=stC2;stUpd();toast('🎨 Colors mixed → '+stC2,'success');}
function stUseMix(){stC2=mixHex(stC1,stC2);$('#stc2').value=stC2;stUpd();toast('Mix applied as Color 2','success');}
function stRandom(){
stC1=randColor();stC2=randColor();stAngle=Math.floor(Math.random()*360);
 $('#stc1').value=stC1;$('#stc2').value=stC2;$('#stang').value=stAngle;stUpd();
toast('🎲 Random: '+stC1+' → '+stC2,'info');}
let _rand2=['#6366F1','#EC4899'];
function stRandom2(){_rand2=[randColor(),randColor()];const el=$('#strand');if(el)el.style.background=`linear-gradient(135deg, ${_rand2[0]}, ${_rand2[1]})`;}
async function stApplyRandom2(){stC1=_rand2[0];stC2=_rand2[1];stAngle=135;await stApply();}
async function stApply(){
const css=`linear-gradient(${stAngle}deg, ${stC1}, ${stC2})`;
await db.ref('meta/settings/theme').set(-1);
await db.ref('meta/settings/customBg').set(css);
localStorage.setItem('basiler_theme','-1');
SETTINGS.customBg=css;SETTINGS.theme=-1;applySettings(SETTINGS);
toast('🎨 Background applied!','success');render();}
async function stApplySolid(c){
await db.ref('meta/settings/theme').set(-1);
await db.ref('meta/settings/customBg').set(c);
localStorage.setItem('basiler_theme','-1');
SETTINGS.customBg=c;SETTINGS.theme=-1;applySettings(SETTINGS);
toast('Solid background applied: '+c,'success');render();}

function pageAdminUsers(){const users=Object.entries(allUsers).filter(([uid])=>uid!=='system');return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">👤 Users</h2><p class="text-white/45 text-sm mb-3">${users.length} users · ${bannedUsers.size} banned</p>
<div class="glass p-3 mb-5 text-[12px] text-white/55 flex items-center gap-2" style="border-color:rgba(168,85,247,.35)"><i data-lucide="venetian-mask" class="w-4 h-4 text-fuchsia-400"></i> 🎭 <b>Impersonate:</b> kisi bhi user ke <b>naam/avatar par 5 baar tezi se tap</b> karein (3 sec) — unke account mein login ho kar diary, posts & battles explore karein!</div>
 ${users.map(([uid,u])=>`<div class="a-row">
<div class="flex items-center gap-2.5 flex-1 min-w-[140px] cursor-pointer" onclick="adminTapUser('${uid}')" title="🎭 Tap 5x fast to explore as this user">
<img src="${u.avatar||AVATAR_PRESETS[0]}" class="w-9 h-9 object-cover">
<div><b class="text-[13.5px]">${esc(u.name)}</b> ${uidChip(uid)}<div class="text-[10.5px] text-white/40">LVL ${levelOf(u.xp)} · ${fmt(u.xp||0)} XP · ${u.loginCount||0} logins</div></div>
</div>
<span class="badge" style="color:${isOnline(uid)?'#10B981':'#8A8DA3'}">${isOnline(uid)?'online':'offline'}</span>
 ${u.verified?`<button class="a-btn" onclick="adminVerify('${uid}')">✅ Unverify</button>`:`<button class="a-btn" style="background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:#38BDF8" onclick="adminVerify('${uid}')">Verify</button>`}
 ${bannedUsers.has(uid)?`<button class="a-btn" onclick="adminUnban('${uid}')">Unban</button>`:`<button class="a-btn danger" onclick="adminBan('${uid}')">Ban</button>`}
<button class="a-btn gift" onclick="adminGift('${uid}')">Gift XP</button>
</div>`).join('')||emptyState('users','No users')}</div>`;}
function pageAdminBattles(){const bl=Object.entries(allBattles);return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚔ Battles</h2><p class="text-white/45 text-sm mb-6">${bl.length} active battles</p>${bl.map(([id,b])=>`<div class="a-row"><span class="badge" style="color:${catOf(b.category).color}">${catOf(b.category).name}</span><div class="flex-1 min-w-[150px]"><b class="text-[13px]">${esc(b.title)}</b><div class="text-[10.5px] text-white/40">${fmt(votesOf(b))} votes · ends ${fmtDate(b.endsAt)} · by ${esc(b.creatorName||'?')}</div></div><button class="a-btn" onclick="openBattle('${id}')">View</button><button class="a-btn" onclick="adminViewVotes('${id}')">🗳 Votes</button><button class="a-btn danger" onclick="adminDelBattle('${id}')">Delete</button></div>`).join('')||emptyState('swords','No battles')}</div>`;}
function adminViewVotes(id){const b=allBattles[id];if(!b)return;const html=(b.options||[]).map((o)=>{const voters=Object.entries(o.votes||{}).map(([uid,ts])=>{const u=allUsers[uid];if(b.anon&&!SETTINGS.publicVoters)return `<div class="a-row"><span class="text-lg">🙈</span><b class="text-[12px]">Anonymous voter</b><span class="text-[10px] text-white/35" style="margin-left:auto">${fmtTime(ts)}</span></div>`;return `<div class="a-row"><img src="${(u||{}).avatar||AVATAR_PRESETS[0]}" class="w-7 h-7 object-cover"><b class="text-[12px]">${esc(u?u.name:'Unknown user')}</b>${uidChip(uid)}<span class="text-[10px] text-white/35" style="margin-left:auto">${fmtTime(ts)}</span></div>`;}).join('');return `<div class="mb-4"><div class="font-display font-bold text-[13.5px] mb-1.5">${esc(o.label)} — ${Object.keys(o.votes||{}).length} votes</div>${voters||'<div class="text-white/30 text-[11.5px] mb-2">No votes yet</div>'}</div>`;}).join('');$('#admin-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)document.getElementById('admin-root').innerHTML=''"><div class="modal-card scale-in"><div class="flex items-center justify-between mb-3"><b class="font-display text-[15px]">🗳 Votes ${b.anon?'(Anonymous Mode)':''}</b><button class="icobtn" style="width:34px;height:34px" onclick="document.getElementById('admin-root').innerHTML=''"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="text-[12px] text-white/50 mb-3">${esc(b.title)}</div>${html}</div></div>`;lucide.createIcons();}
function pageAdminPrivacy(){const accs = Object.values(adminAccounts || {}).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); return `<div class="max-w-3xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">🔒 Privacy & Accounts</h2><p class="text-white/45 text-sm mb-2">All accounts — sorted by creation date (Newest first)</p><div class="glass p-3 mb-4 text-[12px] text-white/55 flex items-center gap-2"><i data-lucide="eye" class="w-4 h-4 text-yellow-400"></i> Total accounts: ${accs.length}</div>${accs.map(a=>{const key=emailKey(a.email); return `<div class="a-row"><img src="${(allUsers[a.uid]||{}).avatar||AVATAR_PRESETS[0]}" class="w-10 h-10 object-cover"><div class="flex-1 min-w-[220px]"><div class="text-[14px] font-bold">👤 ${esc(a.name)} <span class="text-[10px] text-cyan-300 font-bold">${userCode(a.uid)}</span></div><div class="text-[12px] text-white/60">📧 ${esc(a.email)}</div><div class="text-[12px] font-bold" style="color:#FCD34D">🔑 ${esc(decPass(a.pw))}</div><div class="text-[10px] text-white/30 mt-1">📅 ${fmtDate(a.createdAt)}</div></div><button class="a-btn danger" onclick="adminDeleteAcc('${a.uid}', '${key}')">Delete Account</button></div>`;}).join('')||emptyState('lock','No accounts found')}</div>`;}
function pageAdminSettings(){return `<div class="max-w-2xl mx-auto fade-up">${adminBackBtn}<h2 class="font-display font-extrabold text-2xl mb-1">⚙ Settings & Themes</h2><p class="text-white/45 text-sm mb-6">Names, backgrounds, themes & toggles</p><div class="glass-strong p-6"><label class="lbl">Website Name</label><div class="flex gap-2 mb-3"><input id="ad-name" class="input-field" maxlength="20" value="${esc(SETTINGS.name)}"><button class="a-btn" onclick="adminSaveName()">Save</button></div><label class="lbl">Chatter App Name</label><div class="flex gap-2 mb-3"><input id="ad-cname" class="input-field" maxlength="20" value="${esc(SETTINGS.chatName)}"><button class="a-btn" onclick="adminSaveChatName()">Save</button></div>
<button class="btn-primary w-full py-3 font-bold mb-5 flex items-center justify-center gap-2" onclick="navAdmin('studio')" style="background:linear-gradient(135deg,#EC4899,#8B5CF6)"><i data-lucide="palette" class="w-4 h-4"></i> 🎨 Open Theme Studio — Generate & Mix New Backgrounds</button>
<label class="lbl">Pre-built Themes</label><div class="grid grid-cols-3 md:grid-cols-5 gap-2 mb-5 max-h-[300px] overflow-y-auto">${THEMES.map((t,i)=>`<div class="theme-sw ${SETTINGS.theme===i?'sel':''}" style="background:${t.bg||'radial-gradient(circle at 30% 30%,#312e81,#06070D)'}" onclick="adminSetTheme(${i})"><span>${t.n}</span></div>`).join('')}</div><label class="lbl">Toggles</label>
<div class="a-row"><span class="flex-1 text-[13px]">👁 Public "Who Voted" button on every battle</span><button class="a-btn" onclick="adminToggle('publicVoters')">${SETTINGS.publicVoters?'ON ✅':'OFF'}</button></div>
<div class="a-row"><span class="flex-1 text-[13px]">💬 Chat Lock</span><span class="badge" style="color:#10B981">🔒 Never lockable</span></div>
<div class="a-row"><span class="flex-1 text-[13px]">Clear ALL chats</span><button class="a-btn danger" onclick="clearChatNow()">Clear</button></div></div></div>`;}
async function adminBan(uid){await db.ref('meta/banned/'+uid).set(true);toast('User banned','success');}
async function adminUnban(uid){await db.ref('meta/banned/'+uid).remove();toast('User unbanned','info');}
async function adminVerify(uid){const u=allUsers[uid];if(!u)return;await db.ref('users/'+uid+'/verified').set(!u.verified);toast(u.verified?'Verified removed':'User verified ✅','success');}
async function adminGift(uid){const amtStr=prompt(`Enter custom XP amount to gift:`);const amt=parseInt(amtStr,10);if(isNaN(amt)||amt===0)return toast('Invalid amount','warning');const u=allUsers[uid];if(!u)return;const oldXP=u.xp||0;await db.ref('users/'+uid).update({xp:oldXP+amt});toast(`${amt} XP gifted successfully!`,'success');}
async function adminDeleteAcc(uid, key) {if(!confirm('PERMANENTLY DELETE this account and all related data?')) return;await db.ref('accounts/' + key).remove();await db.ref('users/' + uid).remove();await db.ref('presence/' + uid).remove();await db.ref('dms/' + uid).remove();await db.ref('notifs/' + uid).remove();db.ref('battles').orderByChild('creator').equalTo(uid).once('value', s => {s.forEach(child => { child.ref.remove(); });});adminAccounts = Object.fromEntries(Object.entries(adminAccounts).filter(([k]) => k !== key));render();toast('Account permanently deleted', 'error');}
async function adminDelBattle(id){if(!confirm('Delete this battle?'))return;await db.ref('battles/'+id).remove();await db.ref('comments/'+id).remove();toast('Battle deleted','info');}
async function adminSaveName(){const n=$('#ad-name').value.trim();if(!n)return;await db.ref('meta/settings/name').set(n);SETTINGS.name=n;toast('Website name saved','success');render();}
async function adminSaveChatName(){const n=$('#ad-cname').value.trim();if(!n)return;await db.ref('meta/settings/chatName').set(n);SETTINGS.chatName=n;toast('Chatter name saved','success');render();}
async function adminSetTheme(i){await db.ref('meta/settings/theme').set(i);await db.ref('meta/settings/customBg').remove();SETTINGS.theme=i;localStorage.setItem('basiler_theme',i);applySettings(SETTINGS);toast('Website theme: '+THEMES[i].n,'success');render();}
async function adminToggle(k){const v=!SETTINGS[k];await db.ref('meta/settings/'+k).set(v);SETTINGS[k]=v;toast(k+' → '+(v?'ON':'OFF'),'info');render();}

async function createDefaultBattles() {
    const snap = await db.ref('battles').once('value');
    const battles = snap.val() || {};
    const titles = Object.values(battles).map(b => b.title);
    const defaults = [
        {title: 'Messi vs Ronaldo — Who is the GOAT?', category: 'sports', options: [
            { label: 'Lionel Messi', img: 'https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg', votes: {} },
            { label: 'Cristiano Ronaldo', img: 'https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg', votes: {} }]},
        {title: 'Google vs Microsoft Edge — Best Browser?', category: 'tech', options: [
            { label: 'Google Chrome', img: 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Google_Chrome_icon_%28September_2014%29.svg', votes: {} },
            { label: 'Microsoft Edge', img: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Microsoft_Edge_logo_%282019%29.svg', votes: {} }]}];
    for (const def of defaults) {
        if (!titles.includes(def.title)) {
            await db.ref('battles').push({...def, creator: 'system', creatorName: 'Votify Bot', createdAt: Date.now(), endsAt: Date.now() + 86400000 * 7, tags: []});
        }
    }
}

(async()=>{
document.documentElement.style.setProperty('--bubble',bubbleColor);
lucide.createIcons();
applyDayNight();
try{const s=(await db.ref('meta/settings').once('value')).val()||{};SETTINGS={...SETTINGS,...s};applySettings(s);}catch(e){}
removeElonBattle();
createDefaultBattles();
const h=location.hash.match(/#battle=(.+)/);
if(h){view='battle';viewParam=h[1];}
const sess=JSON.parse(localStorage.getItem('basiler_session')||'null');
const impUid=isAdmin?localStorage.getItem('basiler_impersonate'):null;
if(impUid){
try{const u=(await db.ref('users/'+impUid).once('value')).val();
if(u){startApp({uid:impUid,...u});return;}}catch(e){}
localStorage.removeItem('basiler_impersonate');
}
if(sess&&sess.uid){try{const u=(await db.ref('users/'+sess.uid).once('value')).val();if(u){startApp({uid:sess.uid,...u});return;}}catch(e){}}
showAuth();})();
</script>
